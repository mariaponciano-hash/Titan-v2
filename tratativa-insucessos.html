<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tratativa Insucessos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  /* Paleta exata da Central de Tickets (mesmas custom properties do app real:
     :root em central-tickets.devgogroup.com) — não a paleta do brandbook de
     apresentações, e sim as cores/fundo que este componente vai herdar quando
     for embutido lá dentro. O app não tem modo escuro, então este arquivo
     também não tem. */
  :root {
    --ink: #0D0D0D;
    --ink-2: #444;
    --ink-3: #888;
    --ink-4: #bbb;
    --surface: #F7F7F5;
    --white: #FFFFFF;
    --border: #E4E4E0;
    --border-2: #D0D0CA;
    --blue: #2659A5;
    --blue-bg: #EAF0F9;
    --orange: #E05C1A;
    --orange-bg: #FDF0E8;
    --green: #1A7A4A;
    --green-bg: #E8F5EE;
    --yellow: #96780A;
    --yellow-bg: #FDF8E3;
    --gray: #555;
    --gray-bg: #F0F0EE;
    --purple: #6B21A8;
    --purple-bg: #F3E8FF;
    --cyan: #1B8FAE;
    --cyan-bg: #E7F6FA;
    --lime: #D7D900;
    --red: #E5381A;
    --red-bg: #FCE9E5;
    --radius: 6px;
    --radius-lg: 10px;

    --bg: var(--surface);
    --text: var(--ink);
    --text-muted: var(--ink-2);
    --text-faint: var(--ink-3);
    --shadow: 0 1px 2px rgba(13, 13, 13, 0.04), 0 8px 20px -12px rgba(13, 13, 13, 0.14);

    /* "Ativa" usa o verde semântico do app (mesmo tom de "concluído"/positivo);
       "inativa" fica neutra, sem cor. */
    --ativo-bg: var(--green-bg);
    --ativo-border: var(--green);
    --ativo-text: var(--green);
    --inativo-bg: var(--white);
    --inativo-border: var(--border-2);
    --inativo-text: var(--ink-3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 20px 60px; }

  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }

  .search {
    position: relative;
    width: 280px;
    max-width: 100%;
  }

  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .search input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    border-radius: 999px;
    border: 1px solid var(--border-2);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
  }

  .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38, 89, 165, 0.15); }

  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    background: var(--surface);
  }

  table.main {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 900px;
    font-size: 13.5px;
  }

  table.main thead th {
    font-family: "Poppins", Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--blue);
    text-align: left;
    padding: 12px 14px;
    white-space: nowrap;
  }

  table.main thead th:first-child { border-top-left-radius: 13px; }
  table.main thead th:last-child { border-top-right-radius: 13px; }

  table.main td {
    padding: 12px 14px;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }

  tr.macro-row { cursor: pointer; }
  tr.macro-row:hover td { background: var(--gray-bg); }
  tr.macro-row.open td { background: var(--gray-bg); }

  td.col-macro { border-left: 5px solid var(--kind-color); min-width: 200px; }

  .macro-inner { display: flex; align-items: center; gap: 9px; }

  .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    transition: transform 0.16s ease;
  }

  tr.macro-row.open .chevron.mode-all { transform: rotate(90deg); color: var(--kind-color); }

  .macro-label { font-weight: 700; font-size: 14px; }

  .kind-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--kind-color); flex-shrink: 0; }

  td.col-disparo, td.col-tratativa { color: var(--text-muted); font-size: 12.5px; line-height: 1.5; max-width: 240px; }

  td.col-carriers { min-width: 320px; }

  .carrier-pills { display: flex; flex-wrap: wrap; gap: 6px; }

  .carrier-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px 4px 7px;
    border-radius: 999px;
    border: 1px solid var(--inativo-border);
    background: var(--inativo-bg);
    color: var(--inativo-text);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    font-family: inherit;
  }

  .carrier-pill:hover { box-shadow: 0 0 0 2px rgba(38, 89, 165, 0.12); }
  .carrier-pill.active-pill { box-shadow: 0 0 0 2px var(--blue); }

  .carrier-pill.ativa { border-color: var(--ativo-border); background: var(--ativo-bg); color: var(--ativo-text); }

  .carrier-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  tr.detail-row td { background: var(--gray-bg); padding: 0; border-bottom: 1px solid var(--border); border-left: 5px solid var(--kind-color); }
  tr.detail-row.last td { border-bottom: none; }
  tr.macro-row.last-row td { border-bottom: none; }

  .detail-inner { padding: 6px 16px 16px; }

  .detail-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .detail-heading .count {
    font-size: 10.5px;
    font-weight: 700;
    background: var(--kind-color);
    color: var(--white);
    padding: 1px 8px;
    border-radius: 999px;
  }

  .micro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding-bottom: 6px; }

  .micro-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    position: relative;
  }

  .micro-tratativa-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 5px;
  }

  .micro-tratativa-tag.ativa { background: var(--lime); color: var(--ink); }
  .micro-tratativa-tag.inativa { background: var(--gray-bg); color: var(--text-faint); border: 1px solid var(--border); }
  .micro-tratativa-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .code-chip {
    font-family: "Poppins", Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--gray-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .micro-body { flex: 1; min-width: 0; }
  .micro-name { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .micro-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }

  .detail-empty { padding: 10px 0 16px; color: var(--text-faint); font-size: 12.5px; }

  mark { background: var(--lime); color: var(--ink); border-radius: 3px; padding: 0 2px; }

  .no-results { display: none; padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
</style>
</head>

<div class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 10.3L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search-input" type="text" placeholder="Buscar status, código ou transportadora…" aria-label="Buscar">
    </label>
  </div>

  <div class="table-scroll">
    <table class="main" id="main-table"></table>
  </div>
  <div class="no-results" id="no-results">Nenhum resultado encontrado.</div>
</div>

ser enviado e a transportadora já foi chamada.", "ativa": false}, {"codigo": "9", "nome": "SHIPPEDTESTE1", "descricao": "A entrega foi despachada do Centro de Distribuição. Aguarde os demais status de rastreamento.", "ativa": false}, {"codigo": "9037", "nome": "Mercadoria confiscada pela fiscalização", "descricao": "RETENCAO FISCAL", "ativa": false}, {"codigo": "ACO", "nome": "A Coletar", "descricao": "A Coletar", "ativa": false}, {"codigo": "BDR60", "nome": "Objeto encontra-se aguardando prazo para refugo", "descricao": "Objeto encontra-se aguardando prazo para refugo", "ativa": false}, {"codigo": "BDR78", "nome": "Objeto apreendido por órgão de fiscalização", "descricao": "Entrega impedida por autoridade. Verificar mensagem.", "ativa": false}, {"codigo": "CCD", "nome": "Chega no cliente destinatario", "descricao": "Entrega ao destinatário realizada com sucesso", "ativa": false}, {"codigo": "CCD1", "nome": "Aguardando autorização para reentrega", "descricao": "AGUARDANDO AUTORIZACAO PARA REENTREGA", "ativa": false}, {"codigo": "CCD8", "nome": "Resgate de mercadoria solicitada pelo cliente", "descricao": "RESGATE DE MERCADORIA SOLICITADA PELO CLIENTE", "ativa": false}, {"codigo": "CND", "nome": "Coletando", "descricao": "Coletando", "ativa": false}, {"codigo": "CO13", "nome": "Objeto não coletado", "descricao": "Objeto não coletado", "ativa": false}, {"codigo": "CO14", "nome": "Transformado em e-ticket", "descricao": "Transformado em e-ticket", "ativa": false}, {"codigo": "CORR_EVENT", "nome": "Favor desconsiderar a informação anterior", "descricao": "Favor desconsiderar a informação anterior", "ativa": false}, {"codigo": "Cust_123", "nome": "Entrega Realizada", "descricao": "Entrega Realizada", "ativa": false}, {"codigo": "FC56", "nome": "Objeto entregue na Caixa Postal", "descricao": "Objeto entregue na Caixa Postal", "ativa": false}, {"codigo": "FC63", "nome": "Direcionado para entrega em unidade dos Correios a pedido do cliente", "descricao": "Direcionado para e   // Cada macro status usa uma cor semântica diferente do próprio design system
  // da Central de Tickets (as mesmas cores usadas lá em badges de reembolso/
  // reenvio, status etc.) — 8 macro status, 8 cores, nenhuma repetida.
  const KIND_COLOR = {
    'EXTRAVIO': 'var(--red)',
    'AVARIA': 'var(--orange)',
    'DEVOLVIDO': 'var(--blue)',
    'RECUSA': 'var(--purple)',
    'ENDEREÇO NÃO LOCALIZADO': 'var(--cyan)',
    'DESTINATÁRIO AUSENTE': 'var(--yellow)',
    'RETIRADA': 'var(--lime)',
    'OUTROS': 'var(--gray)',
  };

  const mainTable = document.getElementById('main-table');
  const searchInput = document.getElementById('search-input');
  const noResults = document.getElementById('no-results');

  // open[macroIndex] = null (closed) | { mode: 'all' } | { mode: 'carrier', carrier: 'Dialogo' }
  const openState = {};

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>' + safe.slice(idx + q.length);
  }

  function itemMatches(it, q) {
    return it.nome.toLowerCase().includes(q) ||
      it.descricao.toLowerCase().includes(q) ||
      it.codigo.toLowerCase().includes(q);
  }

  // it.ativa já vem pronto do JSON: quando a planilha tem a coluna "Tratativa
  // CX" (Sim/Não) preenchida naquela linha, usa ela diretamente — é o dado
  // mais granular que existe. Só cai para o status geral da transportadora
  // naquele macro status quando a linha não tem essa coluna preenchida.
  function buildMicroItem(it, q) {
    const tag = it.ativa
      ? '<span class="micro-tratativa-tag ativa"><span class="dot"></span>Tratativa ativa</span>'
      : '<span class="micro-tratativa-tag inativa"><span class="dot"></span>Sem tratativa</span>';
    return '<div class="micro-item">' +
      '<span class="code-chip">' + esc(it.codigo) + '</span>' +
      '<div class="micro-body">' +
      tag +
      '<div class="micro-name">' + highlight(it.nome, q) + '</div>' +
      (it.descricao && it.descricao !== it.nome ? '<div class="micro-desc">' + highlight(it.descricao, q) + '</div>' : '') +
      '</div></div>';
  }

  function buildDetailContent(m, state, ql) {
    let items, heading;
    if (state.mode === 'carrier') {
      items = (m.carriers[state.carrier] || []);
      heading = 'Microstatus — ' + esc(state.carrier);
    } else {
      items = m.allMicro;
      heading = 'Todos os microstatus';
      // Agregado por código entre transportadoras: ativa se ao menos uma
      // ocorrência daquele código (em qualquer transportadora) estiver ativa.
    }
    if (ql) items = items.filter(it => itemMatches(it, ql));
    return '<div class="detail-inner">' +
      '<div class="detail-heading">' + heading + '<span class="count">' + items.length + '</span></div>' +
      (items.length
        ? '<div class="micro-grid">' + items.map(it => buildMicroItem(it, ql)).join('') + '</div>'
        : '<div class="detail-empty">Nenhum microstatus encontrado.</div>') +
      '</div>';
  }

  function buildTable(ql) {
    const theadHtml = '<thead><tr>' +
      '<th>Macrostatus</th>' +
      '<th>Disparo</th>' +
      '<th>Tratativa</th>' +
      '<th>Transportadoras</th>' +
      '</tr></thead>';

    let bodyRows = '';
    let visible = 0;

    DATA.macros.forEach((m, mi) => {
      const kindColor = KIND_COLOR[m.key] || 'var(--blue)';
      const kindStyle = '--kind-color: ' + kindColor + ';';

      let matches = true;
      if (ql) {
        const macroMatch = m.key.toLowerCase().includes(ql) || m.label.toLowerCase().includes(ql);
        const carrierMatch = DATA.carrierList.some(c => c.toLowerCase().includes(ql));
        const microMatch = m.allMicro.some(it => itemMatches(it, ql));
        matches = macroMatch || carrierMatch || microMatch;
      }
      if (!matches) return;
      visible++;

      let state = openState[mi] || null;
      if (ql && !state) state = { mode: 'all' };

      const isOpen = !!state;
      const pills = DATA.carrierList.map(c => {
        const entry = m.treatByCarrier.find(t => t.carrier === c);
        const ativa = entry && entry.ativa;
        const isActivePill = state && state.mode === 'carrier' && state.carrier === c;
        return '<button type="button" class="carrier-pill' + (ativa ? ' ativa' : '') + (isActivePill ? ' active-pill' : '') + '" data-mi="' + mi + '" data-carrier="' + esc(c) + '">' +
          '<span class="dot"></span>' + esc(c) + '</button>';
      }).join('');

      bodyRows += '<tr class="macro-row' + (isOpen ? ' open' : '') + '" data-mi="' + mi + '" style="' + kindStyle + '">' +
        '<td class="col-macro">' +
        '<div class="macro-inner"><span class="chevron mode-all"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 1l6 4-6 4V1z" fill="currentColor"/></svg></span>' +
        '<span class="kind-dot"></span><span class="macro-label">' + esc(m.label) + '</span></div>' +
        '</td>' +
        '<td class="col-disparo">' + esc(m.disparo) + '</td>' +
        '<td class="col-tratativa">' + esc(m.tratativa) + '</td>' +
        '<td class="col-carriers"><div class="carrier-pills">' + pills + '</div></td>' +
        '</tr>' +
        '<tr class="detail-row" data-mi="' + mi + '" style="display:' + (isOpen ? 'table-row' : 'none') + '">' +
        '<td colspan="4" style="' + kindStyle + '">' + (isOpen ? buildDetailContent(m, state, ql) : '') + '</td>' +
        '</tr>';
    });

    mainTable.innerHTML = theadHtml + '<tbody>' + bodyRows + '</tbody>';
    noResults.style.display = visible === 0 ? 'block' : 'none';
  }

  mainTable.addEventListener('click', e => {
    const ql = searchInput.value.trim().toLowerCase();

    const pill = e.target.closest('.carrier-pill');
    if (pill) {
      const mi = pill.dataset.mi;
      const carrier = pill.dataset.carrier;
      const current = openState[mi];
      if (current && current.mode === 'carrier' && current.carrier === carrier) {
        openState[mi] = null; // toggle closed
      } else {
        openState[mi] = { mode: 'carrier', carrier: carrier };
      }
      buildTable(ql);
      return;
    }

    const row = e.target.closest('tr.macro-row');
    if (row) {
      const mi = row.dataset.mi;
      const current = openState[mi];
      if (current && current.mode === 'all') {
        openState[mi] = null;
      } else {
        openState[mi] = { mode: 'all' };
      }
      buildTable(ql);
    }
  });

  searchInput.addEventListener('input', () => {
    buildTable(searchInput.value.trim().toLowerCase());
  });

  buildTable('');
</script>
