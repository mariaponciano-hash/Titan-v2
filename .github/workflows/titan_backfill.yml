name: Titan backfill diario

# Roda o titan_backfill.py duas vezes por dia (06h e 20h horario de Brasilia,
# = 09h e 23h UTC - Brasil nao tem horario de verao desde 2019, entao esse
# offset fixo de -3h nao muda ao longo do ano) pra uma janela deslizante dos
# ultimos 5 dias ate hoje, sem depender do PC da Ivna estar ligado - mesmo
# motivo do titan_watcher.py ter virado titan_cf_worker. Substitui a Tarefa
# Agendada "TitanBackfillDiario" do Windows (ver rodar_titan_backfill_diario.ps1)
# - desativar essa tarefa localmente depois de confirmar que isso funciona,
# pra nao rodar em duplicidade (upsert e idempotente, mas gasta tempo/execucao
# a toa). 5 dias e folga de sobra pra cobrir qualquer falha/skip de um dia
# especifico (ver _gerar_intervalos_diarios em titan_backfill.py) ate a
# proxima rodada pegar de novo, rodando 2x/dia.
on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
    - cron: '0 23 * * *'  # 20:00 BRT
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions, pra testar

jobs:
  backfill:
    runs-on: ubuntu-latest
    # titan_backfill.py exporta 'Informação Pedido' um dia por vez (ver
    # _gerar_intervalos_diarios) - ate 5 exportacoes nesta janela, cada uma
    # podendo levar ate 3min so esperando o download (ver expect_download em
    # titan_bi_scraper.exportar_dados_do_painel), somado aos 40min dos dois
    # rechecks (10min situacao presa + 30min eventos/itens). 120min da folga
    # real pro pior caso.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Calcular janela de 5 dias
        id: janela
        run: |
          echo "inicial=$(date -d '-5 days' +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"
          echo "final=$(date +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Rodar backfill
        env:
          TITAN_EMAIL: ${{ secrets.TITAN_EMAIL }}
          TITAN_SENHA: ${{ secrets.TITAN_SENHA }}
        run: |
          python titan_backfill.py \
            --data-inicial "${{ steps.janela.outputs.inicial }}" \
            --data-final "${{ steps.janela.outputs.final }}" \
            --headless

      # O runner some ao fim do job - sem isso, o print/HTML que
      # salvar_diagnostico() grava em titan_debug/ ficaria inacessivel
      # (diferente de rodar no PC, onde a pasta fica ali pra abrir direto).
      # "always()" em vez de "failure()" (28/08/2026, achado real): o passo
      # de recheck (rechecar_situacoes_presas) engole excecao por item -
      # o job inteiro "tem sucesso" mesmo com 100% dos itens falhando, entao
      # "if: failure()" nunca disparava e os prints/HTML ficavam perdidos
      # quando o runner terminava. if-no-files-found:ignore evita o passo
      # falhar sozinho na rodada normal (sem nenhum diagnostico salvo).
      - name: Subir diagnostico (se tiver)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan_debug
          path: titan_debug/
          retention-days: 7
          if-no-files-found: ignore
