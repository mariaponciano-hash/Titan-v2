name: Titan backfill diario

# Roda o titan_backfill.py duas vezes por dia (06h e 20h horario de Brasilia,
# = 09h e 23h UTC - Brasil nao tem horario de verao desde 2019, entao esse
# offset fixo de -3h nao muda ao longo do ano) pra uma janela deslizante do
# ultimo dia ate hoje, sem depender do PC da Ivna estar ligado - mesmo
# motivo do titan_watcher.py ter virado titan_cf_worker. Substitui a Tarefa
# Agendada "TitanBackfillDiario" do Windows (ver rodar_titan_backfill_diario.ps1)
# - desativar essa tarefa localmente depois de confirmar que isso funciona,
# pra nao rodar em duplicidade (upsert e idempotente, mas gasta tempo/execucao
# a toa).
#
# 1 dia (era 2, depois de ter sido 5 - 13/09/2026, pedido direto da Maria):
# reduz ainda mais o volume novo de pedidos por rodada precisando completar
# Eventos/Itens (ver _completar_eventos_itens em titan_backfill.py) - um
# pedido so tem no maximo 2 chances (as 2 rodadas do mesmo dia) antes da
# janela avancar e ele sair do escopo pra sempre; janela menor por si so
# nao muda esse limite de chances, so reduz quantos pedidos novos competem
# pelo orcamento de tempo em cada rodada.
on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
    - cron: '0 23 * * *'  # 20:00 BRT
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions, pra testar

jobs:
  backfill:
    runs-on: ubuntu-latest
    # titan_backfill.py faz UM export do painel 'Informação Pedido' pra
    # janela inteira (ate 3min so esperando o download, ver expect_download
    # em titan_bi_scraper.exportar_dados_do_painel) e completa Eventos/Itens
    # dos pedidos novos desta janela (ate 40min, ver EVENTOS_JANELA_
    # ORCAMENTO_SEGUNDOS - AUMENTADO de 10 pra 40min em 13/09/2026, achado
    # real: o job inteiro terminava em ~13min com o orcamento antigo de
    # 10min, sobrando ~47min nao usados antes deste timeout-minutes de 60).
    # O recheck amplo de qualquer pedido concluido do site inteiro
    # (EVENTOS_NULOS_RECHECK_ORCAMENTO_SEGUNDOS) NAO roda mais aqui - saiu
    # do fluxo principal a pedido da Maria (12/09/2026), so existe hoje via
    # --so-recheck, acionado pelo titan_recheck_eventos.yml (desativado).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Calcular janela de 1 dia
        id: janela
        run: |
          echo "inicial=$(date -d '-1 days' +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"
          echo "final=$(date +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Rodar backfill
        env:
          TITAN_EMAIL: ${{ secrets.TITAN_EMAIL }}
          TITAN_SENHA: ${{ secrets.TITAN_SENHA }}
        run: |
          python titan_backfill.py \
            --data-inicial "${{ steps.janela.outputs.inicial }}" \
            --data-final "${{ steps.janela.outputs.final }}" \
            --headless

      # O runner some ao fim do job - sem isso, o print/HTML que
      # salvar_diagnostico() grava em titan_debug/ ficaria inacessivel
      # (diferente de rodar no PC, onde a pasta fica ali pra abrir direto).
      # "always()" em vez de "failure()" (28/08/2026, achado real): os
      # passos de recheck/completar (eventos/itens, ambos) engolem excecao
      # por item - o job inteiro "tem sucesso" mesmo com 100% dos itens
      # falhando, entao
      # "if: failure()" nunca disparava e os prints/HTML ficavam perdidos
      # quando o runner terminava. if-no-files-found:ignore evita o passo
      # falhar sozinho na rodada normal (sem nenhum diagnostico salvo).
      - name: Subir diagnostico (se tiver)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan_debug
          path: titan_debug/
          retention-days: 7
          if-no-files-found: ignore
