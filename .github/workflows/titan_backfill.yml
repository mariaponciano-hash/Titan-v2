name: Titan backfill diario

# Roda o titan_backfill.py 1x por dia, as 06h horario de Brasilia (= 09h UTC -
# Brasil nao tem horario de verao desde 2019, entao esse offset fixo de -3h
# nao muda ao longo do ano) pra uma janela deslizante do ultimo dia ate hoje,
# sem depender do PC da Ivna estar ligado - mesmo motivo do titan_watcher.py
# ter virado titan_cf_worker. Substitui a Tarefa Agendada "TitanBackfillDiario"
# do Windows (ver rodar_titan_backfill_diario.ps1) - desativar essa tarefa
# localmente depois de confirmar que isso funciona, pra nao rodar em
# duplicidade (upsert e idempotente, mas gasta tempo/execucao a toa).
#
# VOLTOU A SER 1 RODADA/DIA (28/09/2026, pedido direto da Maria - "só precisa
# rodar uma vez por dia, já que está pegando as informações direitinho"):
# a rodada extra das 20h BRT foi removida. Antes disso rodava 2x/dia desde
# 13/09/2026 - motivo original (dar 2 chances por pedido antes da janela de
# 1 dia avancar) nao existe mais desde 16/09/2026 (itens vem do Metabase, nao
# depende mais de quantas rodadas o pedido pegou - ver ITENS VIA METABASE em
# titan_backfill.py).
#
# ACHADO REAL (28/09/2026): o GitHub Actions vem atrasando as rodadas
# agendadas por varias horas em relacao ao cron configurado (rodadas
# recentes com cron '0 9 * * *'/'0 23 * * *' dispararam de fato por volta de
# 13h-14h30 e 00h50-01h15 UTC, nao 09h/23h) - comportamento documentado do
# GitHub pra workflows agendados em repos com pouca atividade, fora do nosso
# controle. "06:00 BRT" aqui e a hora PEDIDA ao GitHub, nao uma garantia de
# hora exata de execucao.
on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
  workflow_dispatch:   # permite rodar manualmente pela aba Actions, pra testar
    inputs:
      completar_itens_atrasados:
        description: 'Pular o Titan e so tentar casar itens no Metabase pro intervalo abaixo (backlog preso fora da janela normal)'
        required: false
        type: boolean
        default: false
      data_inicial_itens:
        description: 'Data inicial DD/MM/AAAA (so usado com completar_itens_atrasados)'
        required: false
        type: string
      data_final_itens:
        description: 'Data final DD/MM/AAAA (so usado com completar_itens_atrasados)'
        required: false
        type: string
      completar_itens_sem_data_importado:
        description: 'Pular o Titan e so tentar casar itens no Metabase pras linhas com Data Importado NULO (placeholders pendente_titan)'
        required: false
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-latest
    # Exportacao nativa de 'Informação Pedido' pra janela inteira + upsert
    # no Supabase + busca de Itens no Metabase (16/09/2026, ver ITENS VIA
    # METABASE em titan_backfill.py) - tudo num job so agora. O job
    # completar-eventos (20 "workers" em sequencia, clique-por-pedido no
    # Titan) foi REMOVIDO junto com essa mudanca: eventos saiu do escopo do
    # backfill, e itens agora vem de uma consulta em lote ao Metabase
    # dentro deste mesmo job, sem precisar de artifact nem de job separado.
    # 60 (era 30) - achado real (22/09/2026, run #85): --completar-itens-
    # sem-data-importado com ~65 mil pendentes bateu no timeout de 30min
    # sem gravar nada (gargalo era o NUMERO de chamadas ao Metabase, ja
    # corrigido com TAMANHO_LOTE_METABASE - mas mantem margem maior aqui
    # tambem, ja que esse modo pode crescer mais que o backfill diario
    # normal, que sempre processa so 1 dia).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Calcular janela de 1 dia
        id: janela
        run: |
          echo "inicial=$(date -d '-1 days' +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"
          echo "final=$(date +'%d/%m/%Y')" >> "$GITHUB_OUTPUT"

      - name: Rodar backfill
        env:
          TITAN_EMAIL: ${{ secrets.TITAN_EMAIL }}
          TITAN_SENHA: ${{ secrets.TITAN_SENHA }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.completar_itens_atrasados }}" = "true" ]; then
            python titan_backfill.py \
              --completar-itens-atrasados \
              --data-inicial "${{ github.event.inputs.data_inicial_itens }}" \
              --data-final "${{ github.event.inputs.data_final_itens }}"
          elif [ "${{ github.event.inputs.completar_itens_sem_data_importado }}" = "true" ]; then
            python titan_backfill.py --completar-itens-sem-data-importado
          else
            python titan_backfill.py \
              --data-inicial "${{ steps.janela.outputs.inicial }}" \
              --data-final "${{ steps.janela.outputs.final }}" \
              --headless
          fi

      # O runner some ao fim do job - sem isso, o print/HTML que
      # salvar_diagnostico() grava em titan_debug/ ficaria inacessivel
      # (diferente de rodar no PC, onde a pasta fica ali pra abrir direto).
      # if-no-files-found:ignore evita o passo falhar sozinho na rodada
      # normal (sem nenhum diagnostico salvo).
      - name: Subir diagnostico (se tiver)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan_debug_export
          path: titan_debug/
          retention-days: 7
          if-no-files-found: ignore
