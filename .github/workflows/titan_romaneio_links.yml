name: Titan romaneio links

# Roda 15 min depois do backfill (09h15 e 23h15 UTC = 06h15/20h15 BRT), pra
# dar tempo do backfill ja ter deixado situacao=EMBARCADO fresquinho antes
# desta rodada tentar casar com os PDFs da pasta Romaneios do Drive. So
# leitura no Drive (escopo drive.readonly) e escrita no Supabase - nunca
# mexe no Titan/Cloudflare.
on:
  schedule:
    - cron: '15 9 * * *'   # 06:15 BRT
    - cron: '15 23 * * *'  # 20:15 BRT
  workflow_dispatch: {}

jobs:
  romaneio-links:
    runs-on: ubuntu-latest
    # 30min: agora busca 1x por romaneio unico (nao por pedido), mas o
    # backlog represado (mais de 1000 pedidos EMBARCADO sem link ainda) pode
    # deixar a primeira rodada real demorada - depois disso e incremental.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rodar
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python titan_romaneio_links.py
