name: Titan romaneio links

# Roda 15 min depois do backfill (09h15 e 23h15 UTC = 06h15/20h15 BRT), pra
# dar tempo do backfill ja ter deixado situacao=EMBARCADO fresquinho antes
# desta rodada casar o romaneio com o link do PDF. Desde 16/11/2026 a fonte
# dos links e a planilha "Registro dos arquivos baixados", nao mais a pasta
# Romaneios do Drive. Desde 17/11/2026 a planilha so abre para a Gocase, entao
# o script a baixa pela API do Drive com os secrets GOOGLE_OAUTH_* (os mesmos
# da versao do Drive). So escreve romaneio_link no Supabase.
on:
  schedule:
    - cron: '15 9 * * *'   # 06:15 BRT
    - cron: '15 23 * * *'  # 20:15 BRT
  workflow_dispatch:
    inputs:
      simular:
        description: 'So contar o que casaria, sem gravar link nem mexer no cursor'
        type: boolean
        default: false

jobs:
  romaneio-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Testes do script
        run: python -m unittest discover -s tests/python

      - name: Rodar
        env:
          SIMULAR: ${{ github.event.inputs.simular == 'true' && '1' || '' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python titan_romaneio_links.py
