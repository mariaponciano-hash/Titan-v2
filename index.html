    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Tipo de ocorrência</div><div class="ttb-meta-v">' + tVal(t.tipo_ocorrencia) + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Última atualização</div><div class="ttb-meta-v">' + tDataCurta(t.updated_at) + '</div></div>'
    +   '</div>'
    +   (t.motivo
        ? '<div class="ttb-contato"><div class="ttb-contato-k">Contato da transportadora (classificado pela IA)</div>'
          + '<div class="ttb-contato-v">' + tVal(t.motivo) + '</div></div>'
        : '')
    +   '<div class="ttb-hist-label">Histórico de e-mails'
    +     '<span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-4)">— clique numa mensagem para ler o conteúdo</span>'
    +   '</div>'
    +   '<div class="ttb-hist" id="' + torreHistId(t.thread_id) + '"></div>'
    +   renderTorreAcoes(t, i)
    + '</div>'
    + '</div>';

// Acoes da tratativa, na mesma ordem da tela inicial. Sao acoes REAIS (envio de
// e-mail pra transportadora, WhatsApp pro cliente, encerramento do ticket) -
// cada uma ja pede confirmacao dentro da propria funcao da Central, que e a
// mesma usada aqui. Ticket concluido nao mostra acao nenhuma, igual a Central.
function renderTorreAcoes(t, i) {
  var concluido = t.status === 'concluido';
  if (concluido) {
    return '<div class="ttb-acoes"><div class="ttb-acoes-aviso">Ticket encerrado — nenhuma ação disponível.</div></div>';
  }
  var tid = tEsc(t.thread_id);
  return '<div class="ttb-acoes">'
    + '<div class="ttb-acoes-label">Ações da tratativa</div>'
    + '<div class="field" style="margin-bottom:10px">'
    +   '<label class="field-label">Status do ticket</label>'
    +   '<select class="filter-select" style="width:100%;border-radius:6px" onclick="event.stopPropagation()" onchange="event.stopPropagation();torreAtualizarStatus(' + i + ', this.value, this)">'
    +     statusSelectOptions(t.status)
    +   '</select>'
    + '</div>'
    + '<div class="ttb-acoes-linha">'
    +   '<button class="ttb-acao ttb-acao-primaria" onclick="torreResponder(\'' + tid + '\')">'
    +     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +     'Responder</button>'
    +   '<button class="ttb-acao ttb-acao-cliente" onclick="torreContatarCliente(\'' + tid + '\', this)">'
    +     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +     'Contatar Cliente</button>'
    +   '<button class="ttb-acao ttb-acao-encerrar" onclick="torreEncerrarTicket(' + i + ')">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    +     'Encerrar Ticket</button>'
    + '</div></div>';
}

function torreResponder(threadId) {
  torreRegistrarTickets(torreState.dados);
  openResponder(threadId);
}

function torreContatarCliente(threadId, btnEl) {
  torreRegistrarTickets(torreState.dados);
  contatarCliente(threadId, btnEl);
}

// Encerramento proprio da Torre (nao reusa changeTicketStatus da Central porque
// aquela funcao redesenha a lista/contadores da tela inicial, que aqui nem
// existem - e recalcularia os contadores a partir de um allTickets que na Torre
// so tem os poucos tickets deste pedido, zerando a barra lateral).
function torreEncerrarTicket(i) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  if (!confirm('Encerrar este ticket?\n\n' + (t.assunto || t.thread_id) + '\n\nDepois de encerrado, nenhuma ação poderá ser feita nele.')) return;
  torreAtualizarStatus(i, 'concluido', null);
}

// Dropdown "Status do ticket" na Torre (24/08/2026, a pedido da Ivna) - mesma
// troca manual de status que ja existia na Central (ver changeTicketStatus),
// so que reescrita sobre torreState.dados/tickets_existentes em vez de
// allTickets/cid, porque a Torre nao usa a mesma tabela/linha expansivel.
// torreEncerrarTicket agora reusa esta funcao (era duplicado antes).
function torreAtualizarStatus(i, novoStatus, selectEl) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  if (selectEl) selectEl.disabled = true;
  updateTicketStatus(t.id, novoStatus, t.tabela).then(function(ok) {
    if (selectEl) selectEl.disabled = false;
    if (!ok) { alert('Erro ao atualizar status. Tente novamente.'); return; }
    t.status = novoStatus;
    if (t.raw) t.raw.Status_resposta_tickets = novoStatus;
    var emMemoria = allTickets.find(function(x) { return x.thread_id === t.thread_id; });
    if (emMemoria) emMemoria.Status_resposta_tickets = novoStatus;
    renderTorre();
  });
}

// Abre/fecha o painel. O historico so e buscado no primeiro clique (o webhook
// do n8n custa uma chamada por thread) - depois disso o threadCache global,
// compartilhado com a Central, ja responde na hora.
function torreToggleTicket(i) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  var cid = 'torre-tk-' + i;
  var det = document.getElementById('det-' + cid);
  var btn = document.getElementById('btn-' + cid);
  var lbl = document.getElementById('lbl-' + cid);
  if (!det) return;
  var abrindo = !det.classList.contains('open');
  det.classList.toggle('open', abrindo);
  if (btn) btn.classList.toggle('open', abrindo);
  if (lbl) lbl.textContent = abrindo ? 'Ocultar tratativa' : 'Ver tratativa';
  if (abrindo && det.dataset.carregado !== '1') {
    det.dataset.carregado = '1';
    // Registra o ticket em allTickets ANTES de carregar o historico: e o que
    // permite os botoes de acao (e o proprio loadHistorico) enxergarem o ticket.
    torreRegistrarTickets(torreState.dados);
    loadHistorico(torreHistId(t.thread_id), t.thread_id, t.remetente);
  }
}

// --- Formulario 100% pre-preenchido -------------------------------------
// AUTO-PREENCHIMENTO: todo campo que ja veio no JSON do pedido entra travado
// (readonly) e marcado como "preenchido automaticamente". O agente so decide o
// que a maquina nao sabe: qual e o problema e o que observar. Era exatamente
// a digitacao que o CX Hub exigia de novo, com o pedido ja aberto na tela ao
// lado - fonte classica de erro de digitacao em nº de pedido/NF.
function torrePreencherForm(d) {
  var p = d.pedido || {}, t = d.transportadora || {}, c = d.destinatario || {}, k = d.kpi || {};
  // Endereco completo numa linha so - e o que a transportadora cola no sistema
  // dela pra localizar a entrega.
  var endereco = [c.endereco, c.numero].filter(Boolean).join(', ');
  if (c.complemento) endereco += ' - ' + c.complemento;
  var enderecoCompleto = [endereco, c.bairro, [c.cidade, c.uf].filter(Boolean).join('/'), c.cep]
    .filter(Boolean).join(' · ');
  return {
    marca: (d.marca && d.marca.nome) || '',
    // Codigo da marca como aparece no Supabase (ex: "RITUARIA") - e o formato
    // usado no assunto dos tickets reais (ver torreGerarAssunto), diferente do
    // nome de exibicao ("Rituária") que so aparece na tela.
    marcaCodigo: (d.marca && d.marca.supabase) || '',
    // Id interno (ex: "gocase", "lescent") - usado so pra escolher a variante
    // certa de contato da transportadora (ver resolverContatoTransportadora),
    // que difere entre Gocase e as marcas Gobeaute pra varias transportadoras.
    marcaId: (d.marca && d.marca.id) || '',
    numero_pedido: p.numero_pedido || '',
    numero_nf: p.numero_nf || '',
    // Romaneio de verdade, ja confirmado pelo Titan BI (ver torreAtualizarUiTitan)
    // - diferente de romaneio_transportadora (Intelipost, sabidamente errado,
    // nunca sugerido). So existe se a consulta ja tiver terminado antes do
    // formulario ser (re)desenhado.
    romaneio_titan: p.romaneio_titan || '',
    // Dados que a transportadora exige pra localizar o volume (ver comentario
    // em initTicketsLogisticaTable no server.ts).
    cpf_destinatario: c.cpf || '',
    chave_danfe: p.chave_nf || '',
    plp_intelipost: p.plp_intelipost || '',
    romaneio_transportadora: p.romaneio_transportadora || '',
    endereco_entrega: enderecoCompleto,
    transportadora: t.nome || '',
    codigo_rastreio: t.codigo_rastreio || '',
    previsao_entrega: p.previsao_entrega ? String(p.previsao_entrega).slice(0, 10) : '',
    dias_atraso: (k.dias_atraso === null || k.dias_atraso === undefined) ? '' : k.dias_atraso,
    destinatario: c.nome || '',
    responsavel: AGENT || '',
    // Sugestao de problema: se esta atrasado, a categoria mais provavel ja vem
    // escolhida. E so uma sugestao - o agente troca no dropdown.
    problema: (k.dias_atraso !== null && k.dias_atraso !== undefined && k.dias_atraso > 0 && !k.entregue) ? 'Pedido Atrasado' : '',
  };
}

// --- Previa do e-mail (17/08/2026, a pedido da Ivna) --------------------
// Nao envia nada - so mostra como o e-mail FICARIA se fosse sair, seguindo o
// mesmo padrao dos tickets reais: assunto "NF <nf> - <problema> [<MARCA>]"
// (visto nos tickets carregados do Gmail, ex: "NF 940380 - Acareação
// [RITUARIA]") e corpo com os dados que a transportadora pede pra localizar
// o volume (ver bloco "Dados para a transportadora" no formulario acima).
// O campo "Para" fica vazio de proposito: o sistema nao tem, em lugar nenhum,
// o e-mail de contato de cada transportadora - so os enderecos das NOSSAS
// caixas Gmail (ver CONTAS em server.ts). Precisa ser preenchido a mao.
function torreIntroProblema(problema, f) {
  switch (problema) {
    case 'Pedido Atrasado':
      return 'Solicitamos posicionamento sobre o atraso na entrega do pedido abaixo'
        + (f.dias_atraso !== '' && f.dias_atraso > 0 ? ', que já está há ' + f.dias_atraso + (f.dias_atraso === 1 ? ' dia' : ' dias') + ' fora do prazo previsto' : '')
        + '.';
    case 'Acareação':
      return 'Solicitamos acareação (confronto de informações) sobre a situação atual do pedido abaixo.';
    case 'Alterar Endereço':
      return 'Solicitamos a atualização do endereço de entrega do pedido abaixo. O endereço correto, com localização no Google Maps, está detalhado a seguir.';
    case 'Barra Entrega':
      return 'Solicitamos que a entrega do pedido abaixo NÃO seja realizada até nova orientação nossa.';
    default:
      return 'Solicitamos posicionamento sobre o pedido abaixo.';
  }
}

function torreGerarAssunto(f) {
  var chaveNota = f.numero_nf || f.numero_pedido;
  return 'NF ' + chaveNota + ' - ' + (f.problema || 'Ocorrência') + ' [' + (f.marcaCodigo || f.marca || '').toUpperCase() + ']';
}

// Link de busca do Google Maps - NAO precisa de chave de API (e so um deep
// link com o texto do endereco, o proprio Maps geocodifica ao abrir). Usado
// no e-mail de "Alterar Endereço" pra transportadora nao ter duvida de qual e
// a localizacao correta.
function gerarUrlGoogleMaps(endereco) {
  if (!endereco || !endereco.trim()) return '';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(endereco.trim());
}

function torreGerarCorpoEmail(f, observacao) {
  var ehAlteracaoEndereco = f.problema === 'Alterar Endereço' && f.endereco_novo && f.endereco_novo.trim();
  var linhas = [
    'Prezados,',
    '',
    torreIntroProblema(f.problema, f),
    '',
    'Pedido: ' + (f.numero_pedido || '—'),
    'Nota fiscal: ' + (f.numero_nf || '—'),
    'Chave de acesso da NF-e: ' + (f.chave_danfe || '—'),
    'Romaneio: ' + (f.romaneio_transportadora || '—') + (f.plp_intelipost ? ' (PLP Intelipost: ' + f.plp_intelipost + ')' : ''),
    'Transportadora: ' + (f.transportadora || '—'),
    'Código de rastreio: ' + (f.codigo_rastreio || '—'),
    'Previsão de entrega: ' + (f.previsao_entrega ? tDataCurta(f.previsao_entrega) : '—'),
    '',
    'Destinatário: ' + (f.destinatario || '—'),
    'CPF: ' + (f.cpf_destinatario || '—'),
  ];
  if (ehAlteracaoEndereco) {
    linhas.push(
      'Endereço cadastrado (desatualizado): ' + (f.endereco_entrega || '—'),
      'Endereço correto para entrega: ' + f.endereco_novo.trim(),
      'Localização no Google Maps: ' + gerarUrlGoogleMaps(f.endereco_novo)
    );
  } else {
    linhas.push('Endereço de entrega: ' + (f.endereco_entrega || '—'));
  }
  if (observacao && observacao.trim()) {
    linhas.push('', 'Observação adicional: ' + observacao.trim());
  }
  linhas.push('', 'Aguardamos retorno o quanto antes.', '', 'Atenciosamente,', (f.responsavel || 'Equipe CX') + ' — CX Gogroup');
  return linhas.join('\n');
}

// Busca o e-mail cadastrado em Regras de Negocio > "E-mails de Contato das
// Transportadoras" (ver transportadorasEmailMap). Se o agente ainda nao
// visitou a aba Regras nesta sessao, window._regrasSalvo nao existe ainda -
// busca direto da API antes de montar a previa, em vez de depender de uma
// visita anterior a outra aba.
// Garante que window._regrasSalvo esteja carregado antes de resolver contato
// (o agente pode chegar na Torre sem nunca ter visitado a aba Regras nesta
// sessao).
async function garantirRegrasCarregadas() {
  if (window._regrasSalvo) return;
  try {
    const r = await fetchComTimeout('/api/regras-negocio', {}, 10000);
    if (r.ok) window._regrasSalvo = await r.json();
  } catch (e) {
    console.error('[garantirRegrasCarregadas] falha ao buscar regras:', e);
  }
}

async function torrePreviarEmail() {
  var d = torreState.dados;
  if (!d) return;
  var f = torrePreencherForm(d);
  f.problema = (document.getElementById('tf-problema') || {}).value || f.problema;
  f.responsavel = (document.getElementById('tf-responsavel') || {}).value || f.responsavel;
  // Romaneio e so uma sugestao (ver campoEditavel) - o agente pode ter
  // corrigido o valor no campo antes de gerar a previa, e e essa correcao

  f.romaneio_transportadora = (document.getElementById('tf-romaneio') || {}).value || '';

  // Zera anexos de uma previa anterior (ou do modal "Responder" da Central,

  window._anexos = [];

  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal">'

    +   '<div class="modal-body">'

    +     (contato.suportado ? '' : '<div class="torre-alert err" style="margin-bottom:1rem">' + tEsc(contato.motivo || '') + '</div>')
    +     '<div class="field"><label class="field-label">Para</label><input class="field-input" id="preview-para" type="text" value="' + safeAttr(contato.to.join(', ')) + '" placeholder="e-mail da transportadora"><p style="font-size:11px;color:var(--ink-3);margin-top:4px">' + tEsc(avisoPara) + '</p></div>'
    +     '<div class="field"><label class="field-label">Cc <span style="font-weight:400;text-transform:none;color:var(--ink-4)">(opcional)</span></label><input class="field-input" id="preview-cc" type="text" value="' + safeAttr(contato.cc.join(', ')) + '" placeholder="separado por vírgula"></div>'
    +     '<div class="field"><label class="field-label">Bcc <span style="font-weight:400;text-transform:none;color:var(--ink-4)">(opcional)</span></label><input class="field-input" id="preview-bcc" type="text" value="' + safeAttr(contato.bcc.join(', ')) + '" placeholder="separado por vírgula"></div>'
    +     '<div class="field"><label class="field-label">Assunto</label><input class="field-input" id="preview-assunto" value="' + safeAttr(assunto) + '"></div>'
    +     '<div class="field"><label class="field-label">Mensagem</label><textarea class="field-input" id="preview-msg" style="min-height:260px">' + tEsc(corpo) + '</textarea></div>'
    +     '<div class="field"><label class="field-label" style="margin-bottom:6px">Anexos <span style="font-weight:400;color:var(--ink-4);text-transform:none;font-size:11px">(NF, foto da avaria, comprovante...)</span></label><div id="anexos-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px"></div><label style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px dashed var(--border-2);border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--ink-3);transition:all .15s" onmouseover="this.style.borderColor=\'var(--blue)\';this.style.color=\'var(--blue)\'" onmouseout="this.style.borderColor=\'var(--border-2)\';this.style.color=\'var(--ink-3)\'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Adicionar arquivo<input type="file" id="resp-anexos" multiple accept="*/*" style="display:none" onchange="adicionarAnexos(this)"></label></div>'
    +     '<div class="modal-actions">'

    +         '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +         'Enviar e registrar ticket</button>'

function campoRO(label, valor) {
  var preenchido = valor !== '' && valor !== null && valor !== undefined;
  return '<div class="tf-field">'
    + '<label class="tf-label">' + label + (preenchido ? ' <span class="tf-prefilled">✓ automático</span>' : '') + '</label>'
    + '<input class="tf-input" readonly value="' + tEsc(preenchido ? valor : '—') + '">'
    + '</div>';
}

// Diferente de campoRO: o valor NAO e travado, porque nao e um fato
// confirmado - e so o melhor palpite que temos (ver comentario grande em
// normalizarIntelipost/romaneio_transportadora no server.ts sobre por que o
// romaneio da Intelipost nao bate com o do sistema de armazem real). O agente
// pode corrigir antes de mandar pra transportadora.
function campoEditavel(id, label, valor, confirmado) {
  var preenchido = valor !== '' && valor !== null && valor !== undefined;
  // "confirmado" (24/08/2026): diferencia um valor ja verificado no Titan BI
  // (selo verde) de um mero palpite tipo o antigo campo da Intelipost (selo
  // laranja de alerta) - so o romaneio do Titan usa isto hoje.
  var badge = !preenchido ? '' : (confirmado
    ? ' <span class="tf-prefilled" style="color:var(--green)">✓ confirmado no Titan BI</span>'
    : ' <span class="tf-prefilled" style="color:var(--orange)">⚠ sugestão, confira</span>');
  // "tf-romaneio-status" (24/08/2026): so existe pro campo do romaneio - e
  // onde torreSolicitarTitan()/torrePollTitanStatus() atualizam o texto via
  // DOM direto (sem re-renderizar o formulario, que apagaria outros campos
  // que o agente ja tivesse preenchido enquanto espera a resposta do Titan).
  return '<div class="tf-field">'
    + '<label class="tf-label">' + label + badge + '</label>'
    + '<input class="tf-input" id="' + id + '" value="' + tEsc(preenchido ? valor : '') + '" placeholder="Preencha se souber">'
    + (id === 'tf-romaneio' ? '<div id="tf-romaneio-status" style="font-size:10px;color:var(--ink-3);margin-top:4px"></div>'
        + '<div class="titan-loading-bar" id="tf-romaneio-bar"><div class="titan-loading-fill" id="tf-romaneio-fill"></div></div>' : '')
    + '</div>';
}

function renderTorreForm(d) {

  var opcoes = ['<option value="">Selecione...</option>'].concat(PROBLEMAS_CXHUB.map(function(p) {
    return '<option value="' + tEsc(p) + '"' + (f.problema === p ? ' selected' : '') + '>' + tEsc(p) + '</option>';
  })).join('');

  return '<div class="torre-form">'
    + '<div class="ttb-head" style="margin-bottom:1rem">'
    +   '<div><div class="ttb-title">Abrir Ticket de Logística</div>'

    + '</div>'
    + '<div class="tf-grid">'
    +   '<div class="tf-field">'
    +     '<label class="tf-label">Problema <span class="req">*</span></label>'
    +     '<select class="tf-select" id="tf-problema" onchange="torreAtualizarCamposProblema()">' + opcoes + '</select>'
    +   '</div>'
    +   '<div class="tf-field">'

    +   campoRO('Nº do Pedido', f.numero_pedido)
    +   campoRO('Nota Fiscal', f.numero_nf)
    +   campoRO('Transportadora', f.transportadora)
    +   campoRO('Código de rastreio', f.codigo_rastreio)
    +   campoRO('Previsão de entrega', f.previsao_entrega ? tDataCurta(f.previsao_entrega) : '')
    +   campoRO('Dias de atraso', f.dias_atraso === '' ? '' : String(f.dias_atraso))
    +   campoRO('Destinatário', f.destinatario)
    +   '<div class="tf-field full" style="margin-top:.2rem">'
    +     '<div class="tf-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)">'
    +       'Dados para a transportadora localizar a entrega</div>'
    +   '</div>'
    +   campoRO('CPF do destinatário', f.cpf_destinatario)
    +   campoRO('Chave DANFE', f.chave_danfe)
    // Sem valor pre-preenchido de proposito (24/08/2026, a pedido da Ivna): o
    // numero que a Intelipost devolve pra esse campo nao bate com o romaneio
    // real do sistema de armazem (ver comentario grande acima) - sugerir esse
    // valor errado e pior do que deixar em branco pro agente preencher se

    // depois, assincrona, e so preenche se o agente ainda nao tiver digitado

    +   campoEditavel('tf-romaneio', 'Romaneio', f.romaneio_titan, true)
    +   campoRO('PLP (lote de postagem)', f.plp_intelipost)
    +   '<div class="tf-field full">'
    +     '<label class="tf-label">Endereço de entrega'

    +     '<input class="tf-input" readonly value="' + tEsc(f.endereco_entrega || '—') + '">'
    +   '</div>'
    // So aparece pra "Alterar Endereço" (ver torreAtualizarCamposProblema).
    // display:none por padrao porque nenhuma sugestao automatica de problema
    // resulta em "Alterar Endereço" - so o proprio agente escolhe isso.
    +   '<div class="tf-field full" id="tf-grupo-endereco-novo" style="display:' + (f.problema === 'Alterar Endereço' ? 'block' : 'none') + '">'
    +     '<label class="tf-label">Endereço novo (correto) <span class="req">*</span></label>'
    +     '<input class="tf-input" id="tf-endereco-novo" placeholder="Rua, número, bairro, cidade/UF, CEP" oninput="torreAtualizarLinkMaps()">'
    +     '<a href="#" id="tf-link-maps" target="_blank" rel="noopener" style="display:none;font-size:11px;color:var(--blue);margin-top:5px">Ver no Google Maps ↗</a>'
    +   '</div>'
    +   '<div class="tf-field full">'
    +     '<label class="tf-label">Observação para a transportadora</label>'
    +     '<textarea class="tf-textarea" id="tf-observacao" placeholder="Contexto adicional do caso (opcional)"></textarea>'
    +   '</div>'
    + '</div>'
    + '<div class="tf-actions">'
    +   '<button class="torre-btn torre-btn-ghost" onclick="torreFecharForm()">Cancelar</button>'
    // Sem opcao de "so registrar" (removida 18/08/2026, a pedido da Ivna): o
    // proposito de abrir um ticket de logistica e contatar a transportadora -
    // um registro que nao contata ninguem contradiz esse proposito. Agora a
    // UNICA forma de abrir o ticket e passando pela previa e mandando o
    // e-mail de verdade (ver torrePreviarEmail / torreEnviarEmailReal).
    +   '<button class="torre-btn" onclick="torrePreviarEmail()">Ver prévia e enviar e-mail</button>'
    + '</div>'
    + '</div>';
}

function renderTorreResultado(d) {
  var fontes = d.fontes || {};
  var marcaNome = (d.marca && d.marca.nome) || '';
  var html = '<div class="torre-fontes">'
    + '<span class="fonte-pill ' + (fontes.intelipost ? 'on' : '') + '">Intelipost ' + (fontes.intelipost ? '✓' : '—') + '</span>'
    + '<span class="fonte-pill ' + (fontes.shopify ? 'on' : '') + '">Shopify ' + (fontes.shopify ? '✓' : '—') + '</span>'
    + (marcaNome ? '<span class="fonte-pill on">' + tEsc(marcaNome) + '</span>' : '')
    + '</div>';

  if (!fontes.intelipost) {
    html += '<div class="torre-alert warn">Este pedido ainda não aparece na Intelipost — os dados abaixo vêm só da Shopify. '
      + 'Normalmente significa que o pedido ainda não foi faturado/despachado, então não há rastreio nem previsão de entrega.</div>';
  }

  var outros = d.outros_pedidos_cliente || [];
  if (outros.length) {
    html += '<div class="torre-ticket-box" style="padding:.9rem 1.1rem">'
      + '<div class="ttb-sub"><b>Outros pedidos deste cliente</b> — clique para abrir a visão 360 dele:</div>'
      + '<div class="torre-outros">'
      + outros.map(function(o) {
          return '<button class="outro-pedido" onclick="torreBuscarPedido(\'' + tEsc(o.numero_pedido) + '\')">'
            + tEsc(o.numero_pedido) + ' <span style="color:var(--ink-4)">· ' + tDataCurta(o.data) + '</span></button>';
        }).join('')
      + '</div></div>';
  }

  html += renderTorreKpis(d);
  html += renderTorreTickets(d);
  // Timeline logo abaixo da caixa de ticket (18/08/2026, a pedido da Ivna) -
  // depois de ver se ja existe ticket aberto, o proximo que o agente quer e o
  // historico de rastreio, antes mesmo dos blocos de dados do pedido.
  html += renderTorreTimeline(d);
  html += renderTorreBlocos(d);
  return html;
}

// --- Acoes ---------------------------------------------------------------
function torreBuscar() {
  var inp = document.getElementById('torre-termo');
  var sel = document.getElementById('torre-marca');
  var termo = inp ? inp.value.trim() : '';
  if (sel) torreState.marca = sel.value;
  if (!termo) { alert('Digite o nº do pedido ou o CPF do cliente.'); return; }
  torreState.termo = termo;
  torreState.formAberto = false;
  torreState.resultadoEnvio = null;
  torreState.erro = '';
  torreState.carregando = true;
  torreState.dados = null;
  renderTorre();

  var u = '/api/logistica/buscar?termo=' + encodeURIComponent(termo) + '&marca=' + encodeURIComponent(torreState.marca);
  fetch(u)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      torreState.carregando = false;
      if (!res.ok || res.j.error) {
        torreState.erro = res.j.error || 'Não foi possível buscar o pedido.';
        torreState.dados = null;
      } else {
        torreState.dados = res.j;
      }
      renderTorre();
      if (torreState.dados) torreSolicitarTitan();
    })
    .catch(function(e) {
      torreState.carregando = false;
      torreState.erro = 'Erro de rede ao consultar: ' + (e && e.message ? e.message : e);
      renderTorre();
    });
}

// Pede pro Titan BI consultar o romaneio de verdade deste pedido (24/08/2026,
// a pedido da Ivna). O trabalho pesado (login no Titan, scraping) roda num
// script Python no PC dela, nunca aqui - isso so avisa uma fila no Supabase
// (POST /api/logistica/titan-solicitar) e fica de olho no resultado
// (torrePollTitanStatus). Se o script nao estiver rodando naquele momento, o
// pedido so fica "pendente" pra sempre e o polling desiste depois de um
// tempo - tanto o campo do formulario quanto o painel "Dados do Pedido"
// continuam mostrando/editando isso manualmente o tempo todo.
// Chamada tanto ao pesquisar (torreBuscar) quanto ao abrir o form
// (torreAbrirForm) - o backend so enfileira de verdade na primeira vez
// (ver /api/logistica/titan-solicitar), as chamadas seguintes so conferem o
// status atual; chamar de novo ao abrir o form garante que os elementos
// "tf-romaneio-*" (que so existem depois desse clique) recebam o resultado
// mesmo se o polling da busca original ja tiver terminado antes disso.
// CHAVE = (NOTA FISCAL, MARCA) - migrado de so-NF em 24/08/2026 depois de
// confirmar com print real da tela do Titan que a MESMA NF aparece em mais
// de uma linha (uma por marca), cada uma com romaneio DIFERENTE (ver
// comentario grande no endpoint /api/logistica/titan-solicitar em
// server.ts). Pedido sem NF emitida ainda nao tem como ser consultado - nem
// tenta, so deixa os campos em branco pra edicao manual.
function torreSolicitarTitan() {
  var d = torreState.dados;
  var numeroNf = d && d.pedido && d.pedido.numero_nf;
  var marca = d && d.marca && d.marca.id;
  if (!numeroNf || !marca) return;
  torreState._titanInicioMs = Date.now(); // pra mostrar "(Xs)" enquanto espera
  torreAtualizarUiTitan({ status: 'pendente' }, 0);

  fetch('/api/logistica/titan-solicitar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      numero_nf: numeroNf,
      numero_pedido: d.pedido.numero_pedido || '',
      marca: marca,
    }),
  })
    .then(function() { torrePollTitanStatus(numeroNf, marca, 0); })
    .catch(function() { /* falha silenciosa - os campos continuam editaveis na mao */ });
}

var TORRE_TITAN_INTERVALO_MS = 4000;
var TORRE_TITAN_MAX_TENTATIVAS = 20; // ~80s de espera antes de desistir

function torrePollTitanStatus(numeroNf, marca, tentativa) {
  fetch('/api/logistica/titan-status?nf=' + encodeURIComponent(numeroNf) + '&marca=' + encodeURIComponent(marca))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var terminou = torreAtualizarUiTitan(d, tentativa);
      if (terminou) return;
      if (tentativa < TORRE_TITAN_MAX_TENTATIVAS) {
        setTimeout(function() { torrePollTitanStatus(numeroNf, marca, tentativa + 1); }, TORRE_TITAN_INTERVALO_MS);
      } else {
        torreAtualizarUiTitan({ status: 'timeout' }, tentativa);
      }
    })
    .catch(function() { /* falha silenciosa - so nao atualiza nada nesta rodada */ });
}

// Atualiza os DOIS lugares da tela que podem mostrar o romaneio do Titan: o
// painel "Dados do Pedido" (dp-romaneio-*, sempre existe depois de uma busca
// com sucesso) e o campo do formulario de abertura de ticket (tf-romaneio*,
// so existe se o agente ja clicou "Abrir Ticket"). Faz isso via DOM direto
// (nunca chamando renderTorre() de novo), pra nao perder nada que o agente
// ja tenha preenchido em outros campos enquanto espera. Devolve true quando
// chegou a um estado final (concluido/erro/timeout/inexistente) - o polling
// para de tentar; false quando ainda esta 'pendente'.
// Barra de progresso (24/08/2026, a pedido da Ivna): enquanto 'pendente',
// enche proporcional a tentativa/TORRE_TITAN_MAX_TENTATIVAS (nunca chega a
// 100% sozinha - so quando realmente conclui), e o texto mostra os segundos
// decorridos (torreState._titanInicioMs, guardado no momento em que a
// consulta comecou) - assim o agente ve que esta processando, nao travado.
function torreAtualizarUiTitan(d, tentativa) {
  var statusForm = document.getElementById('tf-romaneio-status');
  var inputForm = document.getElementById('tf-romaneio');
  var barForm = document.getElementById('tf-romaneio-bar');
  var fillForm = document.getElementById('tf-romaneio-fill');
  var statusPainel = document.getElementById('dp-romaneio-status');
  var valorPainel = document.getElementById('dp-romaneio-valor');
  var barPainel = document.getElementById('dp-romaneio-bar');
  var fillPainel = document.getElementById('dp-romaneio-fill');
  // Agente trocou de pedido/saiu da tela - nada pra atualizar, para de tentar.
  if (!statusForm && !statusPainel) return true;

  function aplicar(texto, cor, valorConfirmado, percentual) {
    if (statusForm) { statusForm.textContent = texto; statusForm.style.color = cor; }
    if (statusPainel) { statusPainel.textContent = texto; statusPainel.style.color = cor; }
    if (valorConfirmado) {
      if (inputForm && !inputForm.value) inputForm.value = valorConfirmado; // nunca sobrescreve digitacao manual
      if (valorPainel) valorPainel.textContent = valorConfirmado;
      // Guarda na "memoria" da tela (24/08/2026, bug real reportado pela
      // Ivna): sem isso, o valor so vivia no DOM - abrir/fechar o formulario
      // chama renderTorre(), que redesenha "Dados do Pedido" do zero a partir
      // de torreState.dados, que nunca tinha aprendido esse valor, entao o
      // "—" voltava mesmo com a consulta ja concluida.
      if (torreState.dados && torreState.dados.pedido) torreState.dados.pedido.romaneio_titan = valorConfirmado;
    }
    var mostrarBarra = percentual != null;
    [barForm, barPainel].forEach(function(b) { if (b) b.style.display = mostrarBarra ? 'block' : 'none'; });
    [fillForm, fillPainel].forEach(function(f) { if (f) f.style.width = (percentual || 0) + '%'; });
  }

  if (d.status === 'concluido') {
    if (d.romaneio) aplicar('✓ confirmado no Titan BI - confira antes de repassar.', 'var(--green)', d.romaneio, null);
    else aplicar('Titan BI consultado, mas não achou romaneio para este pedido.', 'var(--ink-3)', null, null);
    return true;
  }
  if (d.status === 'erro') {
    aplicar('Titan BI: ' + (d.erro || 'erro desconhecido') + '.', 'var(--red)', null, null);
    return true;
  }
  if (d.status === 'inexistente') { aplicar('', 'var(--ink-3)', null, null); return true; }
  if (d.status === 'timeout') {
    aplicar('Titan BI não respondeu a tempo - confirme se o script está rodando no seu PC.', 'var(--orange)', null, null);
    return true;
  }
  // 'pendente'
  var elapsedS = torreState._titanInicioMs ? Math.round((Date.now() - torreState._titanInicioMs) / 1000) : 0;
  var percentual = Math.min(95, Math.round((tentativa / TORRE_TITAN_MAX_TENTATIVAS) * 95));
  aplicar('Consultando no Titan BI... (' + elapsedS + 's)', 'var(--ink-3)', null, percentual);
  return false;
}

// emailInfo = { para, assunto, mensagem } - vem da previa (ver
// torreEnviarEmailReal). Abrir um ticket de logistica SEMPRE envia um e-mail
// de verdade pra transportadora agora (removido 18/08/2026, a pedido da Ivna,
// o caminho de "so registrar sem contatar ninguem" - contradizia o proposito
// de abrir o ticket).
//
// PRA ONDE VAI O E-MAIL: o botao "Responder" da Central so funciona em cima
// de uma thread que ja existe (ver getParaFromThread - ele copia o remetente
// da propria conversa). Aqui nao ha conversa nenhuma ainda, entao mandamos um
// e-mail NOVO direto pro mesmo WEBHOOK_ENVIAR (n8n) que a Central ja usa -
// sem thread_id/message_id, porque nao ha thread pra responder. O resultado
// (sucesso ou falha) e sempre registrado no ticket local, mesmo se o envio
// falhar - assim nunca existe um "enviado" fantasma: se o e-mail falhou,
// resultadoEnvio.erro deixa isso explicito pro agente.
function torreEnviarTicket(emailInfo) {
  var d = torreState.dados;
  if (!d) return;
  var problema = (document.getElementById('tf-problema') || {}).value || '';
  var responsavel = (document.getElementById('tf-responsavel') || {}).value || '';
  var observacao = (document.getElementById('tf-observacao') || {}).value || '';
  // Capturado ANTES do renderTorre() abaixo, que redesenha #main-content e
  // reconstroi o formulario do zero (perdendo qualquer correcao manual que o
  // agente tenha feito no campo, ver campoEditavel) - mesmo motivo pelo qual
  // problema/responsavel/observacao ja eram lidos aqui em vez de depois.
  var romaneioCorrigido = (document.getElementById('tf-romaneio') || {}).value || '';
  var enderecoNovo = (document.getElementById('tf-endereco-novo') || {}).value || '';
  if (!problema) { alert('Selecione o problema.'); return; }
  if (!responsavel.trim()) { alert('Informe o responsável.'); return; }

  var f = torrePreencherForm(d);
  f.romaneio_transportadora = romaneioCorrigido;
  f.endereco_novo = enderecoNovo;
  torreState.enviando = true;
  renderTorre();

  // NOTA (18/08/2026): cc/bcc sao enviados no payload por melhor esforco - o
  // WEBHOOK_ENVIAR foi originalmente feito so pro botao "Responder" (que nunca
  // usava Cc/Bcc), entao nao tenho confirmacao de que o workflow n8n do outro
  // lado realmente usa esses campos pra montar o e-mail. Se o n8n ignorar,
  // o e-mail ainda sai certo pro destinatario principal (Para) - so o Cc/Bcc
  // silenciosamente nao vai. Vale confirmar com quem mantem o n8n.
  // Anexos (24/08/2026): mesmo formato [{name,type,data(base64)}] que o
  // "Responder" da Central ja manda - o n8n ja sabia lidar com isso (ver
  // Code "Montar MIME com anexos"), so a Torre nunca preenchia esse campo.
  fetch(WEBHOOK_ENVIAR, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ para: emailInfo.para, cc: emailInfo.cc || '', bcc: emailInfo.bcc || '', assunto: emailInfo.assunto, mensagem: emailInfo.mensagem, thread_id: '', message_id: '', anexos: emailInfo.anexos || [] }),
  })
    .then(function(r) { return r.text().then(function(t) { return { ok: r.ok, status: r.status, texto: t }; }); })
    .catch(function(e) { return { ok: false, status: 0, texto: String((e && e.message) || e) }; })
    .then(function(resultadoEmail) {
      var payloadTicket = {
        marca: f.marca, problema: problema, numero_pedido: f.numero_pedido, numero_nf: f.numero_nf,
        transportadora: f.transportadora, codigo_rastreio: f.codigo_rastreio, previsao_entrega: f.previsao_entrega,
        dias_atraso: f.dias_atraso === '' ? null : Number(f.dias_atraso), destinatario: f.destinatario,
        cpf_destinatario: f.cpf_destinatario, chave_danfe: f.chave_danfe, plp_intelipost: f.plp_intelipost,
        romaneio_transportadora: f.romaneio_transportadora, endereco_entrega: f.endereco_entrega,
        endereco_novo: f.endereco_novo || '', maps_url: gerarUrlGoogleMaps(f.endereco_novo),
        observacao: observacao, responsavel: responsavel,
        email_para: emailInfo.para, email_cc: emailInfo.cc || '', email_bcc: emailInfo.bcc || '',
        email_assunto: emailInfo.assunto, email_enviado: resultadoEmail.ok,
        email_resposta: 'HTTP ' + resultadoEmail.status + ': ' + resultadoEmail.texto.slice(0, 300),
      };

      return fetch('/api/logistica/abrir-ticket', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadTicket),
      })
        .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
        .then(function(res) {
          torreState.enviando = false;
          torreState.formAberto = false;
          var ticketOk = !!(res.ok && res.j.ok);
          var protocolo = ticketOk ? res.j.protocolo : '';
          var erroTicket = ticketOk ? '' : (res.j && res.j.error ? res.j.error : 'erro desconhecido');

          // 4 combinacoes possiveis (e-mail ok/falhou cruzado com ticket
          // ok/falhou) - cada uma com seu proprio titulo, pra nunca dizer
          // "falha ao registrar" quando o ticket na verdade foi gravado (so o
          // e-mail que nao saiu), nem "enviado" quando so o e-mail saiu sem
          // deixar registro.
          if (resultadoEmail.ok && ticketOk) {
            torreState.resultadoEnvio = { classe: 'ok', titulo: 'Ticket registrado — protocolo ' + protocolo + '.', mensagem: 'E-mail real enviado para ' + emailInfo.para + '.' };
          } else if (resultadoEmail.ok && !ticketOk) {
            // Pior caso: o e-mail JA SAIU pra transportadora, mas nao ficou
            // registro nenhum aqui. Precisa de acao manual - por isso 'err' e
            // nao 'warn', mesmo o e-mail tendo sido enviado com sucesso.
            torreState.resultadoEnvio = { classe: 'err', titulo: 'E-mail enviado, mas o ticket NÃO foi registrado.', mensagem: 'Anote isso manualmente - erro ao salvar: ' + erroTicket };
          } else if (!resultadoEmail.ok && ticketOk) {
            torreState.resultadoEnvio = { classe: 'warn', titulo: 'Ticket registrado — protocolo ' + protocolo + '.', mensagem: 'O envio do e-mail falhou: ' + payloadTicket.email_resposta };
          } else {
            torreState.resultadoEnvio = { classe: 'err', titulo: 'Falha no e-mail e no registro do ticket.', mensagem: 'E-mail: ' + payloadTicket.email_resposta + ' | Ticket: ' + erroTicket };
          }
          closeModal();
          renderTorre();
        });
    })
    .catch(function(e) {
      torreState.enviando = false;
      torreState.resultadoEnvio = { classe: 'err', titulo: 'Falha ao registrar o ticket.', mensagem: String((e && e.message) || e) };
      renderTorre();
    });
}

// Botao "Enviar" dentro da previa - dispara o e-mail de verdade. Sempre
// confirma antes (mesmo padrao do contatarCliente da Central), porque e uma

function torreEnviarEmailReal() {

  var anexos = window._anexos || [];
  var confirmacao = 'Confirma o envio deste e-mail para ' + para + '?'
    + (cc.trim() ? '\nCc: ' + cc : '') + (bcc.trim() ? '\nBcc: ' + bcc : '')
    + (anexos.length ? '\nAnexos: ' + anexos.map(function(a) { return a.name; }).join(', ') : '')
    + '\n\nEssa ação é real e não pode ser desfeita.';
  if (!confirm(confirmacao)) return;

  var btn = document.getElementById('preview-btn-enviar');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
  torreEnviarTicket({ para: para.trim(), cc: cc.trim(), bcc: bcc.trim(), assunto: assunto, mensagem: mensagem, anexos: anexos });
}

    + '<div style="margin-top:.5rem">' + linhas + '</div>';
}

function unilogBuscar() {
  var inp = document.getElementById('unilog-termo');
  var termo = inp ? inp.value.trim() : '';
  if (!termo) { alert('Digite a NF ou o nº do pedido.'); return; }
  unilogState.termo = termo;
  unilogState.erro = '';
  unilogState.avisoTorre = '';
  unilogState.candidatos = null;
  unilogState.candidatoTitan = null;
  unilogState.carregando = true;
  unilogState.dados = null;
  unilogState.titan = null;
  unilogState.titanStatus = '';
  renderUnilog();

  // Antes de deixar a Torre "adivinhar" a marca, confere no Titan (leitura do
  // que ja esta cacheado em infos_titan, sem disparar consulta nova) se essa
  // NF ja aparece em mais de uma marca - ver comentario grande em
  // renderUnilogCandidatos sobre o bug real que motivou isso.
  fetch('/api/logistica/titan-candidatos?nf=' + encodeURIComponent(termo))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      var candidatos = (res && res.candidatos) || [];
      if (candidatos.length > 1) {
        unilogState.carregando = false;
        unilogState.candidatos = candidatos;
        renderUnilog();
        return;
      }
      var unico = candidatos.length === 1 ? candidatos[0] : null;
      unilogUsarCandidato(unico);
      unilogBuscarComMarca(termo, unico ? unico.marca : null);
    })
    .catch(function() {
      // Falha ao checar candidatos nao pode travar a busca normal - segue
      // com a deteccao automatica de sempre.
      unilogBuscarComMarca(termo, null);
    });
}

function unilogEscolherCandidato(marca) {
  var candidato = (unilogState.candidatos || []).filter(function(c) { return c.marca === marca; })[0] || null;
  unilogState.candidatos = null;
  unilogUsarCandidato(candidato);
  unilogBuscarComMarca(unilogState.termo, marca);
}

// FONTE PRINCIPAL pra Unilog CD (25/08/2026, bug real: a Torre so acha um
// pedido via Intelipost/Shopify se ja existir ticket de atendimento pra
// traduzir NF->pedido - pedidos que o Titan conhece mas nunca geraram
// ticket, que e o uso normal da Unilog CD, nao tem essa ponte e a busca da
// Torre falhava, derrubando a tela inteira mesmo com o Titan/Supabase ja
// tendo tudo certo). Usa o candidato (que ja vem do infos_titan, a mesma
// fonte que titan-candidatos leu) pra mostrar romaneio/situacao IMEDIATAMENTE
// e buscar o documento completo (eventos/itens) direto - sem depender da
// Torre pra nada disso. A Torre continua sendo chamada em paralelo (ver
// unilogBuscarComMarca), mas so pra CNPJ/EAN - se ela falhar, a tela
// continua de pe com o que o Titan ja confirmou.
function unilogUsarCandidato(candidato) {
  unilogState.candidatoTitan = candidato || null;
  if (!candidato) return;
  unilogState.titan = candidato;
  unilogState.titanStatus = candidato.status || 'concluido';
  unilogState._titanInicioMs = Date.now();
  fetch('/api/logistica/titan-solicitar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ numero_nf: unilogState.termo, numero_pedido: candidato.numero_pedido || '', marca: candidato.marca }),
  })
    .then(function() { unilogPollTitanStatus(unilogState.termo, candidato.marca, 0); })
    .catch(function() { /* falha silenciosa - o painel so fica com o que a lista de candidatos ja trouxe */ });
}

// Quando a Torre nao acha o pedido, monta um "d" sintetico so com o que o
// Titan/candidatoTitan ja confirmou - o resto (renderUnilogOcorrenciaCard,
// unilogDescricaoInicial) ja sabe lidar com campos vazios (CNPJ/EAN ficam
// "—" em vez de travar a tela).
function unilogDadosEfetivos() {
  if (unilogState.dados) return unilogState.dados;
  if (!unilogState.candidatoTitan) return null;
  var c = unilogState.candidatoTitan;
  var marcaInfo = TORRE_MARCAS.filter(function(m) { return m.id === (c.marca || '').toLowerCase(); })[0];
  return {
    marca: { id: c.marca, nome: (marcaInfo && marcaInfo.nome) || c.nome_projeto || c.marca },
    pedido: { numero_nf: unilogState.termo, numero_pedido: c.numero_pedido || '', produtos: [] },
    remetente: {},
    destinatario: {},
  };
}

function unilogBuscarComMarca(termo, marcaForcada) {
  unilogState.carregando = true;
  renderUnilog();

  var u = '/api/logistica/buscar?termo=' + encodeURIComponent(termo) + '&marca=' + encodeURIComponent(marcaForcada || 'auto');
  fetch(u)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      unilogState.carregando = false;
      if (!res.ok || res.j.error) {
        unilogState.dados = null;
        if (unilogState.candidatoTitan) {
          // Ja temos os fatos do Titan (romaneio/situacao/eventos/itens via
          // unilogUsarCandidato) - a falha da Torre so custa CNPJ/EAN, nao
          // trava a tela inteira (ver comentario grande em unilogUsarCandidato).
          unilogState.avisoTorre = 'CNPJ e EAN indisponíveis - este pedido não foi encontrado na Intelipost/Shopify. Os dados do Titan BI abaixo continuam válidos.';
        } else {
          unilogState.erro = res.j.error || 'Não foi possível buscar o pedido.';
        }
      } else if (res.j.marca && res.j.marca.id === 'gocase') {
        // Unilog e um CD exclusivo das marcas Gobeaute - um pedido Gocase
        // encontrado (so possivel quando marca='auto') nao tem o que fazer
        // aqui (ver comentario grande no topo da secao).
        unilogState.erro = 'Este pedido é da Gocase - a Unilog CD atende apenas marcas Gobeaute.';
        unilogState.dados = null;
      } else {
        unilogState.dados = res.j;
        unilogState.avisoTorre = '';
      }
      renderUnilog();
      // Se ja veio de um candidato do Titan, unilogUsarCandidato ja disparou
      // a consulta - nao duplica.
      if (unilogState.dados && !unilogState.candidatoTitan) unilogSolicitarTitan();
    })
    .catch(function(e) {
      unilogState.carregando = false;
      if (unilogState.candidatoTitan) {
        unilogState.avisoTorre = 'CNPJ e EAN indisponíveis (erro de rede ao consultar a Intelipost/Shopify). Os dados do Titan BI abaixo continuam válidos.';
      } else {
        unilogState.erro = 'Erro de rede ao consultar: ' + (e && e.message ? e.message : e);
      }
      renderUnilog();
    });
}

var UNILOG_TITAN_INTERVALO_MS = 4000;
var UNILOG_TITAN_MAX_TENTATIVAS = 20; // ~80s de espera antes de desistir

// Reaproveita os MESMOS dois endpoints que a Torre usa pro romaneio (ver
// torreSolicitarTitan) - a diferenca e que aqui consumimos o documento
// inteiro que infos_titan ja guarda (situacao/eventos/itens - ver
// titan_watcher.py), nao so o campo romaneio.
function unilogSolicitarTitan() {
  var d = unilogState.dados;
  var numeroNf = d && d.pedido && d.pedido.numero_nf;
  var marca = d && d.marca && d.marca.id;
  if (!numeroNf || !marca) {
    unilogState.titanStatus = 'sem_nf';
    unilogRenderTitanPainelDom();
    return;
  }
  unilogState._titanInicioMs = Date.now();
  unilogState.titanStatus = 'pendente';
  unilogRenderTitanPainelDom();

  fetch('/api/logistica/titan-solicitar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ numero_nf: numeroNf, numero_pedido: d.pedido.numero_pedido || '', marca: marca }),
  })
    .then(function() { unilogPollTitanStatus(numeroNf, marca, 0); })
    .catch(function() { /* falha silenciosa - o painel so fica sem dados do Titan */ });
}

function unilogPollTitanStatus(numeroNf, marca, tentativa) {
  fetch('/api/logistica/titan-status?nf=' + encodeURIComponent(numeroNf) + '&marca=' + encodeURIComponent(marca))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      unilogState.titan = d;
      unilogState.titanStatus = d.status;
      var terminou = ['concluido', 'erro', 'inexistente'].indexOf(d.status) !== -1;
      unilogRenderTitanPainelDom();
      if (terminou) return;
      if (tentativa < UNILOG_TITAN_MAX_TENTATIVAS) {
        setTimeout(function() { unilogPollTitanStatus(numeroNf, marca, tentativa + 1); }, UNILOG_TITAN_INTERVALO_MS);
      } else {
        unilogState.titanStatus = 'timeout';
        unilogRenderTitanPainelDom();
      }
    })
    .catch(function() { /* falha silenciosa nesta rodada de polling */ });
}

// Atualiza SO o painel do Titan via DOM direto (nunca renderUnilog() inteiro)
// - o agente pode ja estar preenchendo o formulario de ocorrencia enquanto
// isso ainda esta em andamento (mesmo cuidado que torreAtualizarUiTitan tem
// com o formulario da Torre).
function unilogRenderTitanPainelDom() {
  var el = document.getElementById('unilog-titan-painel');
  if (!el) return;
  el.innerHTML = renderUnilogTitanPaineis();
  // O cartao "Dados para abrir a ocorrencia" ja foi desenhado antes do Titan
  // responder - atualiza so o valor do romaneio ali via DOM direto (nao
  // redesenha o cartao inteiro, que apagaria uma descricao ja editada).
  var elRomaneio = document.getElementById('unilog-romaneio-valor');
  if (elRomaneio) elRomaneio.textContent = tVal(unilogState.titan && unilogState.titan.romaneio);
}

function renderUnilogTitanPaineis() {
  var status = unilogState.titanStatus;
  var t = unilogState.titan || {};
  if (status === 'sem_nf') {
    return '<div class="torre-alert warn">Este pedido ainda não tem Nota Fiscal emitida - o Titan BI só é consultável por NF.</div>';
  }
  if (status === 'pendente' || status === '') {
    var elapsedS = unilogState._titanInicioMs ? Math.round((Date.now() - unilogState._titanInicioMs) / 1000) : 0;
    return '<div class="state-box"><p>Consultando o Titan BI... (' + elapsedS + 's)</p></div>';
  }
  if (status === 'timeout') {
    return '<div class="torre-alert warn">Titan BI não respondeu a tempo - confirme se o script (titan_watcher.py) está rodando.</div>';
  }
  if (status === 'erro') {
    return '<div class="torre-alert err">Titan BI: ' + tEsc(t.erro || 'erro desconhecido') + '</div>';
  }
  if (status === 'inexistente' || (status === 'concluido' && !t.situacao && !t.romaneio)) {
    return '<div class="torre-alert warn">NF não encontrada no Titan BI para esta marca.</div>';
  }

  var eventos = t.eventos || [];
  var itens = t.itens || [];

  var infoRows = [
    ['Situação', tVal(t.situacao)],
    ['Romaneio', tVal(t.romaneio)],
    ['Nome Projeto', tVal(t.nome_projeto)],
    ['Valor Pedido', t.valor_pedido != null ? tMoeda(t.valor_pedido) : '—'],
    ['Volume', tVal(t.volume)],
    ['Data Importado', tData(t.data_importado)],
    ['Data Expedido', tData(t.data_expedido)],
    ['Data Conferido', tData(t.data_conferido)],
    ['Observação', tVal(t.observacao)],
  ].map(function(r) {
    return '<div class="bloco-row"><div class="bloco-k">' + r[0] + '</div><div class="bloco-v">' + r[1] + '</div></div>';
  }).join('');

  var eventosHtml = !eventos.length
    ? '<div class="state-box" style="padding:1rem"><p>Sem eventos registrados no Titan.</p></div>'
    : '<table class="tl-table"><thead><tr><th>Horário da Situação</th><th>Situação</th></tr></thead><tbody>'
      + eventos.map(function(e) {
          return '<tr><td class="tl-when">' + tData(e['Horário da Situação'] || e.horario || '') + '</td><td class="tl-status">' + tEsc(e['Situação'] || e.situacao || '') + '</td></tr>';
        }).join('')
      + '</tbody></table>';

  var itensHtml = !itens.length
    ? '<div class="state-box" style="padding:1rem"><p>Sem itens registrados no Titan.</p></div>'
    : '<table class="tl-table"><thead><tr><th>Código/EAN</th><th>Descrição</th><th>Quantidade</th></tr></thead><tbody>'
      + itens.map(function(it) {
          var codigo = it['Ean'] || it['EAN'] || it['Código'] || it.ean || it.codigo || '';
          var desc = it['Descrição'] || it.descricao || '';
          var qtd = it['Quantidade'] || it.quantidade || '';
          return '<tr><td>' + tEsc(codigo) + '</td><td>' + tEsc(desc) + '</td><td>' + tEsc(qtd) + '</td></tr>';
        }).join('')
      + '</tbody></table>';

  return ''
    + '<div class="torre-blocos" style="grid-template-columns:1fr">'
    +   '<div class="bloco"><div class="bloco-head">Informação do Pedido (Titan BI)</div><div class="bloco-body">' + infoRows + '</div></div>'
    + '</div>'
    + '<div class="torre-timeline" style="margin-top:1rem"><div class="bloco-head">Eventos</div>' + eventosHtml + '</div>'
    + '<div class="torre-timeline" style="margin-top:1rem"><div class="bloco-head">Itens do Pedido</div>' + itensHtml + '</div>';
}

function renderUnilogResultado(d) {
  var p = d.pedido || {};
  var marcaNome = (d.marca && d.marca.nome) || '';
  var html = '<div style="margin-bottom:1rem;font-size:12px;color:var(--ink-3)">'
    + tEsc(marcaNome) + ' · Pedido ' + tEsc(p.numero_pedido || '—') + ' · NF ' + tEsc(p.numero_nf || '—')
    + '</div>';

  if (unilogState.avisoTorre) {
    html += '<div class="torre-alert warn">' + tEsc(unilogState.avisoTorre) + '</div>';
  }

  html += '<div id="unilog-titan-painel">' + renderUnilogTitanPaineis() + '</div>';
  html += renderUnilogOcorrenciaCard(d);
  return html;
}

// Cartao simples com SO os fatos que a Central ja sabe de fontes proprias
// (Intelipost/Titan/Metabase) - nada que dependa de julgamento da agente
// (tipo de ocorrencia, especificacao, nome/telefone/email dela) entra aqui,
// porque isso ela preenche direto no formulario real (25/08/2026, a pedido
// da Ivna: "gere o resuminho... apenas os que nao precisam ser passados
// pela propria agente" - CNPJ, NF, Nº do Pedido, EAN, Romaneio e a
// descricao, com botao de copiar). Substituiu o formulario completo
// (Preparar ocorrencia/Tipo/Especificacao) que existia antes.
function renderUnilogOcorrenciaCard(d) {
  var p = d.pedido || {};
  var cnpj = ((d.remetente && d.remetente.cnpj) || '').replace(/\D/g, '');
  var romaneio = (unilogState.titan && unilogState.titan.romaneio) || '';
  var produtos = p.produtos || [];
  var eans = produtos.length
    ? produtos.map(function(x) { return tEsc(x.ean || x.sku || '—') + (x.descricao ? ' - ' + tEsc(x.descricao) : ''); }).join('<br>')
    : '—';

  var linhas = [
    ['CNPJ', tVal(cnpj), null],
    ['Nota Fiscal', tVal(p.numero_nf), null],
    ['Nº do Pedido', tVal(p.numero_pedido), null],
    ['EAN', eans, null],
    // id proprio (25/08/2026): o romaneio do Titan chega assincrono, DEPOIS
    // deste cartao ja ter sido desenhado - unilogRenderTitanPainelDom
    // atualiza este valor via DOM direto quando a consulta terminar, sem
    // precisar redesenhar o cartao inteiro (que apagaria uma descricao que
    // a agente ja tivesse editado).
    ['Romaneio', tVal(romaneio), 'unilog-romaneio-valor'],
  ].map(function(l) {
    return '<div class="bloco-row"><div class="bloco-k">' + l[0] + '</div><div class="bloco-v"' + (l[2] ? ' id="' + l[2] + '"' : '') + '>' + l[1] + '</div></div>';
  }).join('');

  return '<div class="bloco" style="margin-bottom:1.25rem">'
    + '<div class="bloco-head">Dados para abrir a ocorrência na Unilog</div>'
    + '<div class="bloco-body">' + linhas + '</div>'
    + '<div class="bloco-body" style="padding-top:0">'
    +   '<label class="tf-label" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
    +     '<span>Descrição da ocorrência</span>'
    +     '<button class="torre-btn-ghost" style="padding:4px 10px;font-size:11px" onclick="unilogCopiarDescricao()">Copiar</button>'
    +   '</label>'
    +   '<textarea class="tf-textarea" id="uf-descricao" style="min-height:120px;width:100%">' + tEsc(unilogDescricaoInicial(d)) + '</textarea>'
    + '</div>'
    + '<div class="bloco-body" style="padding-top:0">'
    +   '<a class="torre-btn" style="display:inline-block;text-decoration:none;text-align:center" href="https://unilog-formularios.bitrix24.site/alo_uni_ocorrencias/" target="_blank" rel="noopener">Abrir formulário da Unilog ↗</a>'
    + '</div>'
    + '</div>';
}

function unilogCopiarDescricao() {
  var campo = document.getElementById('uf-descricao');
  if (!campo) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(campo.value);
  }
}

function unilogDescricaoInicial(d) {
  var p = (d && d.pedido) || {};
  var linhas = ['NF: ' + (p.numero_nf || '—') + ' | Pedido: ' + (p.numero_pedido || '—')];
  // Preferencia pelos itens da Intelipost (25/08/2026): ja vem no mesmo
  // resultado da busca, sem depender do Titan estar consultado - e ja traz o
  // EAN de verdade (cruzado por SKU no Metabase Gobeaute, ver
  // buscarEanPorSku em server.ts). So cai pro "Itens do pedido" do Titan
  // (unilogState.titan.itens) se a Intelipost nao tiver produtos.
  var produtos = (p.produtos || []);
  if (produtos.length) {
    linhas.push('Itens:');
    produtos.forEach(function(x) {
      var codigo = x.ean || x.sku || '';
      linhas.push('- ' + [codigo, x.descricao].filter(Boolean).join(' - ') + (x.quantidade ? ' (qtd ' + x.quantidade + ')' : ''));
    });
  } else {
    var itens = (unilogState.titan && unilogState.titan.itens) || [];
    if (itens.length) {
      linhas.push('Itens:');
      itens.forEach(function(it) {
        var ean = it['Ean'] || it['EAN'] || it['Código'] || it.ean || it.codigo || '';
        var desc = it['Descrição'] || it.descricao || '';
        linhas.push('- ' + [ean, desc].filter(Boolean).join(' - '));
      });
    }
  }
  linhas.push('', 'Descreva aqui o que aconteceu:');
  return linhas.join('\n');
}

// qualquer aba (Dashboard, Regras, Configuracoes), nao so de dentro de
// tickets. setTab() nao dispara fetch sozinho (ver correcao acima), entao
// e seguro chamar antes de setStatusFilter() sem risco de duas cargas em
// paralelo - quem decide se busca ou so filtra e sempre o setStatusFilter.
function irParaStatus(status) {
  if (currentTab !== 'tickets') setTab('tickets');
  setStatusFilter(status);
}

function setStatusFilter(status) {
  currentStatusFilter = status;
  currentPage = 1;
  if (status !== 'extravio') selectedExtravioIds.clear();
  // TELA DE BUSCA PURA (10/08/2026, a pedido da Maria): "Todos" NUNCA
  // dispara a carga completa da tabela - existe so pra pesquisar um ticket
  // especifico (via busca direcionada, ver onHeaderSearch/buscarTermoDireto).
  // Se os dados ja estiverem em memoria (porque o agente entrou por outra
  // aba de status antes), a busca aqui so filtra o que ja tem, sem custo
  // extra - mas clicar em "Todos" por si so nunca busca nada sozinho.
  if (status === 'todos') { renderTab(currentTab); return; }
  // SEM FILTRO DE DATA (10/08/2026, a pedido da Maria): "Extravio aberto" e
  // "Abrir Extravio" existem justamente pra achar casos antigos (a
  // heuristica de "Abrir Extravio" so ativa depois de 10+ dias uteis sem
  // resposta) - um filtro de periodo, mesmo o padrao de 30 dias, esconderia
  // exatamente os casos que essas abas servem pra mostrar. Por isso elas
  // SEMPRE buscam de novo sem limite de data, mesmo que outra aba (bounded
  // por periodo) ja tenha carregado dados nesta sessao - nao reaproveita
  // esse cache.
  if (status === 'extravio' || status === 'abrir_extravio') {
    loadAndRender(currentTab, true);
    return;
  }
  // REDUCAO DE EGRESS (10/08/2026): primeira aba clicada na sessao/marca
  // dispara a carga completa (unica vez) - antes disso, nada tinha sido
  // buscado do Supabase. loadAndRender ja redesenha tudo (barra de status,
  // filtros, lista), entao retorna aqui sem duplicar o redesenho manual
  // abaixo, que so faz sentido quando os dados ja estao em allTickets.
  //
  // FIX (11/08/2026, bug reportado pela Maria: trocar de "Abrir Extravio"
  // pra "Aguardando transportadora" nao atualizava a lista corretamente):
  // esta checagem original so considerava "dadosCarregados", nao QUAL
  // RECORTE allTickets contem. Desde que "Extravio aberto"/"Abrir Extravio"
  // passaram a buscar um subconjunto restrito (ver loadAndRender), allTickets
  // pode conter so esse recorte estreito (ou nada, ex.: os 0 candidatos de
  // "Abrir Extravio" de hoje) - reaproveitar isso pra qualquer aba de status
  // normal mostra a lista errada (vazia ou incompleta). Agora exige carga
  // nova sempre que o ultimo modo carregado nao for 'periodo'.
  if (!dadosCarregados || allTicketsModo !== 'periodo') { loadAndRender(currentTab, true); return; }
  // So redesenha a barra de status (pra marcar o botao ativo e atualizar os
  // contadores). Antes isso chamava renderTickets() inteiro, que reconstruia
  // tambem os dropdowns de Marca e Status Intelipost do zero - cada um deles
  // varre os 10446 tickets pra montar a lista de opcoes unicas - e ainda
  // apagava qualquer filtro de data que o agente ja tivesse preenchido.
  const counts = getStatusCounts(allTickets);
  const bar = document.querySelector('.status-filter-bar');
  if (bar) bar.outerHTML = renderStatusFilterBar(counts);
  atualizarBulkActionBar();
  renderListAndPagination();
}

// FILTERS BAR
// CARGA POR PERIODO (10/08/2026, a pedido da Maria): o filtro De/Ate agora e
// o que de fato delimita a consulta ao Supabase (nao so a exibicao) - ver
// periodoDataIni/periodoDataFim e fetchTickets. "Aplicar filtro" busca de
// novo, bounded pelo periodo escolhido; trocar de aba de status depois disso
// so filtra local, sem nova consulta, ate o periodo mudar de novo.
function dataISO(d) { return d.toISOString().slice(0, 10); }
function sugestaoDataIni() { return dataISO(new Date(Date.now() - 30 * 24 * 60 * 60 * 1000)); }
function sugestaoDataFim() { return dataISO(new Date()); }

  // SEM FILTRO DE DATA (10/08/2026): "Extravio aberto" e "Abrir Extravio"
  // carregam sem limite de data por padrao (ver setStatusFilter/

  // isso com precisao, em vez de mostrar a sugestao de 30 dias que nao esta
  // de fato sendo aplicada nessas duas abas.
  var semFiltroDeData = (currentStatusFilter === 'extravio' || currentStatusFilter === 'abrir_extravio');
  var valorDataIni = semFiltroDeData ? '' : periodoDataIni;

    '<select class="filter-select" id="f-motivo" onchange="applyFilters()"><option value="">Todos os motivos de contato</option>' + motivoOptions() + '</select>' +
    '<select class="filter-select" id="f-classificacao" onchange="applyFilters()"><option value="">Todas as classificações</option>' + classificacaoOptions() + '</select>' +
    '<select class="filter-select" id="f-tratativa" onchange="onTratativaFilterChange()"><option value="">Todas as tratativas</option><option value="reenvio">Reenvio</option><option value="reembolso">Reembolso</option><option value="vazio">Vazio</option></select>' +
    '<div class="filter-divider"></div>' +
    '<label style="font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px">De<input class="filter-input" type="date" id="f-data-ini" value="' + valorDataIni + '" style="width:130px;padding:6px 10px"></label>' +
    '<label style="font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px">Ate<input class="filter-input" type="date" id="f-data-fim" value="' + valorDataFim + '" style="width:130px;padding:6px 10px"></label>' +
    '<button type="button" class="filter-select" id="btn-aplicar-filtro-data" onclick="aplicarFiltroPeriodo()" title="Busca de novo no Supabase, dentro do periodo escolhido (vazio = sem limite de data)" style="cursor:pointer;font-weight:600;color:var(--blue,#2659a5)">Aplicar filtro</button>' +
    '<div class="filter-divider"></div>' +
    '<span id="last-update" style="font-size:11px;color:var(--ink-3)"></span>' +

    '<button class="btn-refresh" id="btn-export-csv" onclick="exportTicketsCSV()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Exportar CSV</button>' +
