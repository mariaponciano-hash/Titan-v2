// --- Acompanhamento da tratativa ----------------------------------------
// O agente precisa decidir se abre um ticket novo ou espera o que ja existe.
// Pra isso ele precisa ver a MESMA coisa que veria na tela inicial: ha quantos
// dias o ticket esta aberto, se a transportadora ja respondeu e o historico de
// e-mails. Em vez de reimplementar, reusamos calcStatus/statusBadge/
// loadHistorico da Central - assim as duas telas nunca divergem no status.

// Dias corridos desde a abertura do ticket.
function torreDiasEmAberto(dataEmail) {
  if (!dataEmail) return null;
  var ini = Date.parse(String(dataEmail).slice(0, 10) + 'T00:00:00Z');
  if (isNaN(ini)) return null;
  var hoje = Date.parse(new Date().toISOString().slice(0, 10) + 'T00:00:00Z');
  return Math.max(0, Math.round((hoje - ini) / 86400000));
}

// Os botoes Responder / Contatar Cliente / Encerrar reusam as funcoes reais da
// Central (openResponder, contatarCliente, updateTicketStatus) - inclusive as
// confirmacoes de acao com efeito no cliente. So que todas elas localizam o
// ticket em `allTickets`, que na Torre esta vazio (a Torre nao carrega a lista).
// Entao, ao exibir um resultado, injetamos as linhas cruas dos tickets achados
// nesse mesmo registro. Marcamos com _tabelaTorre pra que a gravacao de status
// va pra tabela do ticket, e nao pra do seletor da lateral.
function torreRegistrarTickets(d) {
  var lista = (d && d.tickets_existentes) || [];
  lista.forEach(function(t) {
    if (!t.raw || !t.thread_id) return;
    var ja = allTickets.some(function(x) { return x.thread_id === t.thread_id; });
    if (ja) return;
    var linha = t.raw;
    linha._tabelaTorre = t.tabela;
    allTickets.push(linha);
  });
}

// Id do container de historico no MESMO padrao que a Central usa
// ('hist-tr-<threadId>'). Nao e detalhe cosmetico: enviarResposta() recarrega o
// historico procurando exatamente por esse id depois do envio, entao seguir a
// convencao faz a atualizacao pos-envio funcionar tambem na Torre, de graca.
function torreHistId(threadId) {
  return 'hist-tr-' + String(threadId || '').replace(/[^a-z0-9]/gi, '');
}

function torreStatusTicket(t) {
  // calcStatus espera a linha com os nomes de coluna originais (vem em .raw).
  var linha = t.raw || {};
  try {
    return statusBadge(calcStatus(linha));
  } catch (e) {
    // Se algo mudar em calcStatus, a Torre nao pode quebrar junto - cai num
    // rotulo simples derivado do que o proprio backend ja mandou.
    var txt = t.tem_resposta ? 'Com resposta' : 'Aguardando retorno';
    return '<span class="status-count" style="background:var(--blue-bg);color:var(--blue)">' + tEsc(txt) + '</span>';
  }
}

function renderTorreTicketItem(t, i) {
  var dias = torreDiasEmAberto(t.data_email);
  var diasTxt = dias === null ? '—' : dias + (dias === 1 ? ' dia' : ' dias');
  // Sem resposta ha mais de 5 dias e o sinal de que a tratativa travou.
  var diasClasse = (dias !== null && dias > 5 && !t.tem_resposta) ? ' destaque-alerta' : '';
  var respostaTxt = t.tem_resposta ? 'Sim' : 'Não';
  var respostaClasse = t.tem_resposta ? ' destaque-ok' : ' destaque-alerta';
  var cid = 'torre-tk-' + i;

  return '<div class="ttb-item">'
    + '<div class="ttb-item-row">'
    +   '<div class="ttb-item-main">'
    +     '<div class="ttb-item-title">' + tVal(t.assunto || ('Ticket ' + t.thread_id)) + '</div>'
    +     '<div class="ttb-item-meta">'
    +       'Aberto há ' + tEsc(diasTxt) + ' (' + tDataCurta(t.data_email) + ')'
    +       ' · Transportadora: ' + tVal(t.transportadora)
    +       ' · <span style="color:var(--ink-4)">' + tVal(t.tabela) + '</span>'
    +     '</div>'
    +   '</div>'
    +   torreStatusTicket(t)
    +   '<button class="ttb-toggle" id="btn-' + cid + '" onclick="torreToggleTicket(' + i + ')">'
    +     '<span id="lbl-' + cid + '">Ver tratativa</span>'
    +     '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
    +   '</button>'
    + '</div>'
    + '<div class="ttb-detalhe" id="det-' + cid + '">'
    +   '<div class="ttb-meta">'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Dias em aberto</div><div class="ttb-meta-v' + diasClasse + '">' + tEsc(diasTxt) + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Transportadora respondeu</div><div class="ttb-meta-v' + respostaClasse + '">' + respostaTxt + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Mensagens na thread</div><div class="ttb-meta-v">' + tVal(t.total_mensagens) + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Último status Intelipost</div><div class="ttb-meta-v">' + tVal(t.ultimo_status) + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Tipo de ocorrência</div><div class="ttb-meta-v">' + tVal(t.tipo_ocorrencia) + '</div></div>'
    +     '<div class="ttb-meta-item"><div class="ttb-meta-k">Última atualização</div><div class="ttb-meta-v">' + tDataCurta(t.updated_at) + '</div></div>'
    +   '</div>'
    +   (t.motivo
        ? '<div class="ttb-contato"><div class="ttb-contato-k">Contato da transportadora (classificado pela IA)</div>'
          + '<div class="ttb-contato-v">' + tVal(t.motivo) + '</div></div>'
        : '')
    +   '<div class="ttb-hist-label">Histórico de e-mails'
    +     '<span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-4)">— clique numa mensagem para ler o conteúdo</span>'
    +   '</div>'
    +   '<div class="ttb-hist" id="' + torreHistId(t.thread_id) + '"></div>'
    +   renderTorreAcoes(t, i)
    + '</div>'
    + '</div>';
}

// Acoes da tratativa, na mesma ordem da tela inicial. Sao acoes REAIS (envio de
// e-mail pra transportadora, WhatsApp pro cliente, encerramento do ticket) -
// cada uma ja pede confirmacao dentro da propria funcao da Central, que e a
// mesma usada aqui. Ticket concluido nao mostra acao nenhuma, igual a Central.
function renderTorreAcoes(t, i) {
  var concluido = t.status === 'concluido';
  if (concluido) {
    return '<div class="ttb-acoes"><div class="ttb-acoes-aviso">Ticket encerrado — nenhuma ação disponível.</div></div>';
  }
  var tid = tEsc(t.thread_id);
  return '<div class="ttb-acoes">'
    + '<div class="ttb-acoes-label">Ações da tratativa</div>'
    + '<div class="field" style="margin-bottom:10px">'
    +   '<label class="field-label">Status do ticket</label>'
    +   '<select class="filter-select" style="width:100%;border-radius:6px" onclick="event.stopPropagation()" onchange="event.stopPropagation();torreAtualizarStatus(' + i + ', this.value, this)">'
    +     statusSelectOptions(t.status)
    +   '</select>'
    + '</div>'
    + '<div class="ttb-acoes-linha">'
    +   '<button class="ttb-acao ttb-acao-primaria" onclick="torreResponder(\'' + tid + '\')">'
    +     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +     'Responder</button>'
    +   '<button class="ttb-acao ttb-acao-cliente" onclick="torreContatarCliente(\'' + tid + '\', this)">'
    +     '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    +     'Contatar Cliente</button>'
    +   '<button class="ttb-acao ttb-acao-encerrar" onclick="torreEncerrarTicket(' + i + ')">'
    +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    +     'Encerrar Ticket</button>'
    + '</div></div>';
}

function torreResponder(threadId) {
  torreRegistrarTickets(torreState.dados);
  openResponder(threadId);
}

function torreContatarCliente(threadId, btnEl) {
  torreRegistrarTickets(torreState.dados);
  contatarCliente(threadId, btnEl);
}

// Encerramento proprio da Torre (nao reusa changeTicketStatus da Central porque
// aquela funcao redesenha a lista/contadores da tela inicial, que aqui nem
// existem - e recalcularia os contadores a partir de um allTickets que na Torre
// so tem os poucos tickets deste pedido, zerando a barra lateral).
function torreEncerrarTicket(i) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  if (!confirm('Encerrar este ticket?\n\n' + (t.assunto || t.thread_id) + '\n\nDepois de encerrado, nenhuma ação poderá ser feita nele.')) return;
  torreAtualizarStatus(i, 'concluido', null);
}

// Dropdown "Status do ticket" na Torre (24/08/2026, a pedido da Ivna) - mesma
// troca manual de status que ja existia na Central (ver changeTicketStatus),
// so que reescrita sobre torreState.dados/tickets_existentes em vez de
// allTickets/cid, porque a Torre nao usa a mesma tabela/linha expansivel.
// torreEncerrarTicket agora reusa esta funcao (era duplicado antes).
function torreAtualizarStatus(i, novoStatus, selectEl) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  if (selectEl) selectEl.disabled = true;
  updateTicketStatus(t.id, novoStatus, t.tabela).then(function(ok) {
    if (selectEl) selectEl.disabled = false;
    if (!ok) { alert('Erro ao atualizar status. Tente novamente.'); return; }
    t.status = novoStatus;
    if (t.raw) t.raw.Status_resposta_tickets = novoStatus;
    var emMemoria = allTickets.find(function(x) { return x.thread_id === t.thread_id; });
    if (emMemoria) emMemoria.Status_resposta_tickets = novoStatus;
    renderTorre();
  });
}

// Abre/fecha o painel. O historico so e buscado no primeiro clique (o webhook
// do n8n custa uma chamada por thread) - depois disso o threadCache global,
// compartilhado com a Central, ja responde na hora.
function torreToggleTicket(i) {
  var t = (torreState.dados && torreState.dados.tickets_existentes) ? torreState.dados.tickets_existentes[i] : null;
  if (!t) return;
  var cid = 'torre-tk-' + i;
  var det = document.getElementById('det-' + cid);
  var btn = document.getElementById('btn-' + cid);
  var lbl = document.getElementById('lbl-' + cid);
  if (!det) return;
  var abrindo = !det.classList.contains('open');
  det.classList.toggle('open', abrindo);
  if (btn) btn.classList.toggle('open', abrindo);
  if (lbl) lbl.textContent = abrindo ? 'Ocultar tratativa' : 'Ver tratativa';
  if (abrindo && det.dataset.carregado !== '1') {
    det.dataset.carregado = '1';
    // Registra o ticket em allTickets ANTES de carregar o historico: e o que
    // permite os botoes de acao (e o proprio loadHistorico) enxergarem o ticket.
    torreRegistrarTickets(torreState.dados);
    loadHistorico(torreHistId(t.thread_id), t.thread_id, t.remetente);
  }
}

// --- Formulario 100% pre-preenchido -------------------------------------
// AUTO-PREENCHIMENTO: todo campo que ja veio no JSON do pedido entra travado
// (readonly) e marcado como "preenchido automaticamente". O agente so decide o
// que a maquina nao sabe: qual e o problema e o que observar. Era exatamente
// a digitacao que o CX Hub exigia de novo, com o pedido ja aberto na tela ao
// lado - fonte classica de erro de digitacao em nº de pedido/NF.
function torrePreencherForm(d) {
  var p = d.pedido || {}, t = d.transportadora || {}, c = d.destinatario || {}, k = d.kpi || {};
  // Endereco completo numa linha so - e o que a transportadora cola no sistema
  // dela pra localizar a entrega.
  var endereco = [c.endereco, c.numero].filter(Boolean).join(', ');
  if (c.complemento) endereco += ' - ' + c.complemento;
  var enderecoCompleto = [endereco, c.bairro, [c.cidade, c.uf].filter(Boolean).join('/'), c.cep]
    .filter(Boolean).join(' · ');
  return {
    marca: (d.marca && d.marca.nome) || '',
    // Codigo da marca como aparece no Supabase (ex: "RITUARIA") - e o formato
    // usado no assunto dos tickets reais (ver torreGerarAssunto), diferente do
    // nome de exibicao ("Rituária") que so aparece na tela.
    marcaCodigo: (d.marca && d.marca.supabase) || '',
    // Id interno (ex: "gocase", "lescent") - usado so pra escolher a variante
    // certa de contato da transportadora (ver resolverContatoTransportadora),
    // que difere entre Gocase e as marcas Gobeaute pra varias transportadoras.
    marcaId: (d.marca && d.marca.id) || '',
    numero_pedido: p.numero_pedido || '',
    numero_nf: p.numero_nf || '',
    // Romaneio de verdade, ja confirmado pelo Titan BI (ver torreAtualizarUiTitan)
    // - diferente de romaneio_transportadora (Intelipost, sabidamente errado,
    // nunca sugerido). So existe se a consulta ja tiver terminado antes do
    // formulario ser (re)desenhado.
    romaneio_titan: p.romaneio_titan || '',
    // Dados que a transportadora exige pra localizar o volume (ver comentario
    // em initTicketsLogisticaTable no server.ts).
    cpf_destinatario: c.cpf || '',
    chave_danfe: p.chave_nf || '',
    plp_intelipost: p.plp_intelipost || '',
    romaneio_transportadora: p.romaneio_transportadora || '',
    endereco_entrega: enderecoCompleto,
    // Endereco ATUAL em partes separadas - usado so pra pre-preencher o
    // formulario de "Alterar Endereço" (ver renderTorreForm), pra o agente
    // editar so o que mudou em vez de redigitar tudo do zero.
    endereco_atual: {
      rua: c.endereco || '', numero: c.numero || '', complemento: c.complemento || '',
      bairro: c.bairro || '', cidade: c.cidade || '', uf: c.uf || '', cep: c.cep || '',
    },
    transportadora: t.nome || '',
    codigo_rastreio: t.codigo_rastreio || '',
    previsao_entrega: p.previsao_entrega ? String(p.previsao_entrega).slice(0, 10) : '',
    dias_atraso: (k.dias_atraso === null || k.dias_atraso === undefined) ? '' : k.dias_atraso,
    destinatario: c.nome || '',
    responsavel: AGENT || '',
    // Sugestao de problema: se esta atrasado, a categoria mais provavel ja vem
    // escolhida. E so uma sugestao - o agente troca no dropdown.
    problema: (k.dias_atraso !== null && k.dias_atraso !== undefined && k.dias_atraso > 0 && !k.entregue) ? 'Pedido Atrasado' : '',
  };
}

// --- Previa do e-mail (17/08/2026, a pedido da Ivna) --------------------
// Nao envia nada - so mostra como o e-mail FICARIA se fosse sair, seguindo o
// mesmo padrao dos tickets reais: assunto "NF <nf> - <problema> [<MARCA>]"
// (visto nos tickets carregados do Gmail, ex: "NF 940380 - Acareação
// [RITUARIA]") e corpo com os dados que a transportadora pede pra localizar
// o volume (ver bloco "Dados para a transportadora" no formulario acima).
// O campo "Para" fica vazio de proposito: o sistema nao tem, em lugar nenhum,
// o e-mail de contato de cada transportadora - so os enderecos das NOSSAS
// caixas Gmail (ver CONTAS em server.ts). Precisa ser preenchido a mao.
function torreIntroProblema(problema, f) {
  switch (problema) {
    case 'Pedido Atrasado':
      return 'Solicitamos posicionamento sobre o atraso na entrega do pedido abaixo'
        + (f.dias_atraso !== '' && f.dias_atraso > 0 ? ', que já está há ' + f.dias_atraso + (f.dias_atraso === 1 ? ' dia' : ' dias') + ' fora do prazo previsto' : '')
        + '.';
    case 'Acareação':
      return 'Solicitamos acareação (confronto de informações) sobre a situação atual do pedido abaixo.';
    case 'Alterar Endereço':
      return 'Solicitamos a atualização do endereço de entrega do pedido abaixo. O endereço correto, com localização no Google Maps, está detalhado a seguir.';
    case 'Barra Entrega':
      return 'Solicitamos que a entrega do pedido abaixo NÃO seja realizada até nova orientação nossa.';
    case 'Extravio':
      return 'O pedido ultrapassou o limite máximo tolerado para atraso na entrega.';
    case 'Avaria':
      return 'Notifico que nosso cliente identificou uma avaria no produto referente à entrega efetuada.';
    default:
      return 'Solicitamos posicionamento sobre o pedido abaixo.';
  }
}

function torreGerarAssunto(f) {
  var chaveNota = f.numero_nf || f.numero_pedido;
  return 'NF ' + chaveNota + ' - ' + (f.problema || 'Ocorrência') + ' [' + (f.marcaCodigo || f.marca || '').toUpperCase() + ']';
}

// Link de busca do Google Maps - NAO precisa de chave de API (e so um deep
// link com o texto do endereco, o proprio Maps geocodifica ao abrir). Usado
// no e-mail de "Alterar Endereço" pra transportadora nao ter duvida de qual e
// a localizacao correta.
function gerarUrlGoogleMaps(endereco) {
  if (!endereco || !endereco.trim()) return '';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(endereco.trim());
}

function torreGerarCorpoEmail(f, observacao) {
  var ehAlteracaoEndereco = f.problema === 'Alterar Endereço' && f.endereco_novo && f.endereco_novo.trim();
  var linhas = [
    'Prezados,',
    '',
    torreIntroProblema(f.problema, f),
    '',
    'Pedido: ' + (f.numero_pedido || '—'),
    'Nota fiscal: ' + (f.numero_nf || '—'),
    'Chave de acesso da NF-e: ' + (f.chave_danfe || '—'),
    'Romaneio: ' + (f.romaneio_transportadora || '—') + (f.plp_intelipost ? ' (PLP Intelipost: ' + f.plp_intelipost + ')' : ''),
    'Transportadora: ' + (f.transportadora || '—'),
    'Código de rastreio: ' + (f.codigo_rastreio || '—'),
    'Previsão de entrega: ' + (f.previsao_entrega ? tDataCurta(f.previsao_entrega) : '—'),
    '',
    'Destinatário: ' + (f.destinatario || '—'),
    'CPF: ' + (f.cpf_destinatario || '—'),
  ];
  if (ehAlteracaoEndereco) {
    linhas.push(
      'Endereço cadastrado (desatualizado): ' + (f.endereco_entrega || '—'),
      'Endereço correto para entrega: ' + f.endereco_novo.trim(),
      'Localização no Google Maps: ' + gerarUrlGoogleMaps(f.endereco_novo)
    );
  } else {
    linhas.push('Endereço de entrega: ' + (f.endereco_entrega || '—'));
  }
  if (observacao && observacao.trim()) {
    linhas.push('', 'Observação adicional: ' + observacao.trim());
  }
  linhas.push('', 'Aguardamos retorno o quanto antes.', '', 'Atenciosamente,', (f.responsavel || 'Equipe CX') + ' — CX Gogroup');
  return linhas.join('\n');
}

// Busca o e-mail cadastrado em Regras de Negocio > "E-mails de Contato das
// Transportadoras" (ver transportadorasEmailMap). Se o agente ainda nao
// visitou a aba Regras nesta sessao, window._regrasSalvo nao existe ainda -
// busca direto da API antes de montar a previa, em vez de depender de uma
// visita anterior a outra aba.
// Garante que window._regrasSalvo esteja carregado antes de resolver contato
// (o agente pode chegar na Torre sem nunca ter visitado a aba Regras nesta
// sessao).
async function garantirRegrasCarregadas() {
  if (window._regrasSalvo) return;
  try {
    const r = await fetchComTimeout('/api/regras-negocio', {}, 10000);
    if (r.ok) window._regrasSalvo = await r.json();
  } catch (e) {
    console.error('[garantirRegrasCarregadas] falha ao buscar regras:', e);
  }
}

// Abre o ticket direto - sem previa nem envio manual de e-mail (removido
// 31/08/2026, a pedido da Ivna: substituiu torrePreviarEmail/
// torreEnviarEmailReal/torreEnviarTicket). Motivo: quem contata a
// transportadora de verdade agora e o TicketsCreator, chamado pelo proprio
// server.ts dentro de /api/logistica/abrir-ticket (ver chamarTicketsCreator).
// Mandar um e-mail manual aqui tambem contataria a transportadora de novo,
// duplicando o contato - por isso a etapa de "revisar e enviar e-mail" saiu
// do fluxo inteiramente (torreGerarAssunto/torreGerarCorpoEmail/
// garantirRegrasCarregadas/resolverContatoTransportadora ficaram sem uso
// nesta tela, mas nao foram apagadas - resolverContatoTransportadora ainda
// pode servir a tela de Regras de Negocio).
function torreAbrirTicket() {
  var d = torreState.dados;
  if (!d) return;
  var f = torrePreencherForm(d);
  var problema = (document.getElementById('tf-problema') || {}).value || '';
  var responsavel = (document.getElementById('tf-responsavel') || {}).value || '';
  var romaneioCorrigido = (document.getElementById('tf-romaneio') || {}).value || '';
  var enderecoNovo = torreLerEnderecoNovo();
  if (!problema) { alert('Selecione o problema.'); return; }
  if (!responsavel.trim()) { alert('Informe o responsável.'); return; }
  // Minimo pratico confirmado com quem mantem o TicketsCreator (01/09/2026):
  // nao existe lista fixa de obrigatorios (nada da 400) - o que existe e um
  // minimo funcional pra Regra 1 conseguir decidir: city+state, mais
  // address1 OU zipcode. Sem isso, o ticket morre como
  // ADDRESS_UNVERIFIABLE em vez de abrir de verdade.
  var p = enderecoNovo.partes;
  if (problema === 'Alterar Endereço' && (!p.city || !p.state || !(p.address1 || p.zipcode))) {
    alert('Preencha ao menos Cidade, UF e (Rua ou CEP) do endereço novo antes de abrir o ticket.');
    return;
  }
  if (!confirm('Confirma a abertura deste ticket? A transportadora (' + (f.transportadora || 'não identificada') + ') será contatada automaticamente pelo TicketsCreator.\n\nEssa ação é real e não pode ser desfeita.')) {
    return;
  }

  f.romaneio_transportadora = romaneioCorrigido;
  f.endereco_novo = enderecoNovo.fullAddress;
  torreState.enviando = true;
  renderTorre();

  var payloadTicket = {
    marca: f.marca, problema: problema, numero_pedido: f.numero_pedido, numero_nf: f.numero_nf,
    transportadora: f.transportadora, codigo_rastreio: f.codigo_rastreio, previsao_entrega: f.previsao_entrega,
    dias_atraso: f.dias_atraso === '' ? null : Number(f.dias_atraso), destinatario: f.destinatario,
    cpf_destinatario: f.cpf_destinatario, chave_danfe: f.chave_danfe, plp_intelipost: f.plp_intelipost,
    romaneio_transportadora: f.romaneio_transportadora, endereco_entrega: f.endereco_entrega,
    endereco_novo: f.endereco_novo || '', endereco_novo_partes: problema === 'Alterar Endereço' ? enderecoNovo.partes : undefined,
    maps_url: gerarUrlGoogleMaps(f.endereco_novo),
    responsavel: responsavel,
    // BUG REAL no gate do proprio TicketsCreator (02/09/2026, achado pelo
    // Diego): pedido que a Intelipost nunca viu (sem microstatus) devolve
    // sentState "unknown" - e o handler dele so barra em "not_sent",
    // deixando "unknown" passar. Ou seja, a evidencia MAIS forte de que o
    // pedido nao saiu (Intelipost nunca rastreou) e justamente o caso que o
    // gate do creator libera por engano. A Torre ja sabe se a Intelipost
    // conhece este pedido (ver fontes.intelipost, mostrado na tela como
    // "Intelipost —"), entao manda esse sinal pro backend usar em vez de
    // confiar cegamente no gate dele - ver /api/logistica/abrir-ticket.
    intelipost_conhece_pedido: !!(d.fontes && d.fontes.intelipost),
  };

  fetch('/api/logistica/abrir-ticket', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadTicket),
  })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      torreState.enviando = false;
      torreState.formAberto = false;
      var ticketOk = !!(res.ok && res.j.ok);
      var protocolo = ticketOk ? res.j.protocolo : '';
      var erroTicket = ticketOk ? '' : (res.j && res.j.error ? res.j.error : 'erro desconhecido');
      var tc = ticketOk ? (res.j.ticket_creator || {}) : {};

      // O TicketsCreator pode responder de varias formas alem de "criei o
      // ticket" (pedido no prazo, ticket duplicado, precisa de escalonamento
      // humano...) - mostramos a mensagem real dele em vez de fingir um
      // resultado generico de sucesso/falha.
      var fila = ticketOk ? res.j.fila : null;
      if (!ticketOk) {
        torreState.resultadoEnvio = { classe: 'err', titulo: 'Falha ao registrar o ticket.', mensagem: erroTicket };
      } else if (tc.encaminhado) {
        torreState.resultadoEnvio = { classe: 'ok', titulo: 'Ticket criado — protocolo ' + protocolo + '.', mensagem: 'Transportadora contatada automaticamente pelo TicketsCreator.' };
      } else if (fila && fila.ok) {
        // Pedido ainda nao saiu do CD (TicketsCreator devolveu "ORDER NO
        // SENT") - a Torre ja registrou na fila do Diego, que dispara
        // sozinho quando o pedido despachar. O agente nao precisa lembrar
        // de voltar aqui depois.
        torreState.resultadoEnvio = { classe: 'ok', titulo: 'Endereço na fila — protocolo ' + protocolo + '.', mensagem: (fila.jaExistia ? 'Endereço atualizado na fila' : 'Pedido ainda não saiu do CD') + ' - o ticket será aberto automaticamente com a transportadora assim que o pedido for despachado.' };
      } else if (tc.chamado) {
        var msgTc = (tc.resposta && (tc.resposta.message || tc.resposta.status)) || tc.motivo || 'sem detalhes';
        torreState.resultadoEnvio = { classe: 'warn', titulo: 'Ticket registrado — protocolo ' + protocolo + '.', mensagem: 'TicketsCreator: ' + msgTc };
      } else {
        torreState.resultadoEnvio = { classe: 'warn', titulo: 'Ticket registrado — protocolo ' + protocolo + '.', mensagem: 'TicketsCreator não foi chamado (' + (tc.motivo || 'não configurado') + ') - contate a transportadora manualmente.' };
      }
      renderTorre();
      torreMostrarModalResultado(torreState.resultadoEnvio);
    })
    .catch(function(e) {
      torreState.enviando = false;
      torreState.resultadoEnvio = { classe: 'err', titulo: 'Falha ao registrar o ticket.', mensagem: String((e && e.message) || e) };
      renderTorre();
      torreMostrarModalResultado(torreState.resultadoEnvio);
    });
}

// Pop-up de confirmacao pos-envio (01/09/2026, a pedido da Ivna: o alerta
// discreto dentro da tela "ficava pouco visivel, nao vi que tinha aberto") -
// reaproveita o mesmo padrao de modal ja usado em "Responder"
// (.modal-overlay/.modal/.modal-top/.modal-actions), so trocando o corpo.
function torreMostrarModalResultado(r) {
  if (!r) return;
  var icones = { ok: '✓', warn: '⚠', err: '✕' };
  var cores = { ok: 'var(--green)', warn: 'var(--orange)', err: 'var(--red)' };
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal" style="max-width:440px">' +
    '<div class="modal-top">' +
    '<div class="modal-title" style="display:flex;align-items:center;gap:9px">' +
    '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:' + cores[r.classe] + ';color:#fff;font-size:14px;flex-shrink:0">' + icones[r.classe] + '</span>' +
    tEsc(r.titulo) +
    '</div>' +
    '<button class="modal-close" onclick="closeModal()">&#x2715;</button>' +
    '</div>' +
    '<div class="modal-body"><p style="font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0">' + tEsc(r.mensagem || '') + '</p>' +
    '<div class="modal-actions"><button class="btn-send" onclick="closeModal()">Entendi</button></div>' +
    '</div></div></div>';
}

function campoRO(label, valor) {
  var preenchido = valor !== '' && valor !== null && valor !== undefined;
  return '<div class="tf-field">'
    + '<label class="tf-label">' + label + (preenchido ? ' <span class="tf-prefilled">✓ automático</span>' : '') + '</label>'
    + '<input class="tf-input" readonly value="' + tEsc(preenchido ? valor : '—') + '">'
    + '</div>';
}

// Diferente de campoRO: o valor NAO e travado, porque nao e um fato
// confirmado - e so o melhor palpite que temos (ver comentario grande em
// normalizarIntelipost/romaneio_transportadora no server.ts sobre por que o
// romaneio da Intelipost nao bate com o do sistema de armazem real). O agente
// pode corrigir antes de mandar pra transportadora.
function campoEditavel(id, label, valor, confirmado) {
  var preenchido = valor !== '' && valor !== null && valor !== undefined;
  // "confirmado" (24/08/2026): diferencia um valor ja verificado no Titan BI
  // (selo verde) de um mero palpite tipo o antigo campo da Intelipost (selo
  // laranja de alerta) - so o romaneio do Titan usa isto hoje.
  var badge = !preenchido ? '' : (confirmado
    ? ' <span class="tf-prefilled" style="color:var(--green)">✓ confirmado no Titan BI</span>'
    : ' <span class="tf-prefilled" style="color:var(--orange)">⚠ sugestão, confira</span>');
  // "tf-romaneio-status" (24/08/2026): so existe pro campo do romaneio - e
  // onde torreSolicitarTitan()/torreAtualizarUiTitan() atualizam o texto via
  // DOM direto (sem re-renderizar o formulario, que apagaria outros campos
  // que o agente ja tivesse preenchido enquanto espera a resposta do Titan).
  return '<div class="tf-field">'
    + '<label class="tf-label">' + label + badge + '</label>'
    + '<input class="tf-input" id="' + id + '" value="' + tEsc(preenchido ? valor : '') + '" placeholder="Preencha se souber">'
    + (id === 'tf-romaneio' ? '<div id="tf-romaneio-status" style="font-size:10px;color:var(--ink-3);margin-top:4px"></div>'
        + '<div class="titan-loading-bar" id="tf-romaneio-bar"><div class="titan-loading-fill" id="tf-romaneio-fill"></div></div>' : '')
    + '</div>';
}

    + '</div>'

    // nao ve o template do TicketsCreator) - so o endereco (quando for
    // Alterar Endereço) e confirmado, porque a doc dele confirma que o
    // fullAddress do correct_address vira o texto pro transportador
    // VERBATIM.
    // Virou pop-up (01/09/2026, a pedido da Ivna: o painel inline deixava
    // "muita coisa na visão" quando expandido dentro do formulario) - ver

    + '<div class="tf-actions">'

function renderTorreResultado(d) {
  var fontes = d.fontes || {};
  var marcaNome = (d.marca && d.marca.nome) || '';
  var ehGocase = !!(d.marca && d.marca.id === 'gocase');
  // Checklist de status logo no comeco da tela (01/09/2026, a pedido da
  // Ivna) - ver renderTorreStatusChecklist. So faz sentido com dado real da
  // Intelipost; sem isso (pedido so-Shopify, ver alerta abaixo) nao ha
  // timeline nenhuma pra basear os checks.
  var html = fontes.intelipost ? renderTorreStatusChecklist(d, ehGocase) : '';
  html += '<div class="torre-fontes">'
    + '<span class="fonte-pill ' + (fontes.intelipost ? 'on' : '') + '">Intelipost ' + (fontes.intelipost ? '✓' : '—') + '</span>'
    + '<span class="fonte-pill ' + (fontes.shopify ? 'on' : '') + '">Shopify ' + (fontes.shopify ? '✓' : '—') + '</span>'
    + (marcaNome ? '<span class="fonte-pill on">' + tEsc(marcaNome) + '</span>' : '')
    + '</div>';

  if (!fontes.intelipost) {
    html += '<div class="torre-alert warn">Este pedido ainda não aparece na Intelipost — os dados abaixo vêm só da Shopify. '
      + 'Normalmente significa que o pedido ainda não foi faturado/despachado, então não há rastreio nem previsão de entrega.</div>';
  }

  var outros = d.outros_pedidos_cliente || [];
  if (outros.length) {
    html += '<div class="torre-ticket-box" style="padding:.9rem 1.1rem">'
      + '<div class="ttb-sub"><b>Outros pedidos deste cliente</b> — clique para abrir a visão 360 dele:</div>'
      + '<div class="torre-outros">'
      + outros.map(function(o) {
          return '<button class="outro-pedido" onclick="torreBuscarPedido(\'' + tEsc(o.numero_pedido) + '\')">'
            + tEsc(o.numero_pedido) + ' <span style="color:var(--ink-4)">· ' + tDataCurta(o.data) + '</span></button>';
        }).join('')
      + '</div></div>';
  }

  html += renderTorreKpis(d);
  html += renderTorreTickets(d);
  // Timeline logo abaixo da caixa de ticket (18/08/2026, a pedido da Ivna) -
  // depois de ver se ja existe ticket aberto, o proximo que o agente quer e o
  // historico de rastreio, antes mesmo dos blocos de dados do pedido.
  html += renderTorreTimeline(d);
  html += renderTorreBlocos(d);
  return html;
}

// --- Acoes ---------------------------------------------------------------
function torreLimparBusca() {
  torreState.termo = '';
  torreState.marca = 'auto';
  torreState.dados = null;
  torreState.erro = '';
  torreState.formAberto = false;
  torreState.resultadoEnvio = null;
  torreState.titan = null;
  renderTorre();
  var inp = document.getElementById('torre-termo');
  if (inp) inp.focus();
}

function torreBuscar() {
  var inp = document.getElementById('torre-termo');
  var sel = document.getElementById('torre-marca');
  var termo = inp ? inp.value.trim() : '';
  if (sel) torreState.marca = sel.value;
  if (!termo) { alert('Digite a NF, o nº do pedido ou o CPF do cliente.'); return; }
  torreState.termo = termo;
  torreState.formAberto = false;
  torreState.resultadoEnvio = null;
  torreState.erro = '';
  torreState.carregando = true;
  torreState.dados = null;
  torreState.titan = null;
  renderTorre();

  // contexto=CURRENT_MARCA (31/08/2026, a pedido da Ivna): trava a busca no
  // toggle Gobeaute/Gocase da sidebar mesmo em "Detectar automaticamente" -
  // sem isso, um pedido de padrao Gobeaute (ex. "SH...RT") era encontrado
  // mesmo com o toggle em Gocase, porque a inferencia por sufixo no server.ts
  // nunca olhava pro toggle.
  var u = '/api/logistica/buscar?termo=' + encodeURIComponent(termo) + '&marca=' + encodeURIComponent(torreState.marca) + '&contexto=' + encodeURIComponent(CURRENT_MARCA);
  fetch(u)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      torreState.carregando = false;
      if (!res.ok || res.j.error) {
        torreState.erro = res.j.error || 'Não foi possível buscar o pedido.';
        torreState.dados = null;
      } else {
        torreState.dados = res.j;
      }
      renderTorre();
      if (torreState.dados) torreSolicitarTitan();
    })
    .catch(function(e) {
      torreState.carregando = false;
      torreState.erro = 'Erro de rede ao consultar: ' + (e && e.message ? e.message : e);
      renderTorre();
    });
}

function torreBuscarPedido(numero) {
  torreState.termo = numero;
  var inp = document.getElementById('torre-termo');
  if (inp) inp.value = numero;
  torreBuscar();
}

function torreAbrirForm() {
  torreState.formAberto = true;
  torreState.resultadoEnvio = null;
  renderTorre();
  torreSolicitarTitan();
  // Preenche o link do Maps de cara quando "Alterar Endereço" ja vem
  // pre-selecionado (01/09/2026, a pedido da Ivna) - sem isso o link so
  // aparecia depois do agente digitar algo, porque o valor pre-preenchido
  // via "value=" no HTML nao dispara o oninput dos campos.
  torreAtualizarLinkMaps();
}

// Mostra o romaneio que o Titan BI ja tem pra este pedido (24/08/2026, a
// pedido da Ivna; mudou de "solicitar" pra so "consultar" em 08/09/2026, a
// pedido da Ivna - ver comentario grande no endpoint /api/logistica/
// titan-status em server.ts). A Torre NUNCA cadastra/reenfileira pedido no
// infos_titan por aqui - so le o que o backfill (titan_backfill.py, 2x/dia)
// ja trouxe do Titan sozinho. Pedido que o backfill ainda nao alcancou
// (fora da janela de 10 dias, ou descoberta recente) simplesmente aparece
// sem romaneio ate a proxima rodada - tanto o campo do formulario quanto o
// painel "Dados do Pedido" continuam mostrando/editando isso manualmente o
// tempo todo nesse meio-tempo.
// Chamada tanto ao pesquisar (torreBuscar) quanto ao abrir o form
// (torreAbrirForm) - so pra pegar o dado mais recente que o Supabase tiver
// nesse instante; chamar de novo ao abrir o form garante que os elementos
// "tf-romaneio-*" (que so existem depois desse clique) recebam o resultado
// mesmo se a consulta da busca original ja tiver terminado antes disso.
// CHAVE = (NOTA FISCAL, MARCA) - migrado de so-NF em 24/08/2026 depois de
// confirmar com print real da tela do Titan que a MESMA NF aparece em mais
// de uma linha (uma por marca), cada uma com romaneio DIFERENTE (ver
// comentario grande no endpoint /api/logistica/titan-status em server.ts).
// Pedido sem NF emitida ainda nao tem como ser consultado - nem tenta, so
// deixa os campos em branco pra edicao manual.
function torreSolicitarTitan() {
  var d = torreState.dados;
  var numeroNf = d && d.pedido && d.pedido.numero_nf;
  var marca = d && d.marca && d.marca.id;
  // Titan BI/Unilog e o CD exclusivo das marcas Gobeaute (31/08/2026, a
  // pedido da Ivna) - Romaneio nao existe pra Gocase, entao nem vale a pena
  // gastar a consulta.
  if (!numeroNf || !marca || marca === 'gocase') return;
  torreAtualizarUiTitan({ status: 'consultando' });
  fetch('/api/logistica/titan-status?nf=' + encodeURIComponent(numeroNf) + '&marca=' + encodeURIComponent(marca))
    .then(function(r) { return r.json(); })
    .then(function(d) { torreAtualizarUiTitan(d); })
    .catch(function() { /* falha silenciosa - os campos continuam editaveis na mao */ });
}

// Atualiza os DOIS lugares da tela que podem mostrar o romaneio do Titan: o
// painel "Dados do Pedido" (dp-romaneio-*, sempre existe depois de uma busca
// com sucesso) e o campo do formulario de abertura de ticket (tf-romaneio*,
// so existe se o agente ja clicou "Abrir Ticket"). Faz isso via DOM direto
// (nunca chamando renderTorre() de novo), pra nao perder nada que o agente
// ja tenha preenchido em outros campos enquanto espera.
//
// SO LEITURA (08/09/2026, a pedido da Ivna): a Torre nao cadastra/reenfileira
// pedido nenhum no infos_titan - so mostra o que o backfill ja trouxe do
// Titan sozinho (2x/dia). Por isso nao ha mais polling/retry aqui: uma unica
// consulta (torreSolicitarTitan) e o resultado e definitivo pra essa tela -
// se vier 'pendente' de verdade (linha existe mas o backfill ainda nao
// terminou de processar essa rodada) ou 'inexistente' (backfill ainda nao
// alcancou esse pedido), so informamos isso, sem ficar tentando de novo.
function torreAtualizarUiTitan(d) {
  var statusForm = document.getElementById('tf-romaneio-status');
  var inputForm = document.getElementById('tf-romaneio');
  var statusPainel = document.getElementById('dp-romaneio-status');
  var valorPainel = document.getElementById('dp-romaneio-valor');
  if (!statusForm && !statusPainel) return;

  // Alimenta o checklist de status (renderTorreStatusChecklist) com a linha
  // completa do Titan (situacao/eventos) - guardado em torreState (nao so no
  // DOM) pelo mesmo motivo do romaneio abaixo: sobrevive a abrir/fechar o
  // formulario, que redesenha a tela a partir do estado salvo.
  torreState.titan = d;
  torreAtualizarUiStatusChecklist();

  function aplicar(texto, cor, valorConfirmado) {
    if (statusForm) { statusForm.textContent = texto; statusForm.style.color = cor; }
    if (statusPainel) { statusPainel.textContent = texto; statusPainel.style.color = cor; }
    if (valorConfirmado) {
      if (inputForm && !inputForm.value) inputForm.value = valorConfirmado; // nunca sobrescreve digitacao manual
      if (valorPainel) valorPainel.textContent = valorConfirmado;
      // Guarda na "memoria" da tela (24/08/2026, bug real reportado pela
      // Ivna): sem isso, o valor so vivia no DOM - abrir/fechar o formulario
      // chama renderTorre(), que redesenha "Dados do Pedido" do zero a partir
      // de torreState.dados, que nunca tinha aprendido esse valor, entao o
      // "—" voltava mesmo com a consulta ja concluida.
      if (torreState.dados && torreState.dados.pedido) torreState.dados.pedido.romaneio_titan = valorConfirmado;
    }
  }

  if (d.status === 'consultando') { aplicar('Consultando o Titan BI...', 'var(--ink-3)', null); return; }

  // O romaneio ja gravado vale mesmo se status !== 'concluido' (bug real
  // reportado pela Ivna, 27/08/2026): o recheck automatico do backfill
  // devolve pedidos com situacao nao-final pra fila (status volta a
  // 'pendente') pra tentar achar uma atualizacao mais recente, mas o
  // romaneio ja confirmado antes continua valido nessa linha - so a
  // situacao/data podem estar desatualizadas por uns minutos.
  if (d.romaneio) { aplicar('✓ confirmado no Titan BI - confira antes de repassar.', 'var(--green)', d.romaneio); return; }
  if (d.status === 'concluido') { aplicar('Titan BI consultado, mas não achou romaneio para este pedido.', 'var(--ink-3)', null); return; }
  if (d.status === 'erro') { aplicar('Titan BI: ' + (d.erro || 'erro desconhecido') + '.', 'var(--red)', null); return; }
  if (d.status === 'inexistente') { aplicar('', 'var(--ink-3)', null); return; }
  // 'pendente' (linha existe mas o backfill ainda nao concluiu essa rodada
  // pra ela) - a Torre nao solicita nem espera, so informa.
  aplicar('Titan BI ainda não trouxe esse pedido - o backfill roda 2x/dia, tente consultar de novo mais tarde.', 'var(--ink-3)', null);
}
function torreFecharForm() { torreState.formAberto = false; renderTorre(); }

// Monta a previa ESTIMADA reaproveitando torreGerarAssunto/torreGerarCorpoEmail
// (ver comentario grande no botao "Ver previa estimada", renderTorreForm) -
// le os campos AO VIVO do formulario (nao so torrePreencherForm(d), que nao
// tem o que o agente ja editou: problema, responsavel, romaneio corrigido,
// endereco novo).
function torreMontarPreviaEmail() {
  var d = torreState.dados;
  if (!d) return null;
  var f = torrePreencherForm(d);
  f.problema = (document.getElementById('tf-problema') || {}).value || f.problema;
  f.responsavel = (document.getElementById('tf-responsavel') || {}).value || f.responsavel;
  var romaneioCorrigido = (document.getElementById('tf-romaneio') || {}).value;
  if (romaneioCorrigido) f.romaneio_transportadora = romaneioCorrigido;
  if (f.problema === 'Alterar Endereço') f.endereco_novo = torreLerEnderecoNovo().fullAddress;
  return { assunto: torreGerarAssunto(f), corpo: torreGerarCorpoEmail(f, '') };
}

// Le os campos separados do endereco novo (ver renderTorreForm) e devolve
// tanto as partes (pro correct_address estruturado que a Regra 1 do
// TicketsCreator exige) quanto o texto composto (fullAddress - o que vai
// literal pra transportadora, mesma ordem que o proprio TicketsCreator usa
// como fallback quando fullAddress nao vem: address1,address2,address3,
// address4,city,state,country_code,zipcode).
// Limpa pontuacao sobrando (01/09/2026, achado real: a Intelipost devolveu
// "585," com virgula no numero) - so a chamada DIRETA ao TicketsCreator
// (pedido ja despachado) passa por aqui; a fila do Diego ja limpa do lado
// dela pro caminho que passa por enfileirarEndereco().
function torreLerEnderecoNovo() {
  function v(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim().replace(/^[,;\-\s]+|[,;\-\s]+$/g, '') : '';
  }
  var partes = {
    address1: v('tf-end-rua'), address2: v('tf-end-numero'), address3: v('tf-end-complemento'),
    address4: v('tf-end-bairro'), city: v('tf-end-cidade'), state: v('tf-end-uf').toUpperCase(),
    zipcode: v('tf-end-cep'), country_code: 'BR',
  };
  var fullAddress = [partes.address1, partes.address2, partes.address3, partes.address4,
    partes.city, partes.state, partes.country_code, partes.zipcode].filter(Boolean).join(', ');
  return { partes: partes, fullAddress: fullAddress };
}

// Atualiza o link "Ver no Google Maps" em tempo real conforme o agente edita
// o endereco novo - assim ele confirma visualmente que digitou certo ANTES de
// mandar pra transportadora.
function torreAtualizarLinkMaps() {
  var link = document.getElementById('tf-link-maps');
  if (!link) return;
  var url = gerarUrlGoogleMaps(torreLerEnderecoNovo().fullAddress);
  if (url) { link.href = url; link.style.display = 'inline-block'; }
  else { link.style.display = 'none'; }
}

// torreAbrirTicket, que fez o papel das duas) - o e-mail manual pro

// ===========================================================================
// UNILOG CD (25/08/2026)
// ===========================================================================
// Tela irma da Torre: mesma busca unificada (/api/logistica/buscar), mas o
// foco aqui e o Centro de Distribuicao da Unilog (parceiro de armazenagem das
// marcas Gobeaute). Depois de achar o pedido, consulta o Titan BI (mesma
// fila/cache infos_titan que a Torre ja usa pro romaneio - ver comentario
// grande em torreSolicitarTitan - so que aqui mostrando o documento inteiro:
// situacao, datas, eventos e itens com EAN/SKU) e monta um rascunho pronto
// pra abrir uma ocorrencia no formulario publico da Unilog (Bitrix24 Site -
// nao existe API oficial pra ele, so o form web, confirmado com a Ivna).
//
// POR DESIGN, NADA AQUI ENVIA A OCORRENCIA DE VERDADE: so mostra, num cartao,
// os fatos que a Central JA SABE de fontes proprias (CNPJ via remetente
// Intelipost, NF, pedido, EAN via Metabase, romaneio via Titan) mais uma
// descricao pre-preenchida e editavel com botao de copiar - ver
// renderUnilogOcorrenciaCard. Tipo de ocorrencia, especificacao,
// nome/telefone/email da agente ficam de fora de proposito (25/08/2026, a
// pedido da Ivna: "apenas os que nao precisam ser passados pela propria
// agente") - isso ela preenche direto no formulario real da Unilog, que abre
// numa aba nova pelo link do cartao.

var unilogState = {
  termo: '',
  carregando: false,
  erro: '',
  candidatos: null,  // array de linhas do infos_titan quando a NF bate em mais de uma marca (ver unilogBuscar)
  candidatoTitan: null, // o candidato escolhido (fatos do Titan) - fonte de fallback quando a Torre nao acha o pedido (ver unilogUsarCandidato)
  avisoTorre: '',    // aviso nao-bloqueante quando a Torre falha mas ja temos candidatoTitan
  dados: null,       // resultado de /api/logistica/buscar (mesmo shape da Torre)
  titan: null,       // linha crua de infos_titan (documento completo do Titan)
  titanStatus: '',   // '', 'pendente', 'concluido', 'erro', 'timeout', 'inexistente', 'sem_nf'
  envio: null,       // {enviando, resultado} do POST /api/logistica/unilog-ocorrencia (ver unilogEnviarOcorrencia)
};

function renderUnilog() {
  var el = document.getElementById('main-content');
  if (!el) return;
  el.classList.add('torre-ativo');

  var html = ''
    + '<div class="torre-search-wrap">'
    +   '<div class="torre-search-row">'
    +     '<div class="torre-search-field">'
    +       '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    +       '<input type="text" id="unilog-termo" placeholder="Buscar por NF ou nº do pedido..." value="' + tEsc(unilogState.termo) + '" onkeydown="if(event.key===\'Enter\')unilogBuscar()">'
    +     '</div>'
    +     '<button class="torre-btn" id="unilog-btn-buscar" onclick="unilogBuscar()"' + (unilogState.carregando ? ' disabled' : '') + '>'
    +       (unilogState.carregando ? 'Buscando...' : 'Buscar pedido') + '</button>'
    +   '</div>'
    + '</div>';

  if (unilogState.carregando) {
    html += '<div class="state-box"><p>Consultando Intelipost e Shopify...</p></div>';
  } else if (unilogState.candidatos) {
    html += renderUnilogCandidatos(unilogState.candidatos);
  } else if (unilogState.dados || unilogState.candidatoTitan) {
    // candidatoTitan sozinho (sem dados) acontece quando a Torre nao acha o
    // pedido, mas ja temos os fatos do Titan - ver unilogDadosEfetivos.
    html += renderUnilogResultado(unilogDadosEfetivos());
  } else if (unilogState.erro) {
    html += '<div class="torre-alert err">' + tEsc(unilogState.erro) + '</div>';
  } else {
    html += '<div class="state-box"><p>Pesquise um pedido (NF ou nº do pedido) para ver os dados do Titan BI (situação, eventos, itens com EAN/SKU) e preparar uma ocorrência para a Unilog.</p></div>';
  }

  el.innerHTML = html;
}

// Escolha manual quando a mesma NF existe em mais de uma marca (25/08/2026,
// bug real encontrado pela Ivna: NF 940380 achou "Lescent" na Torre via
// Intelipost/Shopify, mas o Titan BI so tem essa NF pra Kokeshi/Rituaria/
// Apice - a Torre resolveu pra uma marca que nem aparece no Titan pra essa
// NF). Lista o que o Titan ja tem cacheado (infos_titan, so leitura, sem
// disparar consulta nova) pra o agente escolher o pedido certo ANTES de
// buscar na Torre - fixa a marca certa em vez de deixar o "auto" arriscar.
function renderUnilogCandidatos(candidatos) {
  var linhas = candidatos.map(function(c) {
    var marcaInfo = TORRE_MARCAS.filter(function(m) { return m.id === (c.marca || '').toLowerCase(); })[0];
    var nomeMarca = marcaInfo ? marcaInfo.nome : (c.nome_projeto || c.marca || '?');
    return '<button class="torre-btn torre-btn-ghost" style="display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px;gap:12px" onclick="unilogEscolherCandidato(\'' + tEsc(c.marca) + '\')">'
      + '<span><b>' + tEsc(nomeMarca) + '</b> · ' + tEsc(c.situacao || c.status || '—') + '</span>'
      + '<span style="color:var(--ink-3);font-size:12px">Pedido ' + tEsc(c.numero_pedido || '—') + (c.romaneio ? ' · Romaneio ' + tEsc(c.romaneio) : '') + '</span>'
      + '</button>';
  }).join('');
  return '<div class="torre-alert warn"><b>Essa NF aparece em mais de uma marca no Titan BI.</b> Escolha o pedido certo antes de continuar:</div>'
    + '<div style="margin-top:.5rem">' + linhas + '</div>';
}

function unilogBuscar() {
  var inp = document.getElementById('unilog-termo');
  var termo = inp ? inp.value.trim() : '';
  if (!termo) { alert('Digite a NF ou o nº do pedido.'); return; }
  unilogState.termo = termo;
  unilogState.erro = '';
  unilogState.avisoTorre = '';
  unilogState.candidatos = null;
  unilogState.candidatoTitan = null;
  unilogState.carregando = true;
  unilogState.dados = null;
  unilogState.titan = null;
  unilogState.titanStatus = '';
  unilogState.envio = null;
  renderUnilog();

  // Antes de deixar a Torre "adivinhar" a marca, confere no Titan (leitura do
  // que ja esta cacheado em infos_titan, sem disparar consulta nova) se essa
  // NF ja aparece em mais de uma marca - ver comentario grande em
  // renderUnilogCandidatos sobre o bug real que motivou isso.
  fetch('/api/logistica/titan-candidatos?nf=' + encodeURIComponent(termo))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      var candidatos = (res && res.candidatos) || [];
      if (candidatos.length > 1) {
        unilogState.carregando = false;
        unilogState.candidatos = candidatos;
        renderUnilog();
        return;
      }
      var unico = candidatos.length === 1 ? candidatos[0] : null;
      unilogUsarCandidato(unico);
      unilogBuscarComMarca(termo, unico ? unico.marca : null);
    })
    .catch(function() {
      // Falha ao checar candidatos nao pode travar a busca normal - segue
      // com a deteccao automatica de sempre.
      unilogBuscarComMarca(termo, null);
    });
}

function unilogEscolherCandidato(marca) {
  var candidato = (unilogState.candidatos || []).filter(function(c) { return c.marca === marca; })[0] || null;
  unilogState.candidatos = null;
  unilogUsarCandidato(candidato);
  unilogBuscarComMarca(unilogState.termo, marca);
}

// FONTE PRINCIPAL pra Unilog CD (25/08/2026, bug real: a Torre so acha um
// pedido via Intelipost/Shopify se ja existir ticket de atendimento pra
// traduzir NF->pedido - pedidos que o Titan conhece mas nunca geraram
// ticket, que e o uso normal da Unilog CD, nao tem essa ponte e a busca da
// Torre falhava, derrubando a tela inteira mesmo com o Titan/Supabase ja
// tendo tudo certo). Usa o candidato (que ja vem do infos_titan, a mesma
// fonte que titan-candidatos leu) pra mostrar romaneio/situacao IMEDIATAMENTE
// e buscar o documento completo (eventos/itens) direto - sem depender da
// Torre pra nada disso. A Torre continua sendo chamada em paralelo (ver
// unilogBuscarComMarca), mas so pra CNPJ/EAN - se ela falhar, a tela
// continua de pe com o que o Titan ja confirmou.
function unilogUsarCandidato(candidato) {
  unilogState.candidatoTitan = candidato || null;
  if (!candidato) return;
  unilogState.titan = candidato;
  unilogState.titanStatus = candidato.status || 'concluido';
  // O candidato (titan-candidatos) ja veio com situacao/romaneio/status,
  // mas nao com eventos/itens (select enxuto, pra listar candidatos rapido)
  // - so LEMOS o documento completo aqui (titan-status), nunca cadastramos/
  // reenfileiramos nada (08/09/2026, a pedido da Ivna - ver comentario
  // grande em unilogSolicitarTitan).
  unilogConsultarTitanCompleto(unilogState.termo, candidato.marca);
}

// Quando a Torre nao acha o pedido, monta um "d" sintetico so com o que o
// Titan/candidatoTitan ja confirmou - o resto (renderUnilogOcorrenciaCard,
// unilogDescricaoInicial) ja sabe lidar com campos vazios (CNPJ/EAN ficam
// "—" em vez de travar a tela).
function unilogDadosEfetivos() {
  if (unilogState.dados) return unilogState.dados;
  if (!unilogState.candidatoTitan) return null;
  var c = unilogState.candidatoTitan;
  var marcaInfo = TORRE_MARCAS.filter(function(m) { return m.id === (c.marca || '').toLowerCase(); })[0];
  return {
    marca: { id: c.marca, nome: (marcaInfo && marcaInfo.nome) || c.nome_projeto || c.marca },
    pedido: { numero_nf: unilogState.termo, numero_pedido: c.numero_pedido || '', produtos: [] },
    remetente: {},
    destinatario: {},
  };
}

function unilogBuscarComMarca(termo, marcaForcada) {
  unilogState.carregando = true;
  renderUnilog();

  var u = '/api/logistica/buscar?termo=' + encodeURIComponent(termo) + '&marca=' + encodeURIComponent(marcaForcada || 'auto');
  fetch(u)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      unilogState.carregando = false;
      if (!res.ok || res.j.error) {
        unilogState.dados = null;
        if (unilogState.candidatoTitan) {
          // Ja temos os fatos do Titan (romaneio/situacao/eventos/itens via
          // unilogUsarCandidato) - a falha da Torre so custa CNPJ/EAN, nao
          // trava a tela inteira (ver comentario grande em unilogUsarCandidato).
          unilogState.avisoTorre = 'CNPJ e EAN indisponíveis - este pedido não foi encontrado na Intelipost/Shopify. Os dados do Titan BI abaixo continuam válidos.';
        } else {
          unilogState.erro = res.j.error || 'Não foi possível buscar o pedido.';
        }
      } else if (res.j.marca && res.j.marca.id === 'gocase') {
        // Unilog e um CD exclusivo das marcas Gobeaute - um pedido Gocase
        // encontrado (so possivel quando marca='auto') nao tem o que fazer
        // aqui (ver comentario grande no topo da secao).
        unilogState.erro = 'Este pedido é da Gocase - a Unilog CD atende apenas marcas Gobeaute.';
        unilogState.dados = null;
      } else {
        unilogState.dados = res.j;
        unilogState.avisoTorre = '';
      }
      renderUnilog();
      // Se ja veio de um candidato do Titan, unilogUsarCandidato ja disparou
      // a consulta - nao duplica.
      if (unilogState.dados && !unilogState.candidatoTitan) unilogSolicitarTitan();
    })
    .catch(function(e) {
      unilogState.carregando = false;
      if (unilogState.candidatoTitan) {
        unilogState.avisoTorre = 'CNPJ e EAN indisponíveis (erro de rede ao consultar a Intelipost/Shopify). Os dados do Titan BI abaixo continuam válidos.';
      } else {
        unilogState.erro = 'Erro de rede ao consultar: ' + (e && e.message ? e.message : e);
      }
      renderUnilog();
    });
}

// SO LEITURA (08/09/2026, a pedido da Ivna): a Unilog CD nao cadastra nem
// reenfileira pedido nenhum no infos_titan - so mostra o documento que o
// backfill (titan_backfill.py, 2x/dia) ja trouxe do Titan sozinho. Usada
// tanto por unilogUsarCandidato (candidato ja veio resumido, aqui buscamos o
// documento completo com eventos/itens) quanto por unilogSolicitarTitan
// (quando a busca da Torre achou a marca mas nao veio via candidato).
function unilogConsultarTitanCompleto(numeroNf, marca) {
  fetch('/api/logistica/titan-status?nf=' + encodeURIComponent(numeroNf) + '&marca=' + encodeURIComponent(marca))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      unilogState.titan = d;
      unilogState.titanStatus = d.status;
      unilogRenderTitanPainelDom();
    })
    .catch(function() { /* falha silenciosa - o painel fica com o que ja tinha (candidato, se houver) */ });
}

function unilogSolicitarTitan() {
  var d = unilogState.dados;
  var numeroNf = d && d.pedido && d.pedido.numero_nf;
  var marca = d && d.marca && d.marca.id;
  if (!numeroNf || !marca) {
    unilogState.titanStatus = 'sem_nf';
    unilogRenderTitanPainelDom();
    return;
  }
  unilogState.titanStatus = 'consultando';
  unilogRenderTitanPainelDom();
  unilogConsultarTitanCompleto(numeroNf, marca);
}

// Atualiza SO o painel do Titan via DOM direto (nunca renderUnilog() inteiro)
// - o agente pode ja estar preenchendo o formulario de ocorrencia enquanto
// isso ainda esta em andamento (mesmo cuidado que torreAtualizarUiTitan tem
// com o formulario da Torre).
function unilogRenderTitanPainelDom() {
  var el = document.getElementById('unilog-titan-painel');
  if (!el) return;
  el.innerHTML = renderUnilogTitanPaineis();
  // O cartao "Dados para abrir a ocorrencia" ja foi desenhado antes do Titan
  // responder - atualiza so o valor do romaneio ali via DOM direto (nao
  // redesenha o cartao inteiro, que apagaria uma descricao ja editada).
  var elRomaneio = document.getElementById('unilog-romaneio-valor');
  if (elRomaneio) elRomaneio.textContent = tVal(unilogState.titan && unilogState.titan.romaneio);
}

function renderUnilogTitanPaineis() {
  var status = unilogState.titanStatus;
  var t = unilogState.titan || {};
  // Se ja tem situacao/romaneio cacheados, mostra a tabela de dados direto
  // - nao importa se o status voltou a 'pendente'/'erro' num recheck mais
  // recente (mesmo raciocinio do fix na Torre, 27/08/2026: dado antigo
  // ainda vale, so pode estar levemente desatualizado por uns minutos).
  var temDados = !!(t.situacao || t.romaneio);
  if (status === 'sem_nf') {
    return '<div class="torre-alert warn">Este pedido ainda não tem Nota Fiscal emitida - o Titan BI só é consultável por NF.</div>';
  }
  if (!temDados && (status === 'consultando' || status === '')) {
    return '<div class="state-box"><p>Consultando o Titan BI...</p></div>';
  }
  if (!temDados && status === 'erro') {
    return '<div class="torre-alert err">Titan BI: ' + tEsc(t.erro || 'erro desconhecido') + '</div>';
  }
  if (!temDados && (status === 'inexistente' || status === 'concluido')) {
    return '<div class="torre-alert warn">NF não encontrada no Titan BI para esta marca.</div>';
  }
  // 'pendente' (linha existe mas o backfill ainda nao concluiu essa rodada
  // pra ela) - a Unilog CD nao solicita nem espera, so informa (08/09/2026).
  if (!temDados && status === 'pendente') {
    return '<div class="torre-alert warn">Titan BI ainda não trouxe esse pedido - o backfill roda 2x/dia, tente consultar de novo mais tarde.</div>';
  }

  var eventos = t.eventos || [];
  var itens = t.itens || [];

  var infoRows = [
    ['Situação', tVal(t.situacao)],
    ['Romaneio', tVal(t.romaneio)],
    ['Nome Projeto', tVal(t.nome_projeto)],
    ['Valor Pedido', t.valor_pedido != null ? tMoeda(t.valor_pedido) : '—'],
    ['Volume', tVal(t.volume)],
    ['Data Importado', tData(t.data_importado)],
    ['Data Expedido', tData(t.data_expedido)],
    ['Data Conferido', tData(t.data_conferido)],
    ['Observação', tVal(t.observacao)],
  ].map(function(r) {
    return '<div class="bloco-row"><div class="bloco-k">' + r[0] + '</div><div class="bloco-v">' + r[1] + '</div></div>';
  }).join('');

  var eventosHtml = !eventos.length
    ? '<div class="state-box" style="padding:1rem"><p>Sem eventos registrados no Titan.</p></div>'
    : '<table class="tl-table"><thead><tr><th>Horário da Situação</th><th>Situação</th></tr></thead><tbody>'
      + eventos.map(function(e) {
          return '<tr><td class="tl-when">' + tData(e['Horário da Situação'] || e.horario || '') + '</td><td class="tl-status">' + tEsc(e['Situação'] || e.situacao || '') + '</td></tr>';
        }).join('')
      + '</tbody></table>';

  var itensHtml = !itens.length
    ? '<div class="state-box" style="padding:1rem"><p>Sem itens registrados no Titan.</p></div>'
    : '<table class="tl-table"><thead><tr><th>Código/EAN</th><th>Descrição</th><th>Quantidade</th></tr></thead><tbody>'
      + itens.map(function(it) {
          var codigo = it['Ean'] || it['EAN'] || it['Código'] || it.ean || it.codigo || '';
          var desc = it['Descrição'] || it.descricao || '';
          var qtd = it['Quantidade'] || it.quantidade || '';
          return '<tr><td>' + tEsc(codigo) + '</td><td>' + tEsc(desc) + '</td><td>' + tEsc(qtd) + '</td></tr>';
        }).join('')
      + '</tbody></table>';

  return ''
    + '<div class="torre-blocos" style="grid-template-columns:1fr">'
    +   '<div class="bloco"><div class="bloco-head">Informação do Pedido (Titan BI)</div><div class="bloco-body">' + infoRows + '</div></div>'
    + '</div>'
    + '<div class="torre-timeline" style="margin-top:1rem"><div class="bloco-head">Eventos</div>' + eventosHtml + '</div>'
    + '<div class="torre-timeline" style="margin-top:1rem"><div class="bloco-head">Itens do Pedido</div>' + itensHtml + '</div>';
}

function renderUnilogResultado(d) {
  var p = d.pedido || {};
  var marcaNome = (d.marca && d.marca.nome) || '';
  var html = '<div style="margin-bottom:1rem;font-size:12px;color:var(--ink-3)">'
    + tEsc(marcaNome) + ' · Pedido ' + tEsc(p.numero_pedido || '—') + ' · NF ' + tEsc(p.numero_nf || '—')

function unilogCopiarDescricao() {

// Selecao de produto pra Unilog CD (04-05/09/2026, a pedido da Ivna) - mesmo
// formato de duas etapas do Cerebro de Trocas ("Quais produtos apresentaram
// problema?" -> decisao por item): pills com os itens do PEDIDO (multi-
// selecao, ja vem com EAN - ver torreBuscarNaMarca em server.ts,
// buscarEanPorSku), e pra CADA item marcado, uma decisao: "Faltou" (insere
// direto) ou "Veio trocado" (abre busca livre no Protheus so pra achar o
// produto RECEBIDO, que nao esta no pedido - a Central nao tem como saber
// qual foi sem o agente procurar). Frases finais, no formato exato que a
// Ivna pediu:
// - Faltou: "Pedido faltando SKU X – EAN Y"
// - Trocado: "Cliente recebeu trocado: pediu SKU A – EAN B e recebeu SKU C – EAN D"
function renderUnilogBuscaProdutoHtml() {
  var produtosPedido = window._unilogProdutosPedido || [];
  var problema = window._unilogItensProblema || {};
  var resolucoes = window._unilogResolucoes || {};

  if (!produtosPedido.length) {
    return '<div class="torre-alert warn" style="margin:0">Pedido sem itens conhecidos - descreva manualmente na caixa abaixo.</div>';
  }

  var pills = produtosPedido.map(function(p, i) {
    var ativo = !!problema[i];
    return '<button type="button" onclick="unilogToggleItemProblema(' + i + ')" style="display:inline-flex;align-items:center;gap:6px;border:1px solid '
      + (ativo ? 'var(--red)' : 'var(--border-2)') + ';background:' + (ativo ? 'var(--red-bg)' : 'var(--white)') + ';color:' + (ativo ? 'var(--red)' : 'var(--ink-3)')
      + ';border-radius:20px;padding:7px 14px;cursor:pointer;font-family:\'Poppins\',sans-serif;font-size:12px;font-weight:600;margin:0 8px 8px 0">'
      + '<span style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + (ativo ? 'var(--red)' : 'var(--border-2)') + '"></span>'
      + tEsc(p.descricao || p.sku || '—') + '</button>';
  }).join('');

  var indicesSelecionados = [];
  produtosPedido.forEach(function(p, i) { if (problema[i]) indicesSelecionados.push(i); });

  var acoes = indicesSelecionados.map(function(i) {
    var p = produtosPedido[i];
    var res = resolucoes[i];
    var corpo;
    if (res) {
      corpo = '<div style="color:var(--green);font-size:12px;font-weight:700;margin-top:4px">✓ '
        + (res.tipo === 'falta' ? 'Marcado como faltando' : ('Trocado - cliente recebeu SKU ' + tEsc(res.recebeu.sku))) + '</div>';
    } else {
      corpo = '<div style="display:flex;gap:10px;margin-top:8px">'
        + '<button type="button" onclick="unilogResolverItemFalta(' + i + ')" style="display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--orange);background:var(--orange-bg);color:var(--orange);border-radius:20px;padding:8px 16px;cursor:pointer;font-family:\'Poppins\',sans-serif;font-size:12.5px;font-weight:700">⚠ Item faltante</button>'
        + '<button type="button" onclick="unilogAbrirTrocaItem(' + i + ')" style="display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--purple);background:var(--purple-bg);color:var(--purple);border-radius:20px;padding:8px 16px;cursor:pointer;font-family:\'Poppins\',sans-serif;font-size:12.5px;font-weight:700">⇄ Item trocado</button>'
        + '</div>'
        + '<div id="uf-troca-busca-' + i + '" style="display:none;margin-top:8px">'
        +   '<div class="tf-label" style="font-size:11px;margin-bottom:4px">Produto que o cliente recebeu no lugar</div>'
        +   '<div style="display:flex;gap:8px;margin-bottom:6px">'
        +     '<input class="tf-input" id="uf-troca-input-' + i + '" style="flex:1" placeholder="SKU, EAN ou nome do produto" onkeydown="if(event.key===\'Enter\'){event.preventDefault();unilogBuscarTrocaItem(' + i + ');}">'

function unilogBuscarTrocaItem(i) {
  var campo = document.getElementById('uf-troca-input-' + i);
  var resultados = document.getElementById('uf-troca-resultados-' + i);
  var termo = (campo && campo.value || '').trim();
  if (!resultados) return;

  resultados.innerHTML = '<div class="state-box" style="padding:8px"><p>Buscando...</p></div>';
  fetchComTimeout('/api/logistica/produto-protheus?termo=' + encodeURIComponent(termo), {}, 15000)
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      if (!res.ok) { resultados.innerHTML = '<div class="torre-alert err" style="margin:0">' + tEsc((res.j && res.j.error) || 'falha na busca') + '</div>'; return; }
      var produtos = (res.j && res.j.produtos) || [];
      window._unilogProdutosPorSlot['troca_' + i] = produtos;
      if (!produtos.length) { resultados.innerHTML = '<div class="state-box" style="padding:8px"><p>Nenhum produto encontrado.</p></div>'; return; }
      resultados.innerHTML = produtos.map(function(p, idx) {
        return '<div class="bloco-row" style="cursor:pointer" onclick="unilogSelecionarTrocaItem(' + i + ', ' + idx + ')" title="Clique para usar este produto">'
          + '<div class="bloco-k">' + tEsc(p.sku || '—') + (p.marca ? ' · ' + tEsc(p.marca) : '') + '</div>'
          + '<div class="bloco-v">' + tEsc(p.nome || '—') + (p.ean ? ' <span style="color:var(--ink-4)">(EAN ' + tEsc(p.ean) + ')</span>' : '') + '</div>'
          + '</div>';
      }).join('');

    .catch(function(e) {
      resultados.innerHTML = '<div class="torre-alert err" style="margin:0">Erro de conexão: ' + tEsc((e && e.message) || e) + '</div>';
    });
}

// Mesmo padrao de adicionarAnexos (index.html, usado pela Torre) - le como
// base64 via FileReader e guarda em window._unilogAnexos, array PROPRIO da
// Unilog CD (nao window._anexos, que e da Torre) pra as duas telas nunca
// colidirem. O Worker unilog_cf_abertura reconstroi cada arquivo via
// DataTransfer dentro do proprio browser remoto (ver comentario grande no
// topo de unilog_cf_abertura/src/index.ts sobre por que uploadFile() do
// Puppeteer nao funciona no Browser Rendering).
function unilogAdicionarAnexos(input) {
  var lista = document.getElementById('unilog-anexos-list');
  Array.from(input.files).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      window._unilogAnexos.push({ name: file.name, type: file.type, data: base64 });
      var tag = document.createElement('div');
      tag.style.cssText = 'display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);color:var(--blue);border:1px solid #c5d8f8;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:500';
      tag.dataset.anexoName = file.name;
      tag.innerHTML = tEsc(file.name) + '<span onclick="var p=this.parentElement;window._unilogAnexos=window._unilogAnexos.filter(function(a){return a.name!==p.dataset.anexoName});p.remove();" style="cursor:pointer;margin-left:2px;opacity:.6;font-size:13px">&times;</span>';
      if (lista) lista.appendChild(tag);
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

// Preenche e envia de verdade - POST /api/logistica/unilog-ocorrencia
// (server.ts) grava o rascunho em ocorrencias_unilog e chama o Worker
// unilog_cf_abertura, que abre o formulario real da Unilog, preenche tudo e
// CLICA ENVIAR de verdade (decisao explicita da Ivna, 31/08/2026 - ver
// comentario grande em unilog_cf_abertura/src/index.ts). Acao real e
// irreversivel do lado da Unilog, por isso o confirm() antes de disparar -
// mesmo cuidado que torreEnviarEmailReal ja tem pro envio de e-mail real.
function unilogEnviarOcorrencia() {
  var cnpj = ((document.getElementById('uf-cnpj') || {}).value || '').replace(/\D/g, '');
  var numeroNf = ((document.getElementById('uf-nf') || {}).value || '').trim();
  var tipo = (document.getElementById('uf-tipo') || {}).value || '';
  var especificacao = (document.getElementById('uf-especificacao') || {}).value || '';
  var descricao = ((document.getElementById('uf-descricao') || {}).value || '').trim();
  if (!cnpj) { alert('Preencha o CNPJ (o formulário da Unilog exige esse campo).'); return; }
  if (!numeroNf) { alert('Preencha o Nº da Nota Fiscal/Nº do Pedido.'); return; }
  if (!tipo) { alert('Selecione o Tipo de ocorrência.'); return; }
  if (!especificacao) { alert('Selecione a Especificação.'); return; }
  if (!descricao) { alert('Preencha a descrição da ocorrência.'); return; }

  var nomeAgente = (document.getElementById('uf-nome-agente') || {}).value || '';
  var telefone = (document.getElementById('uf-telefone') || {}).value || '';
  var email = (document.getElementById('uf-email') || {}).value || '';
  var endereco = (document.getElementById('uf-endereco') || {}).value || '';
  localStorage.setItem('unilog_agente_telefone', telefone);
  localStorage.setItem('unilog_agente_email', email);

  if (!confirm('Confirma o ENVIO REAL desta ocorrência pra Unilog (' + tipo + ' / ' + especificacao + ')?\n\nEssa ação cria uma ocorrência de verdade no sistema da Unilog e não pode ser desfeita.')) return;

  var d = unilogDadosEfetivos() || {};
  var p = d.pedido || {};

  var btn = document.getElementById('uf-btn-enviar');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
  unilogState.envio = { enviando: true, resultado: null };
  unilogRenderEnvioDom();

  fetch('/api/logistica/unilog-ocorrencia', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      marca: (d.marca && d.marca.id) || '',
      cnpj: cnpj,
      nome_agente: nomeAgente,
      telefone: telefone,
      email: email,
      tipo_ocorrencia: tipo,
      especificacao: especificacao,
      endereco_entrega: endereco,
      numero_nf: numeroNf,
      numero_pedido: p.numero_pedido || '',
      descricao: descricao,
      anexos: window._unilogAnexos || [],
    }),
  })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      unilogState.envio = { enviando: false, resultado: res.j || {} };
      if (btn) { btn.disabled = false; btn.textContent = 'Preencher e enviar na Unilog'; }
      unilogRenderEnvioDom();
    })
    .catch(function(e) {
      unilogState.envio = { enviando: false, resultado: { enviado: false, erro: 'Erro de rede: ' + (e && e.message ? e.message : e) } };
      if (btn) { btn.disabled = false; btn.textContent = 'Preencher e enviar na Unilog'; }
      unilogRenderEnvioDom();
    });
}

function unilogRenderEnvioDom() {
  var el = document.getElementById('unilog-envio-resultado');
  if (el) el.innerHTML = renderUnilogEnvioResultado();
}

function renderUnilogEnvioResultado() {
  var envio = unilogState.envio;
  if (!envio) return '';
  if (envio.enviando) {
    return '<div class="torre-alert warn" style="margin-top:10px">Enviando pra Unilog, aguarde (pode levar até 1 minuto)...</div>';
  }
  var r = envio.resultado || {};
  var screenshotHtml = r.screenshot_base64
    ? '<img src="data:image/png;base64,' + r.screenshot_base64 + '" style="max-width:100%;border:1px solid var(--border-2);border-radius:var(--radius);margin-top:8px">'
    : '';
  if (r.enviado) {
    return '<div class="torre-alert ok" style="margin-top:10px">✓ Ocorrência enviada com sucesso pra Unilog (protocolo ' + tEsc(r.protocolo || '—') + ').</div>' + screenshotHtml;
  }
  return '<div class="torre-alert err" style="margin-top:10px">Não foi possível enviar: ' + tEsc(r.erro || 'erro desconhecido') + '</div>' + screenshotHtml;
}

function unilogDescricaoInicial(d) {
  var p = (d && d.pedido) || {};
  var linhas = ['NF: ' + (p.numero_nf || '—') + ' | Pedido: ' + (p.numero_pedido || '—')];
  // Preferencia pelos itens da Intelipost (25/08/2026): ja vem no mesmo
  // resultado da busca, sem depender do Titan estar consultado - e ja traz o
  // EAN de verdade (cruzado por SKU no Metabase Gobeaute, ver
  // buscarEanPorSku em server.ts). So cai pro "Itens do pedido" do Titan
  // (unilogState.titan.itens) se a Intelipost nao tiver produtos.
  var produtos = (p.produtos || []);
  if (produtos.length) {
    linhas.push('Itens:');
    produtos.forEach(function(x) {
      var codigo = x.ean || x.sku || '';
      linhas.push('- ' + [codigo, x.descricao].filter(Boolean).join(' - ') + (x.quantidade ? ' (qtd ' + x.quantidade + ')' : ''));
    });
  } else {
    var itens = (unilogState.titan && unilogState.titan.itens) || [];
    if (itens.length) {
      linhas.push('Itens:');
      itens.forEach(function(it) {
        var ean = it['Ean'] || it['EAN'] || it['Código'] || it.ean || it.codigo || '';
        var desc = it['Descrição'] || it.descricao || '';
        linhas.push('- ' + [ean, desc].filter(Boolean).join(' - '));
      });
    }
  }
  linhas.push('', 'Descreva aqui o que aconteceu:');
  return linhas.join('\n');
}

// STATUS FILTER BAR
function renderStatusFilterBar(counts) {
