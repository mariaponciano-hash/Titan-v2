  'CARRIER_NOT_AUTOMATED':  'Transportadora sem automacao de endereco',
  'ADDRESS_MISSING':        'Nao veio endereco',
  'ADDRESS_UNVERIFIABLE':   'Endereco sem cidade/UF - regra nao consegue avaliar',
  'ESCALATE_TO_HUMAN':      'Creator escalou para atendimento humano',
  'MARCA_DESCONHECIDA':     'Marca nao mapeia pra nenhuma das 9 do creator',
  'COSMOS_NAO_ENVIADO':     'Pedido ainda nao saiu - seguramos',
  'SEM_FONTE_DE_STATUS':    'Sem fonte de status nesta marca - seguramos',
  'STATUS_DESCONHECIDO':    'Nao deu pra confirmar o envio - seguramos'
};
function codeEmPortugues(c) { return CODE_EM_PORTUGUES[c] || c || ''; }

// Status de entrega que vem no corpo da criacao (data.delivery_status).
var ENTREGA_EM_PORTUGUES = {
  waiting:            'Aguardando no CD',
  ready_for_shipping: 'Pronto para envio',
  imported:           'Importado, nao saiu',
  sent:               'Despachado',
  created:          'Pronto para envio',
  in_transit:       'Em transito',
  out_for_delivery: 'Saiu para entrega',
  delivered:        'Entregue',
  delivery_failed:  'Falha na entrega',
  canceled:         'Cancelado'
};
function entregaEmPortugues(s) { return ENTREGA_EM_PORTUGUES[s] || s || ''; }

function horaCurta(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

var enderecoFiltroStatus = 'todos';
var _enderecosCache = null;

// Rotulos dos DOIS vocabularios de status, que convivem nesta tela:
//  - ENDERECO_STATUS_*  = a NOSSA tentativa (coluna `status` da tabela)
//  - TICKET_STATUS_*    = o estado do ticket no cx-ticketcreator
// Eles usam palavras parecidas com sentidos diferentes de proposito separados:
// o `manual` deles significa "transportadora sem automacao, precisa de pessoa,
// nada falhou"; o nosso caso equivalente se chama `esgotado` (estourou o teto
// de tentativas). Misturar os dois na mesma coluna seria ilegivel.
var ENDERECO_STATUS_LABEL = {
  aguardando:    'Aguardando envio',
  sem_fonte_de_status: 'Sem fonte de status',
  bloqueado:     'Bloqueado pela regra',
  precisa_humano: 'Precisa de pessoa',
  disparando:    'Disparando...',
  criado:        'Ticket criado',
  ja_existia:    'Ja havia ticket',
  erro:          'Erro',
  esgotado:      'Esgotado',
  nao_se_aplica: 'Nao se aplica'
};
var ENDERECO_STATUS_COR = {
  aguardando:    ['var(--yellow-bg)', 'var(--yellow)'],
  sem_fonte_de_status: ['var(--orange-bg)', 'var(--orange)'],
  bloqueado:      ['var(--red-bg)', 'var(--red)'],
  precisa_humano: ['var(--purple-bg)', 'var(--purple)'],
  disparando:    ['var(--blue-bg)',   'var(--blue)'],
  criado:        ['var(--green-bg)',  'var(--green)'],
  ja_existia:    ['var(--cyan-bg)',   'var(--cyan)'],
  erro:          ['var(--red-bg)',    'var(--red)'],
  esgotado:      ['var(--purple-bg)', 'var(--purple)'],
  nao_se_aplica: ['var(--gray-bg)',   'var(--gray)']
};
var TICKET_STATUS_LABEL = {
  pending:    'pendente',
  processing: 'processando',
  completed:  'concluido',
  error:      'erro na transportadora',
  manual:     'precisa de pessoa (sem automacao)'
};


// Banner de saude do cron. Cobre DOIS modos de falha que antes eram invisiveis:
// o lote que roda e falha (ok:false) e o lote que parou de rodar (registro
// velho). O segundo importa porque um cron desabilitado ou apagado nao deixa
// rastro nenhum - a tela simplesmente ficaria parada parecendo saudavel.
var LOTE_ATRASO_ALERTA_MS = 3 * 60 * 60 * 1000;


// Badge do menu: quantas linhas esperam acao de pessoa (erro, esgotado,
// precisa_humano). Usa a rota de contadores, que nao devolve linha nenhuma -
// contar nao precisa trazer endereco de cliente pela rede.
async function atualizarBadgeEnderecos() {
  var el = document.getElementById('badge-enderecos');
  if (!el) return;
  try {
    var r = await fetchComTimeout('/api/enderecos-contadores?grupo=' + encodeURIComponent(CURRENT_MARCA), { headers: headersEnd() }, 12000);
    if (!r.ok) return;
    var d = await r.json();
    var n = (d && d.precisamAtencao) || 0;
    el.textContent = n > 99 ? '99+' : String(n);
    el.style.display = n > 0 ? 'inline' : 'none';
    el.title = n === 1 ? '1 linha esperando alguem' : n + ' linhas esperando alguem';
  } catch (e) {
    // Silencioso de proposito: badge que nao carrega nao pode atrapalhar o
    // resto da tela. A falha real aparece no banner dentro da aba.
  }
}

function bannerUltimoLote(ul) {
  if (!ul) {
    return '<div class="alert alert-error" style="margin-bottom:12px">'
      + '<strong>O lote nunca rodou.</strong> Nenhum registro de execução — '
      + 'o cron pode não estar configurado, ou nunca chegou a completar.</div>';
  }
  var quando = horaCurta(ul.em);
  var idadeMs = ul.em ? (Date.now() - new Date(ul.em).getTime()) : null;
  var velho = idadeMs !== null && idadeMs > LOTE_ATRASO_ALERTA_MS;

  if (ul.ok === false) {
    return '<div class="alert alert-error" style="margin-bottom:12px">'
      + '<strong>O último lote falhou</strong> (' + escEnd(quando) + '): '
      + escEnd(String(ul.erro || 'sem detalhe')) + '</div>';
  }
  var resumo = escEnd(ul.criados || 0) + ' criado(s), '
    + escEnd(ul.aindaAguardando || 0) + ' aguardando, '
    + escEnd(ul.comErro || 0) + ' com erro'
    + (ul.resgatadas ? ', ' + escEnd(ul.resgatadas) + ' resgatada(s)' : '');
  if (velho) {
    var horas = Math.floor(idadeMs / 3600000);
    return '<div class="alert alert-error" style="margin-bottom:12px">'
      + '<strong>O lote não roda há ' + horas + 'h.</strong> Último sucesso em '
      + escEnd(quando) + ' (' + resumo + '). O cron deveria rodar de hora em hora — '
      + 'vale checar se está habilitado.</div>';
  }
  return '<div class="alert alert-success" style="margin-bottom:12px">'
    + 'Último lote em ' + escEnd(quando) + ': ' + resumo
    + (ul.mock ? ' <strong>(mock: ' + escEnd(ul.mock) + ')</strong>' : '') + '</div>';
}

function enderecoPill(status) {
  var cor = ENDERECO_STATUS_COR[status] || ['var(--gray-bg)', 'var(--gray)'];
  var lbl = ENDERECO_STATUS_LABEL[status] || status || '—';
  return '<span style="background:' + cor[0] + ';color:' + cor[1] + ';font-size:10px;font-weight:700;'
    + 'padding:2px 8px;border-radius:4px;white-space:nowrap">' + escEnd(lbl) + '</span>';
}

function renderEnderecos() {
  // Sem pedir chave: este app esta atras do SSO do GoDeploy, entao quem chegou
  // aqui ja se autenticou e o worker reconhece pelo header x-godeploy-user-email
  // (ver autorizadoEnderecos em server.ts). A trigger key segue sendo enviada
  // quando existir, pra funcionar tambem em app publico.
  var mc = document.getElementById('main-content');
  mc.innerHTML = '<div id="end-topo"></div><div id="end-lista"><div class="state-box"><p>Carregando fila...</p></div></div>';
  loadEnderecos();
}

async function loadEnderecos() {
  var lista = document.getElementById('end-lista');
  try {
    // grupo=CURRENT_MARCA (03/09/2026, a pedido da Ivna): so mostra a fila da
    // marca da sessao atual - a tabela e compartilhada entre todas as marcas.
    var r = await fetchComTimeout('/api/enderecos-list?grupo=' + encodeURIComponent(CURRENT_MARCA), { headers: headersEnd() }, 20000);
    var data = await r.json();
    if (!r.ok) {
      lista.innerHTML = '<div class="alert alert-error">Erro (' + r.status + '): ' + escEnd((data && data.error) || 'falha desconhecida') + '</div>';
      return;
    }
    _enderecosCache = data;
    renderEnderecosTopo(data);
    renderEnderecosLista(data);
    // A listagem ja trouxe porStatus - atualiza o badge daqui em vez de gastar
    // outra requisicao na rota de contadores.
    var elBadge = document.getElementById('badge-enderecos');
    if (elBadge) {
      var ps = data.porStatus || {};
      var n = (ps['erro'] || 0) + (ps['esgotado'] || 0) + (ps['precisa_humano'] || 0);
      elBadge.textContent = n > 99 ? '99+' : String(n);
      elBadge.style.display = n > 0 ? 'inline' : 'none';
    }
  } catch (e) {
    lista.innerHTML = '<div class="alert alert-error">Erro de conexao: ' + escEnd((e && e.message) || e) + '</div>';
  }
}

function renderEnderecosTopo(data) {
  var el = document.getElementById('end-topo');
  if (!el) return;
  var ps = data.porStatus || {};
  var ordem = ['aguardando', 'precisa_humano', 'bloqueado', 'erro', 'esgotado', 'sem_fonte_de_status', 'disparando', 'criado', 'ja_existia', 'nao_se_aplica'];
  var chips = ordem.filter(function(s) { return ps[s]; }).map(function(s) {
    var ativo = enderecoFiltroStatus === s;
    return '<button onclick="setEnderecoFiltro(\'' + s + '\')" style="border:1px solid ' + (ativo ? 'var(--blue)' : 'var(--border-2)')
      + ';background:' + (ativo ? 'var(--blue-bg)' : 'var(--white)') + ';border-radius:16px;padding:5px 12px;cursor:pointer;'
      + 'font-family:\'Poppins\',sans-serif;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px">'
      + escEnd(ENDERECO_STATUS_LABEL[s] || s) + '<span style="font-weight:700;color:var(--ink-3)">' + ps[s] + '</span></button>';
  }).join('');
  var todos = '<button onclick="setEnderecoFiltro(\'todos\')" style="border:1px solid '
    + (enderecoFiltroStatus === 'todos' ? 'var(--blue)' : 'var(--border-2)') + ';background:'
    + (enderecoFiltroStatus === 'todos' ? 'var(--blue-bg)' : 'var(--white)') + ';border-radius:16px;padding:5px 12px;cursor:pointer;'
    + 'font-family:\'Poppins\',sans-serif;font-size:11px;font-weight:600">Todos <span style="font-weight:700;color:var(--ink-3)">'
    + (data.total || 0) + '</span></button>';

  // Aviso de mock: sem o secret do creator, "criar ticket" NAO cria nada de
  // verdade. Sem esse aviso na cara, o agente veria "Ticket criado" na tela e
  // acreditaria - o pior tipo de falha silenciosa possivel aqui.
  var avisoMock = data.temSecretCreator ? '' :
    '<div class="alert alert-error" style="margin-bottom:12px"><strong>Modo mock.</strong> '
    + 'O secret do cx-ticketcreator (TICKET_WEBHOOK_SECRET) nao esta configurado, entao nenhum ticket '
    + 'e criado de verdade - os disparos abaixo sao simulados. Configure o secret para valer.</div>';

  el.innerHTML = bannerUltimoLote(data.ultimoLote)
    + avisoMock
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'
    + todos + chips
    + '<div style="flex:1"></div>'
    + (data.temSecretCreator ? '' :
        '<select id="end-mock-cenario" class="filter-select" style="border-radius:6px;font-size:11px"'
        + ' title="Só aparece em modo mock: escolhe o desfecho simulado da criação">'
        + '<option value="sucesso">mock: sucesso</option>'
        + '<option value="nao_enviado">mock: pedido não enviado</option>'
        + '<option value="erro">mock: erro</option>'
        + '<option value="bloqueado">mock: bloqueado (Regra 1)</option>'
        + '<option value="precisa_humano">mock: precisa de pessoa</option></select>')
    + '<button class="btn-refresh" id="btn-end-processar" onclick="processarFilaEnderecos(this)">Processar fila</button>'
    + '<button class="btn-refresh" id="btn-end-reconciliar" onclick="reconciliarEnderecosUI(this)" '
    + 'title="Confere cada linha contra o cx-ticketcreator e marca divergencia">Reconciliar</button>'
    + '</div><div id="end-acao-resultado"></div>';
}

function setEnderecoFiltro(s) {
  enderecoFiltroStatus = s;
  if (_enderecosCache) { renderEnderecosTopo(_enderecosCache); renderEnderecosLista(_enderecosCache); }
}

function renderEnderecosLista(data) {
  var el = document.getElementById('end-lista');
  if (!el) return;
  var rows = (data.rows || []).filter(function(r) {
    return enderecoFiltroStatus === 'todos' || r.status === enderecoFiltroStatus;
  });
  if (!rows.length) {
    el.innerHTML = '<div class="state-box"><p>' + (data.total
      ? 'Nenhuma linha com este status.'
      : 'A fila esta vazia. O bot alimenta esta tabela quando um cliente pede troca de endereco.') + '</p></div>';
    return;
  }
  var head = '<div class="t-head" style="grid-template-columns:110px 84px 1fr 1fr 132px 104px 128px 138px 96px">'
    + '<span>Pedido</span><span>Marca</span><span>Endereco atual</span><span>Novo endereco</span>'
    + '<span>Nossa fila</span><span>Status na origem</span><span>Transportadora</span>'
    + '<span>Ticket no creator</span><span></span></div>';

  var corpo = rows.map(function(r) {
    // 'bloqueado' NAO ganha botao: a Regra 1 do creator recusou e redisparar
    // devolveria o mesmo. O que falta ali e avisar o cliente, nao tentar de novo.
    var podeCriar = r.status === 'aguardando' || r.status === 'erro'
      || r.status === 'esgotado' || r.status === 'sem_fonte_de_status'
      || r.status === 'precisa_humano';
    var ticketCel;
    if (r.ticket_id) {
      var lbl = TICKET_STATUS_LABEL[r.ticket_status] || r.ticket_status || '—';
      ticketCel = '<div style="font-size:11px"><span class="mono" style="font-weight:600">#' + escEnd(r.ticket_id) + '</span> '
        + escEnd(lbl)
        + (r.ticket_reference ? '<div class="mono" style="color:var(--ink-3);font-size:10px">ref ' + escEnd(r.ticket_reference) + '</div>' : '')
        + (r.delivery_status
            ? '<div style="font-size:10px;margin-top:2px"><span style="background:var(--cyan-bg);color:var(--cyan);'
              + 'padding:1px 5px;border-radius:3px;font-weight:600">' + escEnd(entregaEmPortugues(r.delivery_status)) + '</span>'
              // Foto do momento da abertura, nao valor vivo - o rotulo diz isso
              // pra ninguem ler como status atual do pedido.
              + (r.status_visto_em ? ' <span style="color:var(--ink-4)">na abertura</span>' : '') + '</div>'
            : '')
        + (r.tracking_code ? '<div class="mono" style="color:var(--ink-3);font-size:10px">' + escEnd(r.tracking_code) + (r.carrier ? ' - ' + escEnd(r.carrier) : '') + '</div>' : '')
        + (r.ticket_deadline ? '<div style="color:var(--ink-3);font-size:10px">prazo ' + escEnd(r.ticket_deadline) + '</div>' : '') + '</div>';
    } else {
      ticketCel = '<span style="color:var(--ink-4);font-size:11px">sem ticket</span>';
    }
    // O `code` do creator e a informacao mais util da linha quando algo nao
    // deu certo - e ele que diz se foi regra de negocio ou falha tecnica.
    var selo = r.ultimo_code
      ? '<span class="mono" style="background:var(--white);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:6px">'
        + escEnd(r.ultimo_code) + '</span>' : '';
    var motivo = r.blocked_reason
      ? ' <strong>(' + escEnd(r.blocked_reason) + ')</strong>' : '';
    // O caso 'aguardando' nao tem ultimo_erro (nao e erro), mas TEM ultimo_code.
    // Sem esta linha, o estado mais comum da fila aparece sem explicacao nenhuma.
    var infoLinha = (!r.ultimo_erro && r.ultimo_code)
      ? '<div style="grid-column:1/-1;background:var(--surface);color:var(--ink-2);border-radius:4px;'
        + 'padding:6px 9px;font-size:11px;margin-top:4px">' + escEnd(codeEmPortugues(r.ultimo_code))
        + (r.atualizado_em ? ' <span style="color:var(--ink-3)">- checado ' + escEnd(horaCurta(r.atualizado_em)) + '</span>' : '')
        + (r.proxima_tentativa_em ? ' <span style="color:var(--ink-3)">- reconsulta ' + escEnd(horaCurta(r.proxima_tentativa_em)) + '</span>' : '')
        + '</div>'
      : '';
    var erroLinha = r.ultimo_erro
      ? '<div style="grid-column:1/-1;background:' + (r.status === 'bloqueado' ? 'var(--red-bg);color:var(--red)' : r.status === 'precisa_humano' ? 'var(--purple-bg);color:var(--purple)' : 'var(--red-bg);color:var(--red)')
        + ';border-radius:4px;padding:6px 9px;font-size:11px;margin-top:4px">' + selo
        + escEnd(String(r.ultimo_erro).slice(0, 400)) + motivo + '</div>'
      : '';
    // A resposta do creator aparece na linha quando existe - e a evidencia de
    // por que ele aceitou ou recusou, e antes ela nao ia pra tela nenhuma.
    var respLinha = r.resposta_creator
      ? '<div style="grid-column:1/-1;background:var(--surface);color:var(--ink-3);border-radius:4px;'
        + 'padding:5px 9px;font-size:10px;margin-top:3px" class="mono">creator: '
        + escEnd(String(r.resposta_creator).slice(0, 300)) + '</div>'
      : '';
    if (r.ultimo_code && r.ultimo_erro) {
      selo = '<span class="mono" style="background:var(--white);border:1px solid currentColor;border-radius:3px;'
        + 'padding:0 4px;margin-right:6px" title="' + escEnd(codeEmPortugues(r.ultimo_code)) + '">'
        + escEnd(r.ultimo_code) + '</span>';
    }
    return '<div class="t-row-wrap"><div class="t-row" style="grid-template-columns:110px 84px 1fr 1fr 132px 104px 128px 138px 96px;cursor:default">'
      + '<div class="mono" style="font-size:11px;font-weight:600">' + escEnd(r.pedido) + '</div>'
      + '<div><span class="t-marca">' + escEnd(r.marca) + '</span></div>'
      + '<div style="font-size:11px;color:var(--ink-2)">' + escEnd(r.endereco_atual || '—') + '</div>'
      + '<div style="font-size:11px;font-weight:600">' + escEnd(r.novo_endereco || '—') + '</div>'
      + '<div>' + enderecoPill(r.status) + '</div>'
      + '<div style="font-size:11px">' + (r.gate_status_origem
          ? '<span style="background:var(--cyan-bg);color:var(--cyan);padding:1px 5px;border-radius:3px;font-weight:600">'
            + escEnd(entregaEmPortugues(r.gate_status_origem)) + '</span>'
            + (r.gate_fonte ? '<div style="color:var(--ink-4);font-size:10px">' + escEnd(r.gate_fonte) + '</div>' : '')
          : '<span style="color:var(--ink-4)">nao consultado</span>') + '</div>'
      + '<div style="font-size:11px">' + (r.carrier ? escEnd(r.carrier) : '<span style="color:var(--ink-4)">—</span>') + '</div>'
      + '<div>' + ticketCel + '</div>'
      + '<div>' + (podeCriar
          ? '<button class="btn-resp" style="padding:5px 9px;font-size:10px" onclick="criarTicketEnderecoManual(\''
            + escEnd(r.id) + '\',this)">' + (r.status === 'aguardando' ? 'Criar ticket' : 'Redisparar') + '</button>'
          : '') + '</div>'
      + infoLinha + erroLinha + respLinha + '</div></div>';
  }).join('');

  el.innerHTML = '<div class="ticket-table">' + head + corpo + '</div>';
}

// Cenario de mock escolhido na tela. Devolve null quando o seletor nao existe
// (modo real, com TICKET_WEBHOOK_SECRET configurado) - e null faz o backend
// usar o caminho de verdade, nao o simulado.
function cenarioMock() {
  var el = document.getElementById('end-mock-cenario');
  return el && el.value ? el.value : null;
}
function cenarioMockQS() {
  var c = cenarioMock();
  return c ? ('?mock=' + encodeURIComponent(c)) : '';
}

async function criarTicketEnderecoManual(id, btn) {
  if (!confirm('Criar o ticket de alteracao de endereco para esta linha agora?')) return;
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  var out = document.getElementById('end-acao-resultado');
  try {
    var r = await fetchComTimeout('/api/enderecos-criar-manual', {
      method: 'POST',
      headers: headersEnd({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ id: id, mock: cenarioMock() })
    }, 25000);
    var data = await r.json();
    if (!r.ok) {
      if (out) out.innerHTML = '<div class="alert alert-error">' + escEnd((data && data.error) || ('HTTP ' + r.status)) + '</div>';
    } else {
      var acao = (data.resultado && data.resultado.acao) || 'processado';
      var tipo = /criado/.test(acao) ? 'success' : 'error';
      if (out) out.innerHTML = '<div class="alert alert-' + tipo + '">' + escEnd(acao)
        + (data.resultado && data.resultado.erro ? ' — ' + escEnd(data.resultado.erro) : '') + '</div>';
    }
  } catch (e) {
    if (out) out.innerHTML = '<div class="alert alert-error">Erro de conexao: ' + escEnd((e && e.message) || e) + '</div>';
  }
  loadEnderecos();
  atualizarBadgeEnderecos();
}

async function processarFilaEnderecos(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Processando...'; }
  var out = document.getElementById('end-acao-resultado');
  try {
    var r = await fetchComTimeout('/api/enderecos-processar' + cenarioMockQS(), {
      method: 'POST', headers: headersEnd()
    }, 60000);
    var d = await r.json();
    if (!r.ok) {
      if (out) out.innerHTML = '<div class="alert alert-error">' + escEnd((d && d.error) || ('HTTP ' + r.status)) + '</div>';
    } else if (out) {
      out.innerHTML = '<div class="alert alert-success">Fila de ' + escEnd(d.fila) + ': '
        + escEnd(d.criados) + ' criado(s), ' + escEnd(d.aindaAguardando) + ' ainda aguardando envio, '
        + escEnd(d.comErro) + ' com erro.' + (d.mock ? ' <strong>(mock: ' + escEnd(d.mock) + ')</strong>' : '') + '</div>';
    }
  } catch (e) {
    if (out) out.innerHTML = '<div class="alert alert-error">Erro de conexao: ' + escEnd((e && e.message) || e) + '</div>';
  }
  loadEnderecos();
  atualizarBadgeEnderecos();
}

async function reconciliarEnderecosUI(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Conferindo...'; }
  var out = document.getElementById('end-acao-resultado');
  try {
    var r = await fetchComTimeout('/api/enderecos-reconciliar', {
      method: 'POST', headers: headersEnd()
    }, 60000);
    var d = await r.json();
    if (!r.ok) {
      if (out) out.innerHTML = '<div class="alert alert-error">' + escEnd((d && d.error) || ('HTTP ' + r.status)) + '</div>';
    } else if (out) {
      // Divergencia e o achado importante desta acao, nao um detalhe: significa
      // que a nossa tabela diz "criado" e o creator nao tem o ticket.
      var tipo = d.divergentes ? 'error' : 'success';
      out.innerHTML = '<div class="alert alert-' + tipo + '">' + escEnd(d.conferidos) + ' linha(s) conferida(s), '
        + escEnd(d.atualizados) + ' atualizada(s), <strong>' + escEnd(d.divergentes) + ' divergente(s)</strong>.'
        + (d.divergentes ? ' Divergencia costuma significar `reference` em formato que o creator nao reconhece.' : '') + '</div>';
    }
  } catch (e) {
    if (out) out.innerHTML = '<div class="alert alert-error">Erro de conexao: ' + escEnd((e && e.message) || e) + '</div>';
  }
  loadEnderecos();
}

function escapeHtml(s) {
  return (s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function regraCard(key, title, subtitle) {

    : DEFAULT_REGRAS[key];
  return '<div class="config-card" style="margin-bottom:1.25rem">' +
    '<div class="config-title">' + title + '</div>' +
    (subtitle ? '<div class="config-sub">' + subtitle + '</div>' : '') +
    '<textarea class="field-input" id="regra-' + key + '" style="min-height:180px;white-space:pre-wrap">' + escapeHtml(texto) + '</textarea>' +

// TABELA DE CLASSIFICACOES (08/08/2026, a pedido da Maria): a secao
// "Classificações e Motivos de Ticket" virou tabela editavel (categoria,
// descricao, precisa responder?, urgencia) em vez de texto livre - mais facil
// de ler e manter em dia que 8 categorias em bloco de texto. Salvo como um
// array JSON dentro do mesmo campo conteudo.classificacoes (string no banco,
// ver server.ts) - por isso classificacoesRowsAtuais() tenta fazer JSON.parse
// e, se falhar (rascunho salvo antes desta mudanca, quando o campo era texto
// livre), cai numa unica linha preservando o texto antigo pra nao perder nada.
function classificacoesRowsAtuais() {
  const salvo = window._regrasSalvo && window._regrasSalvo.conteudo ? window._regrasSalvo.conteudo.classificacoes : null;
  if (salvo) {
    try {
      const parsed = JSON.parse(salvo);
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {
      return [{ categoria: '', descricao: salvo, precisa_responder: '', urgencia: '' }];
    }
  }
  return DEFAULT_REGRAS.classificacoes.slice();
}

function coletarClassificacoesDaTabela() {
  const cards = document.querySelectorAll('#lista-classificacoes .classificacao-card');
  const out = [];
  cards.forEach(function(card) {
    const categoria = (card.querySelector('.cr-categoria').value || '').trim();
    const descricao = (card.querySelector('.cr-descricao').value || '').trim();
    const resposta_esperada = (card.querySelector('.cr-resposta-esperada').value || '').trim();
    const tempo_resposta = (card.querySelector('.cr-tempo-resposta').value || '').trim();
    const tempo_extravio = (card.querySelector('.cr-tempo-extravio').value || '').trim();
    const tratativa_dentro_prazo = (card.querySelector('.cr-tratativa-dentro').value || '').trim();
    const tratativa_fora_prazo = (card.querySelector('.cr-tratativa-fora').value || '').trim();
    if (!categoria && !descricao) return; // card em branco - descarta ao salvar
    out.push({ categoria: categoria, descricao: descricao, resposta_esperada: resposta_esperada, tempo_resposta: tempo_resposta, tempo_extravio: tempo_extravio, tratativa_dentro_prazo: tratativa_dentro_prazo, tratativa_fora_prazo: tratativa_fora_prazo });
  });
  return out;
}

async function salvarRegras() {
  const btn = document.getElementById('btn-salvar-regras');
  const alertEl = document.getElementById('regras-alert');
  const keys = ['extravio_criterio', 'prazos_sla', 'modelo_ticket', 'transportadoras_obs'];
  const conteudo = {};
  keys.forEach(function(k) {
    const el = document.getElementById('regra-' + k);
    conteudo[k] = el ? el.value : (DEFAULT_REGRAS[k] || '');
  });
  conteudo.classificacoes = JSON.stringify(coletarClassificacoesDaTabela());
  conteudo.fluxos = JSON.stringify(fluxosEstado());
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    const r = await fetchComTimeout('/api/regras-negocio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conteudo: conteudo, updatedBy: AGENT })
    }, 10000);
    if (r.ok) {
      if (alertEl) alertEl.innerHTML = '<div class="alert alert-success" style="margin-bottom:1rem">Salvo com sucesso!</div>';
      window._regrasSalvo = { conteudo: conteudo, updatedAt: new Date().toISOString(), updatedBy: AGENT };
      window._regrasSujo = false;
      setTimeout(function() { if (alertEl) alertEl.innerHTML = ''; }, 3000);
    } else {
      if (alertEl) alertEl.innerHTML = '<div class="alert alert-error" style="margin-bottom:1rem">Erro ao salvar. Tente novamente.</div>';
    }
  } catch (e) {
    console.error('[salvarRegras] erro:', e);
    if (alertEl) alertEl.innerHTML = '<div class="alert alert-error" style="margin-bottom:1rem">Erro de conexão ao salvar.</div>';
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
}

async function atualizarUltimosClassificados() {
  var el = document.getElementById('ultimos-classificados-list');
  if (!el) return;
  el.innerHTML = 'Consultando...';
  try {
    var r = await fetch('https://central-tickets.devgogroup.com/api/ultimos-classificados');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    var tickets = data.tickets || [];
    if (!tickets.length) {
      el.innerHTML = '<p style="color:var(--ink-3);font-size:12px">Nenhum ticket classificado ainda.</p>';
      return;
    }
    el.innerHTML = tickets.map(function(t) {
      var urgencia = String(t['Urgência'] || 'baixa').toLowerCase();
      var corUrgencia = urgencia === 'alta' ? 'var(--red)' : (urgencia === 'media' ? 'var(--orange)' : 'var(--ink-3)');
      var precisa = t['Precisa responder?'];
      return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
        '<span style="font-family:\'JetBrains Mono\',monospace;font-size:12px;font-weight:600;color:var(--blue)">NF ' + (t.numero_nf||'—') + '</span>' +
        '<span style="font-size:10px;color:' + corUrgencia + ';font-weight:700;text-transform:uppercase">' + urgencia + '</span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">' + (t['Motivo']||'—') + '</div>' +
        '<div style="font-size:11px;color:var(--ink-3)">' + (t.marca||'—') + ' · ' + (precisa ? 'Precisa responder' : 'Não precisa responder') + ' · ' + fmtDate(t.updated_at) + '</div>' +
        '</div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<span style="color:var(--orange);font-size:12px">Erro ao consultar: ' + String(e.message || e) + '</span>';
  }
}

async function atualizarStatusClassificacao() {
  var el = document.getElementById('classif-status');
  if (!el) return;
  el.textContent = 'Consultando...';
  try {
    var agoraDash = new Date();
    var desdeDash = new Date(agoraDash.getTime() - 45 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
    var r = await fetch('https://central-tickets.devgogroup.com/api/status-classificacao?desde=' + desdeDash + '&ate=' + agoraDash.toISOString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    if (data.pendentes === 0) {
      el.innerHTML = '<span style="color:var(--green);font-weight:600">✓ Tudo em dia — nenhum ticket pendente de classificação.</span>';
    } else {
      el.innerHTML = '<strong>' + data.pendentes + '</strong> tickets ainda sem "Ultima mensagem" registrada (período ' + data.desde + ' a ' + data.ate.split('T')[0] + '). O sistema automático processa isso sozinho, aos poucos.';
    }
  } catch(e) {
    el.innerHTML = '<span style="color:var(--orange)">Erro ao consultar status: ' + String(e.message || e) + '</span>';
  }
}

async function verificarGmailAgora() {
  var btn = document.getElementById('btn-verificar-gmail');
  var el = document.getElementById('verificar-gmail-resultado');
  if (!el) return;
  if (!TRIGGER_KEY) {
    el.innerHTML = '<div class="alert alert-error">Configure a "Chave de disparo manual" em Configurações antes de usar este botão.</div>';
    return;
  }
  if (btn) { btn.disabled = true; }
  el.innerHTML = '<div class="thread-loading">Verificando Gmail agora...</div>';
  try {
    var r = await fetchComTimeout('https://central-tickets.devgogroup.com/api/verificar-gmail', {
      method: 'POST',
      headers: { 'X-Trigger-Key': TRIGGER_KEY, 'Content-Type': 'application/json' }
    }, 30000);
    var data = await r.json();
    if (!r.ok) {
      el.innerHTML = '<div class="alert alert-error">Erro (' + r.status + '): ' + String((data && data.error) || 'falha desconhecida') + '</div>';
    } else if (data.inicializado) {
      el.innerHTML = '<div class="alert alert-success">Primeira execução: ponto de partida marcado. A partir de agora, só email novo será processado.</div>';
    } else if (data.reinicializado) {
      el.innerHTML = '<div class="alert alert-error">Histórico do Gmail expirou e foi reiniciado: ' + (data.motivo||'') + '</div>';
    } else {
      var n = data.threadsNovosDetectados || 0;
      el.innerHTML = '<div class="alert alert-success">Verificação concluída — ' + n + ' thread(s) nova(s) detectada(s) e processada(s).</div>';
    }
    atualizarStatusClassificacao();
    atualizarUltimosClassificados();
  } catch(e) {
    el.innerHTML = '<div class="alert alert-error">Erro de conexão: ' + String(e && e.message || e) + '</div>';
  }
  if (btn) { btn.disabled = false; }
}

// AUTO REFRESH — REMOVIDO (10/08/2026, a pedido da Maria)
// A Central de Tickets nao precisa mais buscar atualizacoes sozinha em nenhum
// momento - nem periodicamente, nem ao voltar pra aba do navegador. A tela so
// reflete dado novo quando a pagina e recarregada (F5) ou quando o agente
// clica manualmente em "Atualizar". O processamento de tickets novos continua
// em tempo real no BACKEND (push do Gmail + classificacao via IA, ver
// server.ts) - o dado fica correto no Supabase assim que chega; so a TELA
// que agora so reflete isso sob demanda, nao mais sozinha.
//
// autoRefreshTickets() e mantida como funcao (usada pelo botao "Atualizar" e
// pela troca manual de aba/marca via loadAndRender), so o AGENDAMENTO
// automatico dela (setInterval + gatilho de visibilitychange) foi removido.

// Funde tickets buscados incrementalmente (so os que mudaram desde a ultima
// sincronizacao) de volta em allTickets: atualiza por 'id' quem ja existia,
// adiciona quem e novo. Nao remove tickets excluidos no Supabase (caso raro
// nesta operacao - tickets nao costumam ser apagados, so reclassificados),
// e essa e a unica limitacao real de trocar recarga completa por incremental.
function mesclarTicketsIncrementais(novos) {
  if (!novos.length) return;
  var porId = Object.create(null);
  allTickets.forEach(function(t, idx) { if (t.id) porId[t.id] = idx; });
  novos.forEach(function(t) {
    if (t.id && porId[t.id] !== undefined) allTickets[porId[t.id]] = t;
    else allTickets.push(t);
  });
}

async function autoRefreshTickets() {
  if (!SB_URL || !SB_KEY) return; // ainda nao configurado
  try {
    var tabela = tabelaAtual();
    var desde = ultimaSincronizacaoPorTabela[tabela];
    // REDUCAO DE EGRESS (08/08/2026): antes, isto baixava a tabela INTEIRA de
    // novo a cada 60s pra cada agente com a aba aberta - o maior motivo do
    // estouro de cota do Supabase (369GB/250GB no ciclo). Agora busca so
    // linhas com updated_at mais novo que a ultima sincronizacao (poucas, na
    // pratica) e funde de volta em allTickets, sem re-baixar quem nao mudou.
    var data = await fetchTickets(desde || undefined);
    if (!data || data.__error) {
      console.error('[autoRefreshTickets] falhou:', data && data.__error);
      return;
    }
    if (desde) {
      mesclarTicketsIncrementais(data);
      allTickets.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
    } else {
      allTickets = data.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
    }
    atualizarUltimaSincronizacao(tabela, data);
    invalidarPedidoCountCache();
    updateBadge();
    if (currentTab === 'tickets') {
      var counts = getStatusCounts(allTickets);
      var bar = document.querySelector('.status-filter-bar');
      if (bar) bar.outerHTML = renderStatusFilterBar(counts);
      renderListAndPagination();
      if (expandedThreadId) {
        var aindaExiste = allTickets.some(function(t) { return t.thread_id === expandedThreadId; });
        var cidReaberto = 'tr-' + expandedThreadId.replace(/[^a-z0-9]/gi,'');
        var linhaVisivel = document.getElementById('trow-'+cidReaberto);
        if (aindaExiste && linhaVisivel) {
          var ticketReaberto = allTickets.find(function(t) { return t.thread_id === expandedThreadId; });
          toggleRow(cidReaberto, expandedThreadId, (ticketReaberto && ticketReaberto.remetente) || '');
        } else {
          expandedThreadId = null;
        }
      }
      var lastUpdateEl = document.getElementById('last-update');
      if (lastUpdateEl) lastUpdateEl.textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    } else if (currentTab === 'dashboard') {
      renderDashboard();
    }
  } catch(e) {
    console.error('[autoRefreshTickets] erro:', e);
  }
}

// VERIFICACAO DE VERSAO (08/08/2026): apps de pagina unica como este ficam
// abertos em aba por dias/semanas, rodando o mesmo JS carregado no dia em
// que a aba foi aberta - mesmo depois de eu publicar atualizacoes. Sem
// nenhum aviso, isso gera bugs confusos (cabecalho troca de aba mas o
// conteudo continua sendo o da aba anterior, porque a funcao nova nem
// chegou a ser carregada no navegador do agente). Este checador busca o
// HTML publicado agora mesmo (sem cache, via fetch direto) de tempos em
// tempos, compara o "app-build-id" dele com o desta pagina, e mostra uma
// faixa fixa no topo com botao "Atualizar agora" quando estao diferentes -
// nunca recarrega sozinho (evitaria perder texto que o agente esteja
// editando na aba de Regras de Negocio, por exemplo).
const APP_BUILD_ID = '2026-09-01T13-00-00';
function verificarVersaoNova() {
  fetch('/', { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(html) {
    const m = html.match(/<meta name="app-build-id" content="([^"]+)">/);
    const buildRemoto = m ? m[1] : null;
    if (buildRemoto && buildRemoto !== APP_BUILD_ID) mostrarBannerNovaVersao();
  }).catch(function(e) { console.error('[verificarVersaoNova] erro:', e); });
}
function mostrarBannerNovaVersao() {
  if (document.getElementById('banner-nova-versao')) return; // ja mostrado, nao duplica
  const banner = document.createElement('div');
  banner.id = 'banner-nova-versao';
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:500;background:var(--lime);color:var(--ink);padding:10px 16px;text-align:center;font-size:13px;font-weight:600;font-family:'Poppins',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.15)";
  banner.innerHTML = 'Uma nova versão desta página foi publicada — atualize para evitar telas desatualizadas. ' +
    '<button onclick="location.reload()" style="margin-left:10px;padding:5px 14px;border-radius:6px;border:none;background:var(--ink);color:white;font-weight:600;font-size:12px;cursor:pointer;font-family:\'Poppins\',sans-serif">Atualizar agora</button>';
  document.body.insertBefore(banner, document.body.firstChild);
}
setTimeout(verificarVersaoNova, 5000);
setInterval(verificarVersaoNova, 5 * 60 * 1000);
// Cenario adicional: o botao Voltar/Avancar do navegador pode restaurar uma
// versao INSTANTANEA da pagina direto do cache de navegacao (bfcache), sem
// executar nenhum request de rede nem religar os timers normais - o
// "evento.persisted=true" abaixo e o unico sinal confiavel disso. Sem essa
// checagem extra, voltar/avancar podia mostrar uma versao antiga da pagina
// (JS de um deploy anterior) por tempo indefinido, ate o proximo ciclo do
// setInterval (ate 5 min depois).
window.addEventListener('pageshow', function(e) { if (e.persisted) verificarVersaoNova(); });
// Mesmo aviso do guard em setTab(), mas para quando o agente fecha a aba ou
// recarrega a pagina direto (F5) em vez de trocar de aba dentro do app -
// nenhum dos dois casos passa pelo setTab().
window.addEventListener('beforeunload', function(e) {
  if (currentTab === 'regras' && window._regrasSujo) {
    e.preventDefault();
    e.returnValue = '';
  }
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
// Ao voltar pra aba do navegador (trocar de aba e voltar, ou minimizar/restaurar),
// busca os tickets de novo (autoRefreshTickets), nao so os selos de Reembolso/Reenvio -
// antes so o tratativaMap era limpo aqui, entao classificacoes novas feitas enquanto
// o agente estava em outra aba do navegador so apareciam num refresh manual.
// REMOVIDO (10/08/2026, a pedido da Maria): antes, voltar pra aba do
// navegador disparava autoRefreshTickets() automaticamente (respeitando um
// intervalo minimo de 24h). Agora a tela so atualiza por acao explicita do
// agente (F5 ou botao "Atualizar") - trocar de aba nao busca mais nada
// sozinha, mesmo que o dado no Supabase ja tenha mudado ha tempo.
// TELA INICIAL DE SELECAO DE MARCA (01/09/2026): antes o unico jeito de
// escolher Gobeaute x Gocase era o toggle no topo da sidebar, que ficava
// visivel o tempo todo mesmo pra quem so trabalha numa marca. Agora a
// escolha acontece uma vez, numa tela cheia, ANTES do resto do app
// aparecer - o toggle no sidebar foi removido; pra trocar de marca depois,
// o agente usa o link "Trocar marca" (ver trocarMarca()), que limpa a
// escolha salva e volta pra esta mesma tela.
function iniciarApp() {
  atualizarBotoesMarca();
  // REDUCAO DE EGRESS (10/08/2026, a pedido da Maria): NAO busca nada do
  // Supabase ao abrir a pagina - so renderiza o estado inicial (barra de
  // status com contadores zerados, filtros, prompt pra escolher uma aba ou
  // pesquisar). renderTickets() e seguro aqui porque so le allTickets (vazio
  // neste ponto), nunca faz fetch sozinho. A carga completa so acontece
  // quando o agente clicar numa aba de status (ver setStatusFilter) ou
  // pesquisar (ver onHeaderSearch/buscarTermoDireto).
  // A tela inicial agora e a Torre (busca por pedido, 24/08/2026, a pedido da
  // Ivna) - renderTorre() nao le allTickets nem faz fetch sozinha, so monta o
  // formulario de busca. Os ramos de status do sidebar (Aguardando
  // transportadora etc) precisam aparecer mesmo sem a fila ter sido aberta
  // ainda, entao a barra e populada aqui direto (contadores zerados, ja que
  // allTickets esta vazio neste ponto) sem tocar no resto do #main-content.
  var barInicial = document.querySelector('.status-filter-bar');
  if (barInicial) barInicial.outerHTML = renderStatusFilterBar(getStatusCounts(allTickets));
  // Badge de "Tickets a Disparar": UMA requisicao leve no boot, so a contagem.
  // Nao contraria a regra de nao buscar nada ao abrir a pagina - essa regra existe
  // pelo peso da fila de tickets (milhares de linhas com corpo de e-mail), e aqui
  // a rota devolve so numeros. Sem isso o badge nao teria como existir, porque o
  // agente precisa ver o numero SEM entrar na aba - que e o ponto dele.
  atualizarBadgeEnderecos();
  renderTorre();
}

// Clique num dos dois botoes da tela inicial - grava a escolha (persiste por
// navegador, igual o toggle antigo fazia) e so ENTAO monta o resto do app.
function escolherMarcaInicial(marca) {
  CURRENT_MARCA = marca;
  localStorage.setItem('central_marca', marca);
  var tela = document.getElementById('marca-select-screen');
  if (tela) tela.style.display = 'none';
  var shell = document.getElementById('app-shell');
  if (shell) shell.style.display = '';
  iniciarApp();
}

// Link "Trocar marca" na sidebar - limpa a escolha salva neste navegador e
// recarrega a pagina, que ai cai de novo na tela de selecao (ver o if/else
// logo abaixo, que decide qual tela mostrar no boot).
function trocarMarca() {
  localStorage.removeItem('central_marca');
  location.reload();
}

if (CURRENT_MARCA) {
  iniciarApp();
} else {
  var shellInicial = document.getElementById('app-shell');
  if (shellInicial) shellInicial.style.display = 'none';
  var telaInicial = document.getElementById('marca-select-screen');
  if (telaInicial) telaInicial.style.display = 'flex';
}

false}, {"codigo": "PAR07", "nome": "Análise concluída - importação autorizada", "descricao": "Análise concluída - importação autorizada", "ativa": false}, {"codigo": "PAR25", "nome": "Necessidade de apresentar documentação ou complementar informação", "descricao": "Necessidade de apresentar documentação ou complementar informação", "ativa": false}, {"codigo": "PCA", "nome": "Coleta Cancelada", "descricao": "Coleta Cancelada", "ativa": false}, {"codigo": "PEA", "nome": "Previsão de entrega alterada", "descricao": "A previsão de entrega da carga foi alterada.", "ativa": false}, {"codigo": "SUSP_DEST", "nome": "Solicitação de suspensão de entrega ao destinatário", "descricao": "Solicitação de suspensão de entrega ao destinatário", "ativa": false}, {"codigo": "TE1", "nome": "Primeira Tentativa de Coleta", "descricao": "Primeira Tentativa de Coleta", "ativa": false}, {"codigo": "TE2", "nome": "Segunda Tentativa de Coleta", "descricao": "Segunda Tentativa de Coleta", "ativa": false}, {"codigo": "TRA", "nome": "Coleta Transferida", "descricao": "Coleta Transferida", "ativa": false}]}]};

  // Cada macro status usa uma cor semântica diferente do próprio design system
  // da Central de Tickets (as mesmas cores usadas lá em badges de reembolso/
  // reenvio, status etc.) — 8 macro status, 8 cores, nenhuma repetida.
  const KIND_COLOR = {
    'EXTRAVIO': 'var(--red)',
    'AVARIA': 'var(--orange)',
    'DEVOLVIDO': 'var(--blue)',
    'RECUSA': 'var(--purple)',
    'ENDEREÇO NÃO LOCALIZADO': 'var(--cyan)',
    'DESTINATÁRIO AUSENTE': 'var(--yellow)',
    'RETIRADA': 'var(--lime)',
    'OUTROS': 'var(--gray)',
  };

  mount.innerHTML = '<div class="ti-wrap">' +
    '<div class="ti-toolbar">' +
    '<label class="ti-search">' +
    '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 10.3L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' +
    '<input id="ti-search-input" type="text" placeholder="Buscar status, código ou transportadora…" aria-label="Buscar">' +
    '</label>' +
    '</div>' +
    '<div class="ti-table-scroll"><table class="ti-main" id="ti-main-table"></table></div>' +
    '<div class="ti-no-results" id="ti-no-results">Nenhum resultado encontrado.</div>' +
    '</div>';

  const mainTable = mount.querySelector('#ti-main-table');
  const searchInput = mount.querySelector('#ti-search-input');
  const noResults = mount.querySelector('#ti-no-results');

  // open[macroIndex] = null (closed) | { mode: 'all' } | { mode: 'carrier', carrier: 'Dialogo' }
  const openState = {};

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>' + safe.slice(idx + q.length);
  }

  function itemMatches(it, q) {
    return it.nome.toLowerCase().includes(q) ||
      it.descricao.toLowerCase().includes(q) ||
      it.codigo.toLowerCase().includes(q);
  }

  // it.ativa já vem pronto do JSON: quando a planilha tem a coluna "Tratativa
  // CX" (Sim/Não) preenchida naquela linha, usa ela diretamente — é o dado
  // mais granular que existe. Só cai para o status geral da transportadora
  // naquele macro status quando a linha não tem essa coluna preenchida.
  function buildMicroItem(it, q) {
    const tag = it.ativa
      ? '<span class="ti-micro-tratativa-tag ativa"><span class="ti-dot"></span>Tratativa ativa</span>'
      : '<span class="ti-micro-tratativa-tag inativa"><span class="ti-dot"></span>Sem tratativa</span>';
    return '<div class="ti-micro-item">' +
      '<span class="ti-code-chip">' + esc(it.codigo) + '</span>' +
      '<div class="ti-micro-body">' +
      tag +
      '<div class="ti-micro-name">' + highlight(it.nome, q) + '</div>' +
      (it.descricao && it.descricao !== it.nome ? '<div class="ti-micro-desc">' + highlight(it.descricao, q) + '</div>' : '') +
      '</div></div>';
  }

  function buildDetailContent(m, state, ql) {
    let items, heading;
    if (state.mode === 'carrier') {
      items = (m.carriers[state.carrier] || []);
      heading = 'Microstatus — ' + esc(state.carrier);
    } else {
      items = m.allMicro;
      heading = 'Todos os microstatus';
      // Agregado por código entre transportadoras: ativa se ao menos uma
      // ocorrência daquele código (em qualquer transportadora) estiver ativa.
    }
    if (ql) items = items.filter(it => itemMatches(it, ql));
    return '<div class="ti-detail-inner">' +
      '<div class="ti-detail-heading">' + heading + '<span class="ti-count">' + items.length + '</span></div>' +
      (items.length
        ? '<div class="ti-micro-grid">' + items.map(it => buildMicroItem(it, ql)).join('') + '</div>'
        : '<div class="ti-detail-empty">Nenhum microstatus encontrado.</div>') +
      '</div>';
  }

  function buildTable(ql) {
    const theadHtml = '<thead><tr>' +
      '<th>Macrostatus</th>' +
      '<th>Disparo</th>' +
      '<th>Tratativa</th>' +
      '<th>Transportadoras</th>' +
      '</tr></thead>';

    let bodyRows = '';
    let visible = 0;

    DATA.macros.forEach((m, mi) => {
      const kindColor = KIND_COLOR[m.key] || 'var(--blue)';
      const kindStyle = '--ti-kind-color: ' + kindColor + ';';

      let matches = true;
      if (ql) {
        const macroMatch = m.key.toLowerCase().includes(ql) || m.label.toLowerCase().includes(ql);
        const carrierMatch = DATA.carrierList.some(c => c.toLowerCase().includes(ql));
        const microMatch = m.allMicro.some(it => itemMatches(it, ql));
        matches = macroMatch || carrierMatch || microMatch;
      }
      if (!matches) return;
      visible++;

      let state = openState[mi] || null;
      if (ql && !state) state = { mode: 'all' };

      const isOpen = !!state;
      const pills = DATA.carrierList.map(c => {
        const entry = m.treatByCarrier.find(t => t.carrier === c);
        const ativa = entry && entry.ativa;
        const isActivePill = state && state.mode === 'carrier' && state.carrier === c;
        return '<button type="button" class="ti-carrier-pill' + (ativa ? ' ativa' : '') + (isActivePill ? ' ti-active-pill' : '') + '" data-mi="' + mi + '" data-carrier="' + esc(c) + '">' +
          '<span class="ti-dot"></span>' + esc(c) + '</button>';
      }).join('');

      bodyRows += '<tr class="ti-macro-row' + (isOpen ? ' open' : '') + '" data-mi="' + mi + '" style="' + kindStyle + '">' +
        '<td class="ti-col-macro">' +
        '<div class="ti-macro-inner"><span class="ti-chevron ti-mode-all"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 1l6 4-6 4V1z" fill="currentColor"/></svg></span>' +
        '<span class="ti-kind-dot"></span><span class="ti-macro-label">' + esc(m.label) + '</span></div>' +
        '</td>' +
        '<td class="ti-col-disparo">' + esc(m.disparo) + '</td>' +
        '<td class="ti-col-tratativa">' + esc(m.tratativa) + '</td>' +
        '<td class="ti-col-carriers"><div class="ti-carrier-pills">' + pills + '</div></td>' +
        '</tr>' +
        '<tr class="ti-detail-row" data-mi="' + mi + '" style="display:' + (isOpen ? 'table-row' : 'none') + '">' +
        '<td colspan="4" style="' + kindStyle + '">' + (isOpen ? buildDetailContent(m, state, ql) : '') + '</td>' +
        '</tr>';
    });

    mainTable.innerHTML = theadHtml + '<tbody>' + bodyRows + '</tbody>';
    noResults.style.display = visible === 0 ? 'block' : 'none';
  }

  mainTable.addEventListener('click', e => {
    const ql = searchInput.value.trim().toLowerCase();

    const pill = e.target.closest('.ti-carrier-pill');
    if (pill) {
      const mi = pill.dataset.mi;
      const carrier = pill.dataset.carrier;
      const current = openState[mi];
      if (current && current.mode === 'carrier' && current.carrier === carrier) {
        openState[mi] = null; // toggle closed
      } else {
        openState[mi] = { mode: 'carrier', carrier: carrier };
      }
      buildTable(ql);
      return;
    }

    const row = e.target.closest('tr.ti-macro-row');
    if (row) {
      const mi = row.dataset.mi;
      const current = openState[mi];
      if (current && current.mode === 'all') {
        openState[mi] = null;
      } else {
        openState[mi] = { mode: 'all' };
      }
      buildTable(ql);
    }
  });

  searchInput.addEventListener('input', () => {
    buildTable(searchInput.value.trim().toLowerCase());
  });

  buildTable('');
}

</script>
