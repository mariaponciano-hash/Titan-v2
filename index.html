// Le o periodo escolhido nos campos De/Ate, atualiza periodoDataIni/Fim
// (persistido - nao volta pra sugestao de 30 dias sozinho depois) e busca de
// novo no Supabase bounded por esse periodo. Chamado tanto pelo botao
// "Aplicar filtro" quanto por "Atualizar" (que antes so recarregava sem
// mudar nada - agora tambem usa o periodo atual, ja que nao existe mais uma
// carga "tudo" sem periodo pra so repetir).
function aplicarFiltroPeriodo() {
  var fIni = document.getElementById('f-data-ini');
  var fFim = document.getElementById('f-data-fim');
  periodoDataIni = (fIni && fIni.value) ? fIni.value : sugestaoDataIni();
  periodoDataFim = (fFim && fFim.value) ? fFim.value : sugestaoDataFim();
  loadAndRender(currentTab, true);
}

// Busca global do cabeçalho (NF, pedido ou assunto) - substitui os 3 campos
// de texto separados que existiam antes na barra de filtros.
let headerSearchTerm = '';
let _headerSearchTimer = null;
function onHeaderSearch(value) {
  clearTimeout(_headerSearchTimer);
  _headerSearchTimer = setTimeout(function() {
    headerSearchTerm = (value||'').trim().toLowerCase();
    if (!headerSearchTerm) {
      if (!dadosCarregados) {
        // O que estava em allTickets (se algo) era so resultado parcial de
        // uma busca direcionada anterior - nao e a lista completa. Limpar a
        // busca sem ter carregado tudo volta pro estado inicial (vazio),
        // em vez de continuar mostrando aqueles poucos tickets como se
        // fossem "todos os tickets".
        allTickets = [];
        renderListAndPagination();
        return;
      }
      applyFilters();
      return;
    }
    if (!dadosCarregados) { buscarTermoDireto(headerSearchTerm); return; }
    applyFilters();
  }, 250);
}

// REDUCAO DE EGRESS (10/08/2026): busca direcionada usada quando o agente
// pesquisa sem ter carregado a tabela inteira ainda nesta sessao/marca -
// traz so os tickets que batem com o termo (NF, pedido ou assunto), direto
// do Supabase, sem baixar o resto (ver fetchTickets, parametro termoBusca).
// NAO marca dadosCarregados=true: o que fica em allTickets depois disso e
// so um recorte, nao a base completa - se o agente clicar numa aba de
// status depois, a carga completa de verdade ainda acontece normalmente
// (ver setStatusFilter), substituindo esse recorte.
async function buscarTermoDireto(termo) {
  // FIX (10/08/2026): bug real encontrado - antes esta funcao substituia
  // #main-content INTEIRO por uma caixa solta de "Buscando...", apagando os
  // elementos #list-container/#pagination-bar. Quando a busca terminava,
  // renderListAndPagination() tentava atualizar #list-container, mas ele
  // nao existia mais - a checagem "if (listEl)" fazia isso falhar em
  // silencio (sem erro no console), deixando "Buscando..." preso pra
  // sempre, mesmo com a consulta ao Supabase tendo sucesso. Agora a
  // mensagem de carregamento fica DENTRO de #list-container, preservando a
  // estrutura que renderListAndPagination() espera encontrar depois.
  document.getElementById('main-content').innerHTML =
    '<div id="list-container"><div class="state-box"><p>Buscando "' + termo.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '"...</p></div></div>' +
    '<div id="pagination-bar"></div>';
  var data = await fetchTickets(undefined, termo);
  if (!data || data.__error) {
    var msg = (data && data.__error) ? data.__error : 'Erro desconhecido ao conectar ao Supabase.';
    var lcErro = document.getElementById('list-container');
    var htmlErro = '<div class="state-box"><p>Erro ao buscar: ' + msg + '</p></div>';
    if (lcErro) lcErro.innerHTML = htmlErro; else document.getElementById('main-content').innerHTML = htmlErro;
    return;
  }
  allTickets = data.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
  // FIX (11/08/2026): mesma logica do bug corrigido em loadAndRender - isso
  // aqui e so um recorte de busca, nunca a base completa do periodo. Se
  // dadosCarregados ja estava true (agente carregou uma aba de status antes
  // de pesquisar), sem isso o setStatusFilter acharia (errado) que allTickets
  // ainda tem o periodo completo depois da busca.
  allTicketsModo = 'busca';
  invalidarPedidoCountCache();
  currentPage = 1;
  var counts = getStatusCounts(allTickets);
  var bar = document.querySelector('.status-filter-bar');
  if (bar) bar.outerHTML = renderStatusFilterBar(counts);
  // Limpa a sugestao de filtro De/Ate (30 dias) que possa ter sobrado do
  // render inicial - a busca direcionada ja traz so o que bate com o termo,
  // buscando na tabela inteira sem limite de data; deixar o filtro de data
  // ativo aqui esconderia de novo um resultado antigo que a busca acabou
  // de encontrar.
  var fIni = document.getElementById('f-data-ini');
  var fFim = document.getElementById('f-data-fim');
  if (fIni) fIni.value = '';
  if (fFim) fFim.value = '';
  renderListAndPagination();
}


// Quantos tickets ficaram de fora do resultado por ainda nao terem a
// tratativa confirmada (nao entram em nenhum dos 3 filtros de tratativa ate
// serem verificados) - exposto pra avisar o agente, atualizado a cada getFiltered().
let ultimoFiltroNaoVerificados = 0;

function getFiltered() {
  const marca = document.getElementById('f-marca') ? document.getElementById('f-marca').value : '';
  const transportadora = document.getElementById('f-transportadora') ? document.getElementById('f-transportadora').value : '';
  const us = document.getElementById('f-ultimo-status') ? document.getElementById('f-ultimo-status').value : '';
  const motivoFiltro = document.getElementById('f-motivo') ? document.getElementById('f-motivo').value : '';
  const classificacaoFiltro = document.getElementById('f-classificacao') ? document.getElementById('f-classificacao').value : '';
  const tratativaFiltro = document.getElementById('f-tratativa') ? document.getElementById('f-tratativa').value : '';
  const dataIni = document.getElementById('f-data-ini') ? document.getElementById('f-data-ini').value : '';
  const dataFim = document.getElementById('f-data-fim') ? document.getElementById('f-data-fim').value : '';
  const q = headerSearchTerm;
  // FIX (10/08/2026): "Todos" e tela de busca pura - nunca deve mostrar
  // tickets sem uma busca ativa, MESMO que allTickets ja tenha dados
  // carregados de outra aba de status visitada antes na mesma sessao. Sem
  // esse corte aqui na origem, a tela mostrava tudo que estivesse em
  // memoria (bug real: agente pesquisava, depois via a lista inteira da
  // ultima aba de status visitada, sem filtro nenhum).
  if (currentStatusFilter === 'todos' && !q) return [];
  let naoVerificadosNoFiltro = 0;
  // Um ticket candidato a "Abrir Extravio" (heuristica automatica) NAO pode
  // aparecer tambem na sua aba de status normal (ex: Aguardando transportadora) -
  // senao o mesmo ticket fica visivel em duas abas ao mesmo tempo. Por isso o
  // Set de candidatos e calculado sempre (nao so quando a aba ativa e
  // "abrir_extravio") e usado tambem para EXCLUIR esses tickets das demais
  // abas de status. Nao precisa excluir de "extravio"/"concluido" porque
  // getTicketsExtravio() ja nunca inclui tickets nesses dois status.
  const extravioIds = new Set(getTicketsExtravio().map(function(t){ return t.thread_id; }));
  const filtered = allTickets.filter(function(t) {
    if (currentStatusFilter === 'abrir_extravio') { if (!extravioIds.has(t.thread_id)) return false; }
    else if (currentStatusFilter !== 'todos') {
      if (extravioIds.has(t.thread_id)) return false;
      if (calcStatus(t) !== currentStatusFilter) return false;
    }
    if (q) {
      var nfMatch = String(t.numero_nf||'').toLowerCase().includes(q);
      var pedidoMatch = String(getPedido(t)||'').toLowerCase().includes(q);
      var assuntoMatch = String(t.subject||'').toLowerCase().includes(q);
      if (!nfMatch && !pedidoMatch && !assuntoMatch) return false;
    }
    if (marca && t.marca !== marca) return false;
    if (transportadora && getTransportadora(t) !== transportadora) return false;
    if (us && getStatus(t) !== us) return false;
    if (motivoFiltro && getMotivoCategoria(t) !== motivoFiltro) return false;
    if (classificacaoFiltro && (t.tipo_ocorrencia||'').trim() !== classificacaoFiltro) return false;
    if (tratativaFiltro) {
      var chaveTratativa = String(getPedido(t) || '').trim();
      if (tratativaMap[chaveTratativa] === undefined) {
        // Ainda nao foi possivel confirmar (fetch falhou mesmo apos o retry) -
        // NAO conta como "Vazio": fica de fora de qualquer um dos 3 filtros ate
        // ser verificado de verdade, pra nunca mostrar dado incorreto.
        naoVerificadosNoFiltro++;
        return false;
      }
      var resumo = getTratativaResumo(getPedido(t));
      if (tratativaFiltro === 'reenvio' && !(resumo && resumo.reenvio)) return false;
      if (tratativaFiltro === 'reembolso' && !(resumo && resumo.reembolso)) return false;
      if (tratativaFiltro === 'vazio' && resumo) return false;
    }
    // Filtra pela data de CRIACAO do ticket (data_email = data do primeiro email),
    // nao pela ultima movimentacao (updated_at). Ajustado em 21/07/2026 a pedido
    // da Maria: o comportamento anterior (updated_at) fazia o filtro "De/Ate"
    // mostrar/esconder tickets baseado em quando tiveram a ULTIMA mensagem, nao
    // em quando o ticket foi de fato aberto - contraintuitivo pra quem esta
    // filtrando "tickets abertos essa semana", por exemplo.
    var dataRef = t.data_email;
    if (dataIni && dataRef) { var d = dataRef.substring(0,10); if (d < dataIni) return false; }
    if (dataFim && dataRef) { var d2 = dataRef.substring(0,10); if (d2 > dataFim) return false; }
    return true;
  });
  ultimoFiltroNaoVerificados = naoVerificadosNoFiltro;
  return applySort(filtered);
}

// EXPORTACAO CSV
function csvEscape(v) {
  var s = (v === null || v === undefined) ? '' : String(v);
  s = s.replace(/\r?\n/g, ' ').trim();
  if (s.indexOf(';') !== -1 || s.indexOf('"') !== -1) {
    s = '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}
async function exportTicketsCSV() {
  const tickets = getFiltered();
  if (!tickets.length) { alert('Nenhum ticket para exportar com os filtros atuais.'); return; }
  const btn = document.getElementById('btn-export-csv');
  const btnHtmlOriginal = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Exportando...'; }
  try {
    // Garante que TODOS os tickets filtrados (nao so os 20 da pagina atual)
    // tenham o pill de Reembolso/Reenvio carregado antes de montar o CSV -
    // sem isso, a coluna saia em branco pra qualquer pedido fora da pagina
    // visivel no momento do clique.
    await garantirTratativasParaLista(tickets);
  } catch (e) {
    console.error('[exportTicketsCSV] erro ao pre-carregar tratativas:', e);
  }
  const headers = [
    'Nº Nota Fiscal', 'Chave DANFE', 'Nº Pedido Shopify', 'Classificação', 'Contato da Transportadora',
    'Transportadora', 'Marca', 'Previsão', 'Último Status Intelipost', 'Ação Realizada',
    'Reenvio ou Reembolso', 'Rastreio', 'Data do email', 'Remetente'
  ];
  const linhas = tickets.map(function(t) {
    const status = calcStatus(t);
    return [
      t.numero_nf || '—',
      t.chave_danfe || '—',
      getPedido(t),
      t.tipo_ocorrencia || '—',
      getMotivoTexto(t),
      getTransportadora(t),
      t.marca || '—',
      getPrevisaoTexto(t),
      getStatus(t),
      statusLabelTexto(status),
      getTratativaTexto(getPedido(t)),
      getRastreio(t),
      fmtDate(t.data_email),
      parseRem(t.remetente).display
    ].map(csvEscape).join(';');
  });
  const csv = '\uFEFF' + headers.map(csvEscape).join(';') + '\r\n' + linhas.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const agora = new Date();
  const ts = agora.getFullYear() + '-' + String(agora.getMonth()+1).padStart(2,'0') + '-' + String(agora.getDate()).padStart(2,'0') + '_' + String(agora.getHours()).padStart(2,'0') + String(agora.getMinutes()).padStart(2,'0');
  a.href = url;
  a.download = 'central-tickets_' + ts + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (btn) { btn.disabled = false; btn.innerHTML = btnHtmlOriginal; }
}

function applyFilters() {
  currentPage = 1;
  renderListAndPagination();
}

// O filtro de tratativa (Reenvio/Reembolso/Vazio) depende de dados que hoje so
// sao carregados sob demanda, pedido por pedido, conforme a pagina exibida
// (ver buscarPillsParaPagina) - entao pra filtrar corretamente por "Vazio" e
// preciso saber com certeza, pra TODOS os tickets (nao so os da pagina atual),
// se ja foram checados e nao tem tratativa (null) ou se ainda nem foram
// checados (undefined) - senao um pedido nunca verificado seria contado como
// "Vazio" por engano. Por isso, ao escolher uma opcao diferente de "Todas as
// tratativas", primeiro garante (via garantirTratativasParaLista, a mesma
// funcao usada na exportacao CSV) que TODOS os tickets carregados ja tem essa
// informacao resolvida, e so entao aplica o filtro.
async function onTratativaFilterChange() {
  var sel = document.getElementById('f-tratativa');
  var valor = sel ? sel.value : '';
  if (!valor) { applyFilters(); return; }
  if (sel) sel.disabled = true;
  var listEl = document.getElementById('list-container');
  if (listEl) listEl.innerHTML = '<div class="state-box"><p>Carregando tratativas de todos os tickets, isso pode levar um instante...</p></div>';
  try {
    await garantirTratativasParaLista(allTickets);
  } catch (e) {
    console.error('[onTratativaFilterChange] erro ao pre-carregar tratativas:', e);
  }
  if (sel) sel.disabled = false;
  applyFilters();
}

// PAGINACAO
// Com dezenas de milhares de tickets, montar a tabela inteira de uma vez trava
// o navegador (cada linha vira ~10 elementos DOM; 57 mil linhas = mais de meio
// milhao de nos criados numa unica innerHTML). Paginar mantem o DOM pequeno
// independente de quantos tickets existirem no total.
let currentPage = 1;
let _renderToken = 0;
const PAGE_SIZE = 20;

async function renderListAndPagination() {
  const listEl = document.getElementById('list-container');
  const pagEl = document.getElementById('pagination-bar');
  const renderToken = ++_renderToken;
  try {
    const filtered = getFiltered();
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filtered.slice(start, start + PAGE_SIZE);

    // A tabela aparece JA, com os pills de Reembolso/Reenvio que ja estiverem
    // em cache de uma visita anterior a mesma pagina. NAO espera a rede -
    // antes, um "await" aqui na frente da busca de tratativas (no segundo
    // projeto Supabase) travava a tela inteira ate aquela chamada voltar,
    // o que era o principal motivo de trocar de aba parecer lento.
    if (listEl) listEl.innerHTML = renderTableRows(pageItems);
    if (pagEl) pagEl.innerHTML = renderPagination(filtered.length, totalPages, start, pageItems.length);
    const lbl = document.getElementById('count-label');
    if (lbl) {
      lbl.textContent = filtered.length + ' tickets' + (ultimoFiltroNaoVerificados > 0 ? ' (' + ultimoFiltroNaoVerificados + ' ocultos - tratativa nao verificada, tente Atualizar)' : '');
    }

    // Garante que a tabela de tratativas foi (ou esta sendo) carregada por
    // inteiro - so faz a chamada de rede na primeira vez; nas seguintes,
    // reaproveita o resultado ja em memoria. Quando (se) terminar, atualiza
    // SO os pills de quem ainda esta na tela nesta mesma pagina/filtro - se o
    // usuario ja trocou de pagina ou de filtro nesse meio tempo (renderToken
    // mudou), a atualizacao e simplesmente descartada.
    Promise.all([buscarPillsParaPagina(pageItems), buscarRessarcimentoParaPagina(pageItems)]).then(function() {
      if (renderToken !== _renderToken) return;
      pageItems.forEach(function(t) {
        if (!t.thread_id) return;
        var cid = 'tr-' + t.thread_id.replace(/[^a-z0-9]/gi,'');
        var pillsEl = document.getElementById('pills-' + cid);
        var ressarcimentoHtml = ressarcimentoMap[t.thread_id] ? '<span class="pill-ressarcimento">Ressarcimento solicitado</span>' : '';
        if (pillsEl) pillsEl.innerHTML = tratativaPills(getPedido(t)) + ressarcimentoHtml;
        var subtabBtn = document.getElementById('subtab-btn-tratativa-' + cid);
        if (subtabBtn) {
          var resumo = getTratativaResumo(getPedido(t));
          var tratCount = resumo ? resumo.count : 0;
          subtabBtn.innerHTML = 'Tratativa Cliente' + (tratCount ? '<span class="subtab-count">' + tratCount + '</span>' : '');
        }
      });
    });
  } catch (e) {
    // Antes, um erro aqui (ou uma promise pendurada) deixava a lista em branco
    // pra sempre, sem nenhuma mensagem - so os filtros e contadores apareciam,
    // porque esses ja tinham sido desenhados antes desta funcao rodar. Agora
    // qualquer falha aparece de forma visivel, com botao pra tentar de novo.
    console.error('[renderListAndPagination] erro:', e);
    if (listEl) listEl.innerHTML = '<div class="state-box"><p>Erro ao montar a lista de tickets: ' + String((e && e.message) || e) + '</p>' +
      '<button class="btn-refresh" style="margin-top:12px" onclick="renderListAndPagination()">' +
      '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 1 0 1-2.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M1 2v2.5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Tentar novamente</button></div>';
    if (pagEl) pagEl.innerHTML = '';
  }
}

function renderPagination(total, totalPages, start, pageCount) {
  if (!total) return '';
  const from = start + 1;
  const to = start + pageCount;
  return '<div class="pagination">' +
    '<span class="pagination-info">Mostrando ' + from + '–' + to + ' de ' + total + '</span>' +
    '<div class="pagination-controls">' +
    '<button class="btn-refresh"' + (currentPage <= 1 ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage-1) + ')">Anterior</button>' +
    '<span class="pagination-page">Página ' + currentPage + ' de ' + totalPages + '</span>' +
    '<button class="btn-refresh"' + (currentPage >= totalPages ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage+1) + ')">Próxima</button>' +
    '</div></div>';
}
function goToPage(n) {
  currentPage = n;
  renderListAndPagination();
  var table = document.querySelector('.ticket-table');
  if (table) table.scrollIntoView({ behavior: 'instant', block: 'start' });
}

// varios tickets selecionados de uma vez como "Ressarcimento solicitado",

function renderBulkActionBar() {
  if (currentStatusFilter !== 'extravio') return '';

function atualizarBulkActionBar() {
  var wrap = document.getElementById('bulk-action-bar-wrap');

}

function toggleSelecaoExtravio(threadId, checked) {
  if (checked) selectedExtravioIds.add(threadId);
  else selectedExtravioIds.delete(threadId);
  atualizarBulkActionBar();
}

// "Selecionar tudo" marca TODOS os tickets do filtro atual (nao so os 20 da
// pagina visivel) - e o comportamento esperado pra uma acao em lote sobre uma
// lista que pode ter varias paginas.
function selecionarTodosExtravio(checked) {
  if (checked) {
    getFiltered().forEach(function(t) { if (t.thread_id) selectedExtravioIds.add(t.thread_id); });
  } else {
    selectedExtravioIds.clear();
  }
  atualizarBulkActionBar();
  renderListAndPagination();
}

async function marcarRessarcimentoSolicitado() {
  var ids = Array.from(selectedExtravioIds);
  if (!ids.length) return;
  if (!confirm('Marcar ' + ids.length + ' ticket(s) como "Ressarcimento solicitado" e mover para Concluído?')) return;
  var btn = document.getElementById('btn-ressarcimento-solicitado');
  if (btn) { btn.disabled = true; btn.textContent = 'Processando...'; }
  var falhas = [];
  try {
    // Persiste o novo status (Concluido) em cada ticket - mesmo caminho usado
    // pelo dropdown manual de status - antes de marcar o rotulo informativo.
    await Promise.all(ids.map(async function(threadId) {
      var t = allTickets.find(function(x) { return x.thread_id === threadId; });
      if (!t) return;
      var ok = await updateTicketStatus(t.id, 'concluido');
      if (ok) { t.Status_resposta_tickets = 'concluido'; }
      else { falhas.push(threadId); }
    }));
    // Marca "Ressarcimento solicitado" (guardado no worker, nao no Supabase -
    // ver /api/marcar-ressarcimento em server.ts) so pros que tiveram sucesso.
    var idsOk = ids.filter(function(id) { return falhas.indexOf(id) === -1; });
    if (idsOk.length) {
      var r = await fetchComTimeout('/api/marcar-ressarcimento', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_ids: idsOk })
      }, 15000);
      if (r.ok) idsOk.forEach(function(id) { ressarcimentoMap[id] = true; });
    }
  } catch (e) {
    console.error('[marcarRessarcimentoSolicitado] erro:', e);
  }
  if (falhas.length) {
    alert('Nao foi possivel atualizar ' + falhas.length + ' ticket(s). Os demais foram processados normalmente.');
  }
  selectedExtravioIds.clear();
  updateBadge();
  var counts = getStatusCounts(allTickets);
  var bar = document.querySelector('.status-filter-bar');
  if (bar) bar.outerHTML = renderStatusFilterBar(counts);
  atualizarBulkActionBar();
  // Os tickets processados nao sao mais "extravio" (agora sao "concluido"),
  // entao somem da lista visivel nessa aba assim que a lista e redesenhada.
  renderListAndPagination();
}

function renderTableRows(tickets) {
  if (!tickets.length) {
    // TELA DE BUSCA PURA (10/08/2026): "Todos" nunca mostra lista sem uma

    // navegar/rolar por tudo. Essa checagem vem ANTES da generica abaixo,

    if (currentStatusFilter === 'todos' && !headerSearchTerm) {
      return '<div class="state-box"><p>Pesquise por NF, pedido ou assunto para encontrar um ticket.</p></div>';
    }
    // REDUCAO DE EGRESS (10/08/2026): distingue "ainda nao foi carregado
    // nada nesta sessao" (dadosCarregados=false, sem busca ativa) de "foi

    if (!dadosCarregados && !headerSearchTerm) {

      : '';

    // So e montado sob demanda no primeiro clique (toggleRow -> buildExpandPanelHTML),
    // porque construir isso para toda linha da tabela de uma vez e o principal motivo
    // da tela ficar pesada quando ha muitos tickets: multiplica o numero de nos no DOM
    // por ~20x mesmo em paineis que o agente nunca abre.
    rows += '<div class="t-row-wrap">' +
      '<div class="t-row" id="trow-' + cid + '" onclick="toggleRow(\'' + cid + '\',\'' + safeAttr(t.thread_id) + '\',\'' + safeAttr(t.remetente||'') + '\')">' +
      checkboxHtml +
      '<div class="t-nf-wrap"><div class="t-nf">' + (t.numero_nf||'—') + '</div><span class="t-pills" id="pills-' + cid + '">' + pillsHtml + '</span></div>' +
      '<div class="t-pedido">' + getPedidoCell(t) + '</div>' +
      '<div class="t-status-cell">' + (t.tipo_ocorrencia||'—') + '</div>' +
      '<div class="t-subject" title="' + safeAttr(t['Motivo']||'') + '">' + getMotivoCell(t) + '</div>' +
      '<div class="t-status-cell">' + getTransportadora(t) + '</div>' +
      '<div><span class="t-marca">' + (t.marca||'—') + '</span></div>' +
      '<div>' + getPrevisao(t) + '</div>' +
      '<div class="t-status-cell">' + getStatus(t) + '</div>' +
      '<div>' + statusBadge(status) + '</div>' +
      '<div><button class="t-expand-btn" id="btn-' + cid + '">' + chevron() + '</button></div>' +

  });
  const checkboxHead = selecionavel

  return '<div class="ticket-table' + (selecionavel ? ' selecionavel' : '') + '"><div class="t-scroll"><div class="t-head">' +
    checkboxHead +
    '<span class="t-head-sort" onclick="setSort(\'numero_nf\')">Nº Nota Fiscal ' + sortArrow('numero_nf') + '</span>' +
    '<span class="t-head-sort" onclick="setSort(\'pedido\')">Nº Pedido Shopify ' + sortArrow('pedido') + '</span>' +
    '<span>Classificação</span>' +

    '<span>Transportadora</span>' +

    '<span></span></div>' + rows + '</div></div>';
}

// ORDENACAO DA TABELA (clique no cabecalho da coluna)
let currentSort = { key: 'data_email', dir: 'desc' };
function setSort(key) {
  if (currentSort.key === key) currentSort.dir = (currentSort.dir === 'asc' ? 'desc' : 'asc');
  else { currentSort.key = key; currentSort.dir = 'asc'; }
  applyFilters();
}
function sortArrow(key) {
  if (currentSort.key !== key) return '<span class="sort-arrow">↕</span>';
  return '<span class="sort-arrow active">' + (currentSort.dir === 'asc' ? '↑' : '↓') + '</span>';
}
function applySort(list) {
  var key = currentSort.key, dir = currentSort.dir === 'asc' ? 1 : -1;
  return list.slice().sort(function(a, b) {
    var va, vb;
    if (key === 'previsao') {
      // Sem previsao aplicavel vai sempre pro final, independente da direcao do sort -
      // por isso e tratado fora do comparador generico (senao o sentinel numerico
      // inverteria de posicao dependendo do dir).
      var da = getPrevisaoDiff(a), db = getPrevisaoDiff(b);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return (da - db) * dir;
    }
    if (key === 'data_email') { va = a.data_email ? new Date(a.data_email).getTime() : 0; vb = b.data_email ? new Date(b.data_email).getTime() : 0; }
    else if (key === 'numero_nf') { va = String(a.numero_nf||''); vb = String(b.numero_nf||''); }
    else if (key === 'pedido') { va = getPedido(a); vb = getPedido(b); }
    else if (key === 'marca') { va = String(a.marca||''); vb = String(b.marca||''); }
    else if (key === 'status') { va = statusLabelTexto(calcStatus(a)); vb = statusLabelTexto(calcStatus(b)); }
    else if (key === 'motivo') { va = getMotivoSortValue(a); vb = getMotivoSortValue(b); }
    else { va = ''; vb = ''; }
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

    return '<div style="font-size:12px;color:var(--ink-3);padding:.5rem 0">Nenhum reenvio ou reembolso encontrado para esta NF.</div>';
  }
  return regs.map(function(r) {

      '<div class="info-row"><span class="info-label">Valor NF tratado</span><span class="info-value">' + (r.valor_nf_tratado != null ? 'R$ ' + Number(r.valor_nf_tratado).toFixed(2).replace('.',',') : '—') + '</span></div>' +
      '<div class="info-row"><span class="info-label">No do pedido</span><span class="info-value mono">' + (r.numero_pedido||'—') + '</span></div>' +
      '<div class="info-row"><span class="info-label">Chave NF</span><span class="info-value mono" style="font-size:10px;word-break:break-all">' + (r.chave_nf||'—') + '</span></div>' +
      '</div>';
  }).join('');
}

function setSubTab(cid, tab, numeroPedido) {
  ['dados','tratativa'].forEach(function(k) {
    var btn = document.getElementById('subtab-btn-' + k + '-' + cid);
    var panel = document.getElementById('subtab-' + k + '-' + cid);
    if (btn) btn.classList.toggle('active', k === tab);
    if (panel) panel.classList.toggle('active', k === tab);
  });
  if (tab === 'tratativa') {
    var key = String(numeroPedido || '').trim();
    // Sempre confere de verdade no banco (a nao ser que ja tenha o resultado
    // em cache). Antes isso so rodava se tratativaMap[key] ja fosse verdadeiro
    // - ou seja, se o carregamento completo da tabela ainda nao tivesse
    // terminado (ou a chave nao batesse por algum motivo), o painel ficava
    // preso mostrando "Nenhum reenvio ou reembolso encontrado" sem nunca ter
    // checado de verdade. tratativaMap agora e so uma dica pro selinho/badge,
    // nunca a fonte da verdade sobre existir ou nao tratativa.
    if (key && !tratativaDetailCache[key]) {
      loadTratativaDetalhe(numeroPedido, cid);
    }
  }
}

function toggleRow(cid, threadId, remetente) {
  const panel = document.getElementById('panel-'+cid);
  const btn   = document.getElementById('btn-'+cid);
  const row   = document.getElementById('trow-'+cid);
  if (!panel) return;
  const open = panel.classList.contains('open');
  if (!open && panel.dataset.built !== '1') {
    const t = allTickets.find(function(x) { return x.thread_id === threadId; });
    if (t) {
      panel.innerHTML = buildExpandPanelHTML(t, cid);
      panel.dataset.built = '1';
    }

  panel.classList.toggle('open', !open);
  if (btn) btn.classList.toggle('open', !open);
  if (row) row.classList.toggle('expanded', !open);
  if (!open) { loadHistorico('hist-'+cid, threadId, remetente); expandedThreadId = threadId; }
  else { expandedThreadId = null; }
}

// STATUS MANUAL (dropdown no ticket expandido)
async function changeTicketStatus(ticketId, cid, newStatus, selectEl) {
  if (selectEl) selectEl.disabled = true;
  const ok = await updateTicketStatus(ticketId, newStatus);
  if (ok) {
    const t = allTickets.find(function(x) { return String(x.id) === String(ticketId); });
    if (t) t.Status_resposta_tickets = newStatus;
    updateBadge();
    const badgeEl = document.querySelector('#trow-' + cid + ' .badge');
    if (badgeEl) badgeEl.outerHTML = statusBadge(newStatus);
    const counts = getStatusCounts(allTickets);
    const bar = document.querySelector('.status-filter-bar');
    if (bar) bar.outerHTML = renderStatusFilterBar(counts);
    // Redesenha a aba Dados: se virou concluido, trava (sem dropdown/acoes daqui pra frente)
    const dadosEl = document.getElementById('subtab-dados-' + cid);
    if (dadosEl && t) dadosEl.innerHTML = buildDadosSubtabHTML(t, cid);
    // Se o filtro atual nao inclui mais este status, some da lista visivel
    if (currentStatusFilter !== 'todos' && currentStatusFilter !== newStatus) {
      const rowWrap = document.getElementById('trow-' + cid);
      if (rowWrap && rowWrap.closest('.t-row-wrap')) rowWrap.closest('.t-row-wrap').remove();
    }
  } else {
    alert('Erro ao atualizar status. Tente novamente.');
  }
  if (selectEl) selectEl.disabled = false;
}

// Atalho de "Encerrar Ticket": e so um caminho mais rapido pro mesmo status
// 'concluido' que o dropdown ja oferece - reusa changeTicketStatus pra nao
// duplicar a logica de travar o painel/atualizar badge/contagem.
function encerrarTicketDefinitivo(ticketId, cid) {
  if (!confirm('Encerrar este ticket? Depois de encerrado, nenhuma ação poderá ser feita nele.')) return;
  changeTicketStatus(ticketId, cid, 'concluido', null);
}

// Dispara o webhook n8n que busca o pedido (Shopify/Cosmos, roteado por marca)
// e envia o template de WhatsApp via Insider. Sempre confirma antes de disparar,
// porque e uma acao real com efeito no cliente (nao tem como desfazer).
function contatarCliente(threadId, btnEl) {
  const t = allTickets.find(function(x) { return x.thread_id === threadId; });
  if (!t) {
    alert('Nao foi possivel localizar os dados deste ticket. Recarregue a pagina e tente novamente.');
    return;
  }

  const numeroPedido = getPedido(t);
  if (!numeroPedido || numeroPedido === '—') {
    alert('Este ticket nao tem numero de pedido cadastrado. Nao e possivel contatar o cliente sem o pedido.');
    return;
  }

  const marca = t.marca || '';
  if (!marca) {
    alert('Este ticket nao tem marca cadastrada. Nao e possivel identificar de onde buscar os dados do cliente.');
    return;
  }

  const confirmado = confirm(
    'Tem certeza que deseja contatar o cliente do pedido ' + numeroPedido + ' (' + marca + ') via WhatsApp?\n\n' +
    'Essa acao envia uma mensagem real para o cliente agora - nao pode ser desfeita.'
  );
  if (!confirmado) return;

  const textoOriginal = btnEl ? btnEl.innerHTML : null;
  if (btnEl) {
    btnEl.disabled = true;
    btnEl.innerHTML = 'Enviando...';
  }

  fetch(WEBHOOK_CONTATAR_CLIENTE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      ticket_id: t.id,
      marca: marca,
      numero_pedido: numeroPedido
    })
  })
    .then(function(r) { return r.json().catch(function() { return {}; }); })
    .then(function(data) {
      if (data && data.success) {
        alert(data.mensagem || 'Mensagem enviada com sucesso.');
      } else {
        alert('Nao foi possivel enviar a mensagem: ' + (data && data.erro ? data.erro : 'erro desconhecido.'));
      }
    })
    .catch(function() {
      alert('Falha de conexao ao tentar contatar o cliente. Tente novamente.');
    })
    .finally(function() {
      if (btnEl) {
        btnEl.disabled = false;
        btnEl.innerHTML = textoOriginal;
      }
    });
}

// HISTORICO
async function loadHistorico(containerId, threadId, remetenteRaw) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '<div class="thread-loading">Carregando historico...</div>';

  if (!threadCache[threadId]) {
    try {
      const r = await fetch(WEBHOOK_HISTORICO, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: threadId })
      });
      if (r.ok) threadCache[threadId] = await r.json();
    } catch(e) {}
  }

  const data = threadCache[threadId];
  if (!el) return;

  if (!data || !data.mensagens || !data.mensagens.length) {
    const t = allTickets.find(function(x) { return x.thread_id === threadId; });
    let ultima = t ? getUltMsg(t) : '';
    if (!ultima && threadId) ultima = await fetchUltimaMensagemFallback(threadId);
    if (ultima) {
      el.innerHTML = msgItemHTML({ subject: (t && t.subject) || '', date: t && t.data_email, corpo: ultima }, 'fallback-'+containerId, false);
    } else {
      el.innerHTML = '<div class="thread-loading">Nenhuma mensagem encontrada.</div>';
    }
    return;
  }

  // Recalcula status do ticket com dados da thread e atualiza badge + celula de motivo
  const ticketForStatus = allTickets.find(function(x) { return x.thread_id === threadId; });
  if (ticketForStatus) {
    // Detecta resposta real a partir do historico (mesma logica usada mais abaixo pra
    // marcar cada mensagem como enviada/recebida). Se achou resposta e o Supabase ainda
    // nao sabia disso, atualiza o objeto local JA (pra badge/celula refletirem na hora)
    // e grava no banco em segundo plano - sem isso, o dado sumia a cada F5.
    var temRecebida = data.mensagens.some(function(m) {
      if (typeof m.isSent === 'boolean') return m.isSent === false;
      if (m.labelIds && Array.isArray(m.labelIds)) return m.labelIds.indexOf('SENT') === -1;
      var fromEmail = (m.from||'').toLowerCase();
      return fromEmail.indexOf('gobeaute') === -1 && fromEmail.indexOf('tickets') === -1;
    });
    if (temRecebida && ticketForStatus.tem_resposta !== true) {
      ticketForStatus.tem_resposta = true;
      persistTemResposta(threadId).then(function(ok) {
        if (!ok) console.error('[loadHistorico] falha ao persistir tem_resposta para', threadId);
      });
    }

    const cid = 'tr-' + threadId.replace(/[^a-z0-9]/gi,'');
    const newStatus = calcStatus(ticketForStatus);
    const badgeEl = document.querySelector('#trow-' + cid + ' .badge');
    if (badgeEl) badgeEl.outerHTML = statusBadge(newStatus);
    const counts = getStatusCounts(allTickets);
    const bar = document.querySelector('.status-filter-bar');
    if (bar) bar.outerHTML = renderStatusFilterBar(counts);
    // So agora (com a thread carregada) temos certeza se ha resposta de verdade;
    // se a celula da linha ainda dizia "X du sem resposta" por falta desse dado, corrige.
    const motivoEl = document.querySelector('#trow-' + cid + ' .t-subject');
    if (motivoEl) motivoEl.innerHTML = getMotivoCell(ticketForStatus);
  }

  el.innerHTML = data.mensagens.map(function(m, i) {
    var isSent;
    if (typeof m.isSent === 'boolean') {
      isSent = m.isSent;
    } else if (m.labelIds && Array.isArray(m.labelIds)) {
      isSent = m.labelIds.indexOf('SENT') !== -1;
    } else {
      var fromEmail = (m.from||'').toLowerCase();
      isSent = fromEmail.indexOf('gobeaute') !== -1 || fromEmail.indexOf('tickets') !== -1;
    }
    return msgItemHTML(m, containerId+'-'+i, isSent);
  }).join('');
}

function msgItemHTML(m, uid, isSent) {
  const dir = isSent ? 'sent' : 'received';
  const lbl = isSent ? 'Enviado' : 'Recebido';
  const d = m.date ? new Date(m.date).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
  const corpo = (m.corpo || m.snippet || '').trim();
  const subj = m.subject || '—';
  return '<div class="msg-item ' + dir + '">' +
    '<div class="msg-header" onclick="toggleMsg(\'mbody-' + uid + '\',this)">' +
    '<span class="msg-dir ' + dir + '">' + lbl + '</span>' +

    '</div>' +

// MODAL RESPONDER
// Retorna o messageId da ultima mensagem da thread (do cache), fallback para o do Supabase
function getLastMessageId(threadId, fallback) {
  var cached = threadId ? threadCache[threadId] : null;
  if (cached && cached.mensagens && cached.mensagens.length) {
    var msgs = cached.mensagens;
    var ultima = msgs[msgs.length - 1];
    // Tenta pegar o messageId da ultima mensagem
    if (ultima && ultima.messageId) return ultima.messageId;
  }
  return fallback;
}

// Armazena anexos como [{name, type, data(base64)}]
window._anexos = [];

function adicionarAnexos(input) {
  const lista = document.getElementById('anexos-list');
  Array.from(input.files).forEach(function(file) {
    const reader = new FileReader();
    reader.onload = function(e) {

      const tag = document.createElement('div');
      tag.style.cssText = 'display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);color:var(--blue);border:1px solid #c5d8f8;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:500';

        + file.name
        + '<span onclick="var p=this.parentElement;window._anexos=window._anexos.filter(function(a){return a.name!==p.dataset.anexoName});p.remove();" style="cursor:pointer;margin-left:2px;opacity:.6;font-size:13px">&times;</span>';
      lista.appendChild(tag);
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function removerAnexo(name, el) {
  window._anexos = window._anexos.filter(function(a) { return a.name !== name; });
  if (el) el.remove();
}

async function enviarResposta(threadId, messageId) {
  const para = document.getElementById('resp-para') ? document.getElementById('resp-para').value.trim() : '';
  const assunto = document.getElementById('resp-assunto') ? document.getElementById('resp-assunto').value.trim() : '';
  const msg = document.getElementById('resp-msg') ? document.getElementById('resp-msg').value.trim() : '';
  if (!para || !msg) { showAlert('Preencha o destinatario e a mensagem.', 'error'); return; }
  const btn = document.getElementById('btn-enviar');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
  const anexos = window._anexos || [];
  try {
    const r = await fetch(WEBHOOK_ENVIAR, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ para, assunto, mensagem: msg, thread_id: threadId, message_id: messageId, anexos: anexos })
    });
    if (r.ok) {
      showAlert('Email enviado! Recarregando histórico...', 'success');
      // Limpa cache e recarrega histórico após delay para o Gmail processar
      delete threadCache[threadId];
      var cidReload = 'tr-' + threadId.replace(/[^a-z0-9]/gi,'');
      setTimeout(function() {
        var histEl = document.getElementById('hist-' + cidReload);
        if (histEl) {
          histEl.innerHTML = '<div class="thread-loading">Atualizando histórico...</div>';
          loadHistorico('hist-' + cidReload, threadId, '');
        }
        closeModal();
      }, 2500);
      const t = allTickets.find(function(x) { return x.thread_id === threadId; });
      // Enviar a partir da aba "Abrir Extravio" (ou de "Extravio aberto") significa
      // que o processo de extravio esta sendo formalmente aberto com este envio -
      // o ticket deve ir direto pra "Extravio aberto", nao pra "Aguardando
      // transportadora" (que so faria ele reaparecer na lista de candidatos a
      // abrir extravio de novo, ja que a heuristica de getTicketsExtravio() olha
      // pra status 'aguardando' + atraso, nao pra 'Precisa responder?').
      var vindoDeExtravio = (currentStatusFilter === 'abrir_extravio' || currentStatusFilter === 'extravio');
      var novoStatus = vindoDeExtravio ? 'extravio' : 'aguardando';
      if (t) { t['Precisa responder?'] = false; t.tem_resposta = true; t.Status_resposta_tickets = novoStatus; }
      updateBadge();
      // Persiste o status no Supabase (igual ao dropdown manual) - sem isso, o
      // proximo fetchTickets() traria o Status_resposta_tickets antigo do banco
      // e o ticket voltaria a aparecer como candidato a abrir extravio de novo.
      if (t) {
        // t._tabelaTorre so existe em tickets injetados pela Torre de Controle
        // (ver torreRegistrarTickets); pra ticket vindo da Central e undefined
        // e updateTicketStatus cai em tabelaAtual(), como sempre foi.
        updateTicketStatus(t.id, novoStatus, t._tabelaTorre).then(function(ok) {
          if (!ok) console.error('[enviarResposta] falha ao persistir status', novoStatus, 'para ticket', t.id);
        });
      }
      // Atualiza badge da linha na tabela sem reload
      var cid = 'tr-' + threadId.replace(/[^a-z0-9]/gi,'');
      var badgeEl = document.querySelector('#trow-' + cid + ' .badge');
      if (badgeEl) badgeEl.outerHTML = statusBadge(novoStatus);
      var counts = getStatusCounts(allTickets);
      var bar = document.querySelector('.status-filter-bar');
      if (bar) bar.outerHTML = renderStatusFilterBar(counts);
      // Se o filtro atual (ex: Abrir Extravio) nao inclui mais esse status, o
      // ticket some da lista visivel agora - ele passa a aparecer em "Extravio
      // aberto". Mesmo comportamento ja usado no dropdown manual de status.
      if (currentStatusFilter !== 'todos' && currentStatusFilter !== novoStatus) {
        var rowWrap = document.getElementById('trow-' + cid);
        if (rowWrap && rowWrap.closest('.t-row-wrap')) rowWrap.closest('.t-row-wrap').remove();
      }
    } else {
      showAlert('Erro ao enviar. Verifique o webhook.', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar'; }
    }
  } catch(e) {
    showAlert('Erro de conexao.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Enviar'; }
  }
}

}

// DASHBOARD
function getDashboardFiltered() {
  var ini = document.getElementById('dash-data-ini') ? document.getElementById('dash-data-ini').value : '';
  var fim = document.getElementById('dash-data-fim') ? document.getElementById('dash-data-fim').value : '';
  return allTickets.filter(function(t) {
    if (ini && t.data_email) { var d = t.data_email.substring(0,10); if (d < ini) return false; }
    if (fim && t.data_email) { var d2 = t.data_email.substring(0,10); if (d2 > fim) return false; }
    return true;
  });
}

function renderDashboard() {
  var dashTickets = getDashboardFiltered();
  const counts = getStatusCounts(dashTickets);
  
  const porMarca = {};
  dashTickets.forEach(function(t) {
    const m = t.marca || 'Sem marca';
    porMarca[m] = (porMarca[m] || 0) + 1;
  });
  
  const porTipo = {};
  dashTickets.forEach(function(t) {
    const tp = t.tipo_ocorrencia || 'Sem tipo';
    porTipo[tp] = (porTipo[tp] || 0) + 1;
  });

  const porMotivo = {};
  dashTickets.forEach(function(t) {
    const mot = t['Motivo'] || '';
    const cat = mot ? mot.split('—')[0].trim() : 'Sem motivo';
    porMotivo[cat] = (porMotivo[cat] || 0) + 1;
  });

  const porTransp = {};
  dashTickets.forEach(function(t) {
    const rem = parseRem(t.remetente);
    const email = rem.email || 'Desconhecido';
    const dominio = email.includes('@') ? email.split('@')[1] : email;
    if (dominio && !dominio.includes('gobeaute')) {
      porTransp[dominio] = (porTransp[dominio] || 0) + 1;
    }
  });

  const sortDesc = function(obj) {
    return Object.entries(obj).sort(function(a,b){ return b[1]-a[1]; });
  };

  const marcaEntries   = sortDesc(porMarca).slice(0,10);
  const tipoEntries    = sortDesc(porTipo).slice(0,10);
  const motivoEntries  = sortDesc(porMotivo).slice(0,12);
  const transpEntries  = sortDesc(porTransp).slice(0,10);
  const total          = dashTickets.length;

  function barChart(entries, color) {
    if (!entries.length) return '<p style="color:var(--ink-3);font-size:12px">Sem dados</p>';
    const max = entries[0][1];
    return entries.map(function(e) {
      const pct = Math.round((e[1]/max)*100);
      const pctTotal = ((e[1]/total)*100).toFixed(1);
      return '<div style="margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">' +
        '<span style="color:var(--ink-2);font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%">' + e[0] + '</span>' +
        '<span style="color:var(--ink-3);margin-left:8px">' + e[1] + ' <span style="color:var(--ink-4)">(' + pctTotal + '%)</span></span>' +
        '</div>' +
        '<div style="height:8px;background:var(--surface);border-radius:4px;overflow:hidden">' +
        '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:4px;transition:width .3s"></div>' +
        '</div></div>';
    }).join('');
  }

  function donutChart(data, colors) {
    const tot = data.reduce(function(s,d){ return s+d.v; }, 0);
    if (!tot) return '';
    let cumAngle = -90;
    let paths = '';
    const cx = 80, cy = 80, r = 65, ri = 40;
    data.forEach(function(d, i) {
      const angle = (d.v / tot) * 360;
      const startA = cumAngle * Math.PI / 180;
      const endA   = (cumAngle + angle) * Math.PI / 180;
      const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
      const x2 = cx + r * Math.cos(endA),   y2 = cy + r * Math.sin(endA);
      const xi1 = cx + ri * Math.cos(startA), yi1 = cy + ri * Math.sin(startA);
      const xi2 = cx + ri * Math.cos(endA),   yi2 = cy + ri * Math.sin(endA);
      const lg = angle > 180 ? 1 : 0;
      paths += '<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+lg+' 1 '+x2+' '+y2+
               ' L'+xi2+' '+yi2+' A'+ri+' '+ri+' 0 '+lg+' 0 '+xi1+' '+yi1+' Z"' +
               ' fill="' + colors[i % colors.length] + '" stroke="white" stroke-width="2"/>';
      cumAngle += angle;
    });
    return '<svg viewBox="0 0 160 160" width="160" height="160">' + paths +
           '<text x="80" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">' + tot + '</text>' +
           '<text x="80" y="94" text-anchor="middle" font-size="10" fill="var(--ink-3)">tickets</text>' +
           '</svg>';
  }

  const statusData = [
    { label: 'Aguardando', v: counts.aguardando, color: 'var(--gray)' },
    { label: 'Tratativa CX', v: counts.pendente,   color: 'var(--orange)' },
    { label: 'Respondido', v: counts.respondido, color: 'var(--green)' },
    { label: 'Concluido',  v: counts.concluido,  color: 'var(--purple)' },
  ];
  const statusColors = ['var(--gray)','var(--orange)','var(--green)','var(--purple)'];

  function legend(data) {
    return data.map(function(d) {
      return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">' +
        '<div style="width:10px;height:10px;border-radius:50%;background:' + d.color + ';flex-shrink:0"></div>' +
        '<span style="font-size:11px;color:var(--ink-2)">' + d.label + '</span>' +
        '<span style="font-size:11px;color:var(--ink-3);margin-left:auto">' + d.v + '</span>' +
        '</div>';
    }).join('');
  }

  function card(title, content, span) {
    return '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;' + (span ? 'grid-column:span '+span : '') + '">' +
      '<div style="font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem">' + title + '</div>' +
      content + '</div>';
  }

  const kpis = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1rem">' +
    [
      { label:'Total', v: total, color:'var(--blue)' },
      { label:'Tratativa CX', v: counts.pendente, color:'var(--orange)' },
      { label:'Aguardando', v: counts.aguardando, color:'var(--gray)' },
      { label:'Concluido', v: counts.concluido, color:'var(--purple)' },
    ].map(function(k) {
      return '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;text-align:center">' +
        '<div style="font-size:28px;font-weight:700;color:' + k.color + '">' + k.v + '</div>' +
        '<div style="font-size:11px;color:var(--ink-3);margin-top:4px;font-weight:500">' + k.label + '</div>' +
        '</div>';
    }).join('') + '</div>';

  const statusCard = card('Status dos tickets',
    '<div style="display:flex;align-items:center;gap:1.5rem">' +
    donutChart(statusData, statusColors) +
    '<div style="flex:1">' + legend(statusData) + '</div></div>');

  const marcaCard   = card('Tickets por marca',   barChart(marcaEntries,  'var(--blue)'));
  const tipoCard    = card('Tickets por tipo',     barChart(tipoEntries,   'var(--green)'));
  const motivoCard  = card('Tickets por motivo',   barChart(motivoEntries, 'var(--orange)'), 2);
  const transpCard  = card('Top transportadoras',  barChart(transpEntries, 'var(--purple)'));

  var dashFilterBar = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px">' +
    '<span style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Periodo</span>' +
    '<label style="font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px">De<input class="filter-input" type="date" id="dash-data-ini" onchange="renderDashboard()" style="width:130px;padding:6px 10px"></label>' +
    '<label style="font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px">Ate<input class="filter-input" type="date" id="dash-data-fim" onchange="renderDashboard()" style="width:130px;padding:6px 10px"></label>' +
    '<button class="btn-refresh" onclick="renderDashboard()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 1 0 1-2.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M1 2v2.5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Aplicar</button>' +
    '<span style="font-size:12px;color:var(--ink-3);margin-left:auto">' + dashTickets.length + ' tickets no periodo</span>' +
    '</div>';
  // Preserve selected dates across re-renders
  var prevIni = document.getElementById('dash-data-ini') ? document.getElementById('dash-data-ini').value : '';
  var prevFim = document.getElementById('dash-data-fim') ? document.getElementById('dash-data-fim').value : '';
  document.getElementById('main-content').innerHTML =
    '<div style="padding:1.5rem;max-width:1400px;margin:0 auto">' + dashFilterBar +
    kpis +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">' +
    statusCard + transpCard + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">' +
    marcaCard + tipoCard + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">' +
    motivoCard + '</div>' +
    '</div>';
  if (prevIni) { var el = document.getElementById('dash-data-ini'); if (el) el.value = prevIni; }
  if (prevFim) { var el2 = document.getElementById('dash-data-fim'); if (el2) el2.value = prevFim; }
}

let _regrasCarregado = false;
async function renderRegras() {
  document.getElementById('main-content').innerHTML = '<div class="state-box"><p>Carregando regras de negócio...</p></div>';
  try {
    let dados = { conteudo: {}, updatedAt: null, updatedBy: null };
    try {
      const r = await fetchComTimeout('/api/regras-negocio', {}, 10000);
      if (r.ok) dados = await r.json();
    } catch (e) {
      console.error('[renderRegras] erro ao buscar regras salvas:', e);
    }
    window._regrasSalvo = dados;
    document.getElementById('main-content').innerHTML = buildRegrasHTML(dados);
    window._regrasSujo = false;
    // Delegacao de evento: qualquer digitacao em qualquer campo desta pagina
    // (textareas dos cards, categoria/descricao das linhas da tabela) marca
    // que ha alteracao pendente - usado pelo guard em setTab() e pelo aviso
    // de beforeunload mais abaixo no arquivo.
    const mcEl = document.getElementById('main-content');
    if (mcEl) mcEl.addEventListener('input', marcarRegrasSujo);
    // A lista de transportadoras ativas depende de allTickets. Se ainda nao foi
    // carregado (primeira visita direto nesta aba), busca em segundo plano sem
    // travar a exibicao da documentacao, que nao depende disso.
    if (!allTickets.length) {
      fetchTickets().then(function(data) {
        if (data && !data.__error) {
          allTickets = data;
          invalidarPedidoCountCache();
          const el = document.getElementById('regras-transportadoras-list');
          if (el) el.innerHTML = transportadorasEmailTableHTML();
        }
      }).catch(function(e) {
        console.error('[renderRegras] erro ao buscar tickets em segundo plano:', e);
      });
    }
  } catch (e) {
    // Ver comentario em setTab() sobre por que este catch existe: qualquer
    // erro aqui (ex: bug em buildRegrasHTML/classificacoesCardHTML) agora
    // aparece de forma visivel, em vez de deixar a tela anterior intocada
    // com o cabecalho ja trocado pra "Regras de Negocio".
    console.error('[renderRegras] erro fatal ao montar a pagina:', e);
    const mc = document.getElementById('main-content');
    if (mc) mc.innerHTML = '<div class="state-box"><p>Erro ao carregar Regras de Negócio: ' + String((e && e.message) || e) + '</p>' +
      '<button class="btn-refresh" style="margin-top:12px" onclick="renderRegras()">Tentar novamente</button></div>';
  }
}

// CONTATO DAS TRANSPORTADORAS (18/08/2026, atualizado com a lista real
// passada pela Ivna). Substitui o antigo mapa "transportadora -> 1 e-mail":
// agora cada transportadora tem To/Cc/Bcc (varios enderecos cada), e algumas
// tem REGRAS: so atende certos tipos de problema, ou nao tem processo
// automatizado nenhum (fica pra contato manual do agente).
//
// A Ivna passou o contato separado por marca (Gocase x "outras marcas"). A
// Torre de Controle so cobre as 7 marcas Gobeaute (ver MARCAS_LOGISTICA em
// server.ts) - NUNCA Gocase - entao so o lado "outras marcas" de cada
// transportadora esta ativo aqui. Guardei essa observacao pra quem for reaproveitar
// esses contatos numa ferramenta do lado Gocase no futuro: os enderecos de
// Gocase que a Ivna mandou ficam documentados no arquivo de memoria da sessao,
// nao aqui no codigo (nao tem uso nesta tela).
//
// CASOS ESPECIAIS:
// - Dissudes (DSD Residence): so tem processo automatizado pra "Pedido
//   Atrasado" e "Acareação" - os outros 2 problemas exigem contato manual.
// - Gollog: so tem contato cadastrado pro lado Gocase - pra Gobeaute
//   (nosso caso aqui) e sempre manual.
// - Correios: e tratado por um processo LEGADO, fora deste fluxo migrado -
//   os e-mails existem mas nao devem ser usados por aqui.
// Campos de nivel superior = padrao "outras marcas" (Gobeaute). "porMarca.gocase"
// so aparece quando o contato da Gocase realmente difere - so sobrescreve os
// campos listados ali dentro, herdando o resto (ver aplicarVariantePorMarca).

// Mistura a variante da Gocase (quando existir) por cima do padrao "outras
// marcas" - so os campos citados em porMarca.gocase mudam, o resto e herdado.
// Sem isso teriamos que repetir campo igual (ex: Magalog so muda o Bcc pra
// Gocase, o To e o mesmo dos dois lados).
function aplicarVariantePorMarca(c, marcaId) {
  var variante = marcaId === 'gocase' && c.porMarca && c.porMarca.gocase ? c.porMarca.gocase : null;
  return variante ? Object.assign({}, c, variante) : c;
}

// Remove acentos/pontuacao e uppercase, pra comparar "Diálogo Logística" (como
// vem nos tickets reais) com o alias "DIALOGO" (como a Ivna escreveu a lista)
// sem exigir que os dois batam caractere a caractere.
function normalizarNomeTransportadora(nome) {
  return String(nome || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, ' ')
    .trim();
}

function buscarContatoPadrao(nomeTransportadora, marcaId) {
  var alvo = normalizarNomeTransportadora(nomeTransportadora);
  if (!alvo) return null;
  for (var i = 0; i < TRANSPORTADORAS_CONTATO_PADRAO.length; i++) {
    var c = TRANSPORTADORAS_CONTATO_PADRAO[i];
    for (var j = 0; j < c.aliases.length; j++) {
      var a = normalizarNomeTransportadora(c.aliases[j]);
      if (alvo.indexOf(a) >= 0 || a.indexOf(alvo) >= 0) return aplicarVariantePorMarca(c, marcaId);
    }
  }
  return null;
}

// Override manual (Regras de Negocio) tem prioridade sobre o padrao - assim
// da pra corrigir um endereco sem precisar de deploy.
function transportadorasContatoMap() {
  var salvo = window._regrasSalvo && window._regrasSalvo.conteudo ? window._regrasSalvo.conteudo.transportadoras_contato : null;
  if (!salvo) return {};
  try {
    var m = JSON.parse(salvo);
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
  } catch (e) {
    return {};
  }
}

// Retorna { suportado, to, cc, bcc, motivo } pra uma transportadora + o
// problema selecionado. suportado=false significa "sem contato automatizado
// pra este caso" (nao existe override nem padrao, ou existe mas com
// restricao/legado que nao cobre este problema) - a Torre entao deixa o
// campo Para vazio e mostra o motivo, mas nao bloqueia o agente de digitar um
// e-mail manualmente.
function resolverContatoTransportadora(nomeTransportadora, problema, marcaId) {
  var overrides = transportadorasContatoMap();
  // Override manual (Regras de Negocio) nao distingue marca - se o agente
  // corrigir o contato la, vale pra Gocase e Gobeaute igual. So o padrao
  // pre-cadastrado (buscarContatoPadrao) tem variante por marca.
  var c = overrides[nomeTransportadora] || buscarContatoPadrao(nomeTransportadora, marcaId);
  if (!c) return { suportado: false, to: [], cc: [], bcc: [], motivo: 'Nenhum contato cadastrado para "' + (nomeTransportadora || 'esta transportadora') + '".' };
  if (c.legado) return { suportado: false, to: [], cc: [], bcc: [], motivo: c.motivo || 'Transportadora tratada por processo legado.' };
  if (c.semSuporte) return { suportado: false, to: [], cc: [], bcc: [], motivo: c.motivo || 'Sem contato automatizado cadastrado.' };
  if (c.restricaoProblemas && c.restricaoProblemas.indexOf(problema) === -1) {
    return { suportado: false, to: [], cc: [], bcc: [], motivo: 'Contato automatizado só disponível para: ' + c.restricaoProblemas.join(', ') + '.' };
  }
  return { suportado: true, to: c.to || [], cc: c.cc || [], bcc: c.bcc || [], motivo: '' };
}

function coletarTransportadorasEmail() {
  var porTransportadora = {};
  document.querySelectorAll('[data-transportadora][data-campo]').forEach(function(inp) {
    var tr = inp.getAttribute('data-transportadora');
    var campo = inp.getAttribute('data-campo');
    if (!porTransportadora[tr]) porTransportadora[tr] = { to: [], cc: [], bcc: [] };
    porTransportadora[tr][campo] = inp.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  });
  // So salva override pra quem REALMENTE diverge do padrao pre-cadastrado -
  // os campos ja vem preenchidos com o padrao (pra o agente ver o que sera
  // usado), entao salvar tudo "as is" congelaria o padrao atual como override
  // permanente pra toda transportadora exibida, mesmo a que ninguem tocou. Se
  // o padrao no codigo for atualizado depois (novo deploy), essas
  // transportadoras "congeladas" ignorariam a atualizacao. Comparando com
  // buscarContatoPadrao() aqui, so quem foi de fato editado vira override.
  var resultado = {};
  Object.keys(porTransportadora).forEach(function(tr) {
    var v = porTransportadora[tr];
    var vazio = !v.to.length && !v.cc.length && !v.bcc.length;
    if (vazio) return;
    var padrao = buscarContatoPadrao(tr) || { to: [], cc: [], bcc: [] };
    var igualAoPadrao = v.to.join('|') === (padrao.to || []).join('|')
      && v.cc.join('|') === (padrao.cc || []).join('|')
      && v.bcc.join('|') === (padrao.bcc || []).join('|');
    if (!igualAoPadrao) resultado[tr] = v;
  });
  return resultado;
}

// Escapa texto para uso seguro como CONTEUDO de elemento HTML (diferente de
// safeAttr, que escapa pra uso dentro de atributos com aspas simples em
// onclick inline). Usado aqui pro texto ir corretamente dentro da <textarea>,
// sem que "<", ">" ou "&" digitados pelo agente quebrem o HTML da pagina.
function escapeHtml(s) {
  return (s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function regraCard(key, title, subtitle) {

    : DEFAULT_REGRAS[key];
  return '<div class="config-card" style="margin-bottom:1.25rem">' +
    '<div class="config-title">' + title + '</div>' +
    (subtitle ? '<div class="config-sub">' + subtitle + '</div>' : '') +
    '<textarea class="field-input" id="regra-' + key + '" style="min-height:180px;white-space:pre-wrap">' + escapeHtml(texto) + '</textarea>' +
    '</div>';
}

// TABELA DE CLASSIFICACOES (08/08/2026, a pedido da Maria): a secao
// "Classificações e Motivos de Ticket" virou tabela editavel (categoria,
// descricao, precisa responder?, urgencia) em vez de texto livre - mais facil
// de ler e manter em dia que 8 categorias em bloco de texto. Salvo como um
// array JSON dentro do mesmo campo conteudo.classificacoes (string no banco,
// ver server.ts) - por isso classificacoesRowsAtuais() tenta fazer JSON.parse
// e, se falhar (rascunho salvo antes desta mudanca, quando o campo era texto
// livre), cai numa unica linha preservando o texto antigo pra nao perder nada.
function classificacoesRowsAtuais() {
  const salvo = window._regrasSalvo && window._regrasSalvo.conteudo ? window._regrasSalvo.conteudo.classificacoes : null;
  if (salvo) {
    try {
      const parsed = JSON.parse(salvo);
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {
      return [{ categoria: '', descricao: salvo, precisa_responder: '', urgencia: '' }];
    }
  }
  return DEFAULT_REGRAS.classificacoes.slice();
}

async function salvarRegras() {
  const btn = document.getElementById('btn-salvar-regras');
  const alertEl = document.getElementById('regras-alert');
  const keys = ['extravio_criterio', 'prazos_sla', 'modelo_ticket', 'transportadoras_obs'];
  const conteudo = {};
  keys.forEach(function(k) {
    const el = document.getElementById('regra-' + k);
    conteudo[k] = el ? el.value : (DEFAULT_REGRAS[k] || '');
  });
  conteudo.classificacoes = JSON.stringify(coletarClassificacoesDaTabela());
  conteudo.transportadoras_contato = JSON.stringify(coletarTransportadorasEmail());
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  try {
    const r = await fetchComTimeout('/api/regras-negocio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conteudo: conteudo, updatedBy: AGENT })
    }, 10000);
    if (r.ok) {
      if (alertEl) alertEl.innerHTML = '<div class="alert alert-success" style="margin-bottom:1rem">Salvo com sucesso!</div>';
      window._regrasSalvo = { conteudo: conteudo, updatedAt: new Date().toISOString(), updatedBy: AGENT };
      window._regrasSujo = false;
      setTimeout(function() { if (alertEl) alertEl.innerHTML = ''; }, 3000);
    } else {
      if (alertEl) alertEl.innerHTML = '<div class="alert alert-error" style="margin-bottom:1rem">Erro ao salvar. Tente novamente.</div>';
    }
  } catch (e) {
    console.error('[salvarRegras] erro:', e);
    if (alertEl) alertEl.innerHTML = '<div class="alert alert-error" style="margin-bottom:1rem">Erro de conexão ao salvar.</div>';
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Salvar alterações'; }
}

async function atualizarUltimosClassificados() {
  var el = document.getElementById('ultimos-classificados-list');
  if (!el) return;
  el.innerHTML = 'Consultando...';
  try {
    var r = await fetch('https://central-tickets.devgogroup.com/api/ultimos-classificados');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    var tickets = data.tickets || [];
    if (!tickets.length) {
      el.innerHTML = '<p style="color:var(--ink-3);font-size:12px">Nenhum ticket classificado ainda.</p>';
      return;
    }
    el.innerHTML = tickets.map(function(t) {
      var urgencia = String(t['Urgência'] || 'baixa').toLowerCase();
      var corUrgencia = urgencia === 'alta' ? 'var(--red)' : (urgencia === 'media' ? 'var(--orange)' : 'var(--ink-3)');
      var precisa = t['Precisa responder?'];
      return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
        '<span style="font-family:\'JetBrains Mono\',monospace;font-size:12px;font-weight:600;color:var(--blue)">NF ' + (t.numero_nf||'—') + '</span>' +
        '<span style="font-size:10px;color:' + corUrgencia + ';font-weight:700;text-transform:uppercase">' + urgencia + '</span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">' + (t['Motivo']||'—') + '</div>' +
        '<div style="font-size:11px;color:var(--ink-3)">' + (t.marca||'—') + ' · ' + (precisa ? 'Precisa responder' : 'Não precisa responder') + ' · ' + fmtDate(t.updated_at) + '</div>' +
        '</div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<span style="color:var(--orange);font-size:12px">Erro ao consultar: ' + String(e.message || e) + '</span>';
  }
}

async function atualizarStatusClassificacao() {
  var el = document.getElementById('classif-status');
  if (!el) return;
  el.textContent = 'Consultando...';
  try {
    var agoraDash = new Date();
    var desdeDash = new Date(agoraDash.getTime() - 45 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
    var r = await fetch('https://central-tickets.devgogroup.com/api/status-classificacao?desde=' + desdeDash + '&ate=' + agoraDash.toISOString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    if (data.pendentes === 0) {
      el.innerHTML = '<span style="color:var(--green);font-weight:600">✓ Tudo em dia — nenhum ticket pendente de classificação.</span>';
    } else {
      el.innerHTML = '<strong>' + data.pendentes + '</strong> tickets ainda sem "Ultima mensagem" registrada (período ' + data.desde + ' a ' + data.ate.split('T')[0] + '). O sistema automático processa isso sozinho, aos poucos.';
    }
  } catch(e) {
    el.innerHTML = '<span style="color:var(--orange)">Erro ao consultar status: ' + String(e.message || e) + '</span>';
  }
}

async function verificarGmailAgora() {
  var btn = document.getElementById('btn-verificar-gmail');
  var el = document.getElementById('verificar-gmail-resultado');
  if (!el) return;
  if (!TRIGGER_KEY) {
    el.innerHTML = '<div class="alert alert-error">Configure a "Chave de disparo manual" em Configurações antes de usar este botão.</div>';
    return;
  }
  if (btn) { btn.disabled = true; }
  el.innerHTML = '<div class="thread-loading">Verificando Gmail agora...</div>';
  try {
    var r = await fetchComTimeout('https://central-tickets.devgogroup.com/api/verificar-gmail', {
      method: 'POST',
      headers: { 'X-Trigger-Key': TRIGGER_KEY, 'Content-Type': 'application/json' }
    }, 30000);
    var data = await r.json();
    if (!r.ok) {
      el.innerHTML = '<div class="alert alert-error">Erro (' + r.status + '): ' + String((data && data.error) || 'falha desconhecida') + '</div>';
    } else if (data.inicializado) {
      el.innerHTML = '<div class="alert alert-success">Primeira execução: ponto de partida marcado. A partir de agora, só email novo será processado.</div>';
    } else if (data.reinicializado) {
      el.innerHTML = '<div class="alert alert-error">Histórico do Gmail expirou e foi reiniciado: ' + (data.motivo||'') + '</div>';
    } else {
      var n = data.threadsNovosDetectados || 0;
      el.innerHTML = '<div class="alert alert-success">Verificação concluída — ' + n + ' thread(s) nova(s) detectada(s) e processada(s).</div>';
    }
    atualizarStatusClassificacao();
    atualizarUltimosClassificados();
  } catch(e) {
    el.innerHTML = '<div class="alert alert-error">Erro de conexão: ' + String(e && e.message || e) + '</div>';
  }
  if (btn) { btn.disabled = false; }
}

function saveConfig() {

// AUTO REFRESH — REMOVIDO (10/08/2026, a pedido da Maria)
// A Central de Tickets nao precisa mais buscar atualizacoes sozinha em nenhum
// momento - nem periodicamente, nem ao voltar pra aba do navegador. A tela so
// reflete dado novo quando a pagina e recarregada (F5) ou quando o agente
// clica manualmente em "Atualizar". O processamento de tickets novos continua
// em tempo real no BACKEND (push do Gmail + classificacao via IA, ver
// server.ts) - o dado fica correto no Supabase assim que chega; so a TELA
// que agora so reflete isso sob demanda, nao mais sozinha.
//
// autoRefreshTickets() e mantida como funcao (usada pelo botao "Atualizar" e
// pela troca manual de aba/marca via loadAndRender), so o AGENDAMENTO
// automatico dela (setInterval + gatilho de visibilitychange) foi removido.

// Funde tickets buscados incrementalmente (so os que mudaram desde a ultima
// sincronizacao) de volta em allTickets: atualiza por 'id' quem ja existia,
// adiciona quem e novo. Nao remove tickets excluidos no Supabase (caso raro
// nesta operacao - tickets nao costumam ser apagados, so reclassificados),
// e essa e a unica limitacao real de trocar recarga completa por incremental.
function mesclarTicketsIncrementais(novos) {
  if (!novos.length) return;
  var porId = Object.create(null);
  allTickets.forEach(function(t, idx) { if (t.id) porId[t.id] = idx; });
  novos.forEach(function(t) {
    if (t.id && porId[t.id] !== undefined) allTickets[porId[t.id]] = t;
    else allTickets.push(t);
  });
}

async function autoRefreshTickets() {
  if (!SB_URL || !SB_KEY) return; // ainda nao configurado
  try {
    var tabela = tabelaAtual();
    var desde = ultimaSincronizacaoPorTabela[tabela];
    // REDUCAO DE EGRESS (08/08/2026): antes, isto baixava a tabela INTEIRA de
    // novo a cada 60s pra cada agente com a aba aberta - o maior motivo do
    // estouro de cota do Supabase (369GB/250GB no ciclo). Agora busca so
    // linhas com updated_at mais novo que a ultima sincronizacao (poucas, na
    // pratica) e funde de volta em allTickets, sem re-baixar quem nao mudou.
    var data = await fetchTickets(desde || undefined);
    if (!data || data.__error) {
      console.error('[autoRefreshTickets] falhou:', data && data.__error);
      return;
    }
    if (desde) {
      mesclarTicketsIncrementais(data);
      allTickets.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
    } else {
      allTickets = data.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
    }
    atualizarUltimaSincronizacao(tabela, data);
    invalidarPedidoCountCache();
    updateBadge();
    if (currentTab === 'tickets') {
      var counts = getStatusCounts(allTickets);
      var bar = document.querySelector('.status-filter-bar');
      if (bar) bar.outerHTML = renderStatusFilterBar(counts);
      renderListAndPagination();
      if (expandedThreadId) {
        var aindaExiste = allTickets.some(function(t) { return t.thread_id === expandedThreadId; });
        var cidReaberto = 'tr-' + expandedThreadId.replace(/[^a-z0-9]/gi,'');
        var linhaVisivel = document.getElementById('trow-'+cidReaberto);
        if (aindaExiste && linhaVisivel) {
          var ticketReaberto = allTickets.find(function(t) { return t.thread_id === expandedThreadId; });
          toggleRow(cidReaberto, expandedThreadId, (ticketReaberto && ticketReaberto.remetente) || '');
        } else {
          expandedThreadId = null;
        }
      }
      var lastUpdateEl = document.getElementById('last-update');
      if (lastUpdateEl) lastUpdateEl.textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    } else if (currentTab === 'dashboard') {
      renderDashboard();
    }
  } catch(e) {
    console.error('[autoRefreshTickets] erro:', e);
  }
}

// BOOT
// VERIFICACAO DE VERSAO (08/08/2026): apps de pagina unica como este ficam
// abertos em aba por dias/semanas, rodando o mesmo JS carregado no dia em
// que a aba foi aberta - mesmo depois de eu publicar atualizacoes. Sem
// nenhum aviso, isso gera bugs confusos (cabecalho troca de aba mas o
// conteudo continua sendo o da aba anterior, porque a funcao nova nem
// chegou a ser carregada no navegador do agente). Este checador busca o
// HTML publicado agora mesmo (sem cache, via fetch direto) de tempos em
// tempos, compara o "app-build-id" dele com o desta pagina, e mostra uma
// faixa fixa no topo com botao "Atualizar agora" quando estao diferentes -
// nunca recarrega sozinho (evitaria perder texto que o agente esteja
// editando na aba de Regras de Negocio, por exemplo).
const APP_BUILD_ID = '2026-08-24T14-00-00';
function verificarVersaoNova() {
  fetch('/', { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(html) {
    const m = html.match(/<meta name="app-build-id" content="([^"]+)">/);
    const buildRemoto = m ? m[1] : null;
    if (buildRemoto && buildRemoto !== APP_BUILD_ID) mostrarBannerNovaVersao();
  }).catch(function(e) { console.error('[verificarVersaoNova] erro:', e); });
}
function mostrarBannerNovaVersao() {
  if (document.getElementById('banner-nova-versao')) return; // ja mostrado, nao duplica
  const banner = document.createElement('div');
  banner.id = 'banner-nova-versao';
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:500;background:var(--lime);color:var(--ink);padding:10px 16px;text-align:center;font-size:13px;font-weight:600;font-family:'Poppins',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.15)";
  banner.innerHTML = 'Uma nova versão desta página foi publicada — atualize para evitar telas desatualizadas. ' +
    '<button onclick="location.reload()" style="margin-left:10px;padding:5px 14px;border-radius:6px;border:none;background:var(--ink);color:white;font-weight:600;font-size:12px;cursor:pointer;font-family:\'Poppins\',sans-serif">Atualizar agora</button>';
  document.body.insertBefore(banner, document.body.firstChild);
}
setTimeout(verificarVersaoNova, 5000);
setInterval(verificarVersaoNova, 5 * 60 * 1000);
// Cenario adicional: o botao Voltar/Avancar do navegador pode restaurar uma
// versao INSTANTANEA da pagina direto do cache de navegacao (bfcache), sem
// executar nenhum request de rede nem religar os timers normais - o
// "evento.persisted=true" abaixo e o unico sinal confiavel disso. Sem essa
// checagem extra, voltar/avancar podia mostrar uma versao antiga da pagina
// (JS de um deploy anterior) por tempo indefinido, ate o proximo ciclo do
// setInterval (ate 5 min depois).
window.addEventListener('pageshow', function(e) { if (e.persisted) verificarVersaoNova(); });
// Mesmo aviso do guard em setTab(), mas para quando o agente fecha a aba ou
// recarrega a pagina direto (F5) em vez de trocar de aba dentro do app -
// nenhum dos dois casos passa pelo setTab().
window.addEventListener('beforeunload', function(e) {
  if (currentTab === 'regras' && window._regrasSujo) {
    e.preventDefault();
    e.returnValue = '';
  }
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
// Ao voltar pra aba do navegador (trocar de aba e voltar, ou minimizar/restaurar),
// busca os tickets de novo (autoRefreshTickets), nao so os selos de Reembolso/Reenvio -
// antes so o tratativaMap era limpo aqui, entao classificacoes novas feitas enquanto
// o agente estava em outra aba do navegador so apareciam num refresh manual.
// REMOVIDO (10/08/2026, a pedido da Maria): antes, voltar pra aba do
// navegador disparava autoRefreshTickets() automaticamente (respeitando um
// intervalo minimo de 24h). Agora a tela so atualiza por acao explicita do
// agente (F5 ou botao "Atualizar") - trocar de aba nao busca mais nada
// sozinha, mesmo que o dado no Supabase ja tenha mudado ha tempo.
atualizarBotoesMarca();
// REDUCAO DE EGRESS (10/08/2026, a pedido da Maria): NAO busca nada do
// Supabase ao abrir a pagina. A tela inicial agora e a Torre (busca por
// pedido, 24/08/2026) - renderTorre() nao le allTickets nem faz fetch
// sozinha, so monta o formulario de busca. Os ramos de status do sidebar
// (Aguardando transportadora etc) precisam aparecer mesmo sem a fila ter
// sido aberta ainda, entao a barra e populada aqui direto (com contadores
// zerados, ja que allTickets esta vazio neste ponto) sem tocar no
// #main-content. A carga completa da fila so acontece quando o agente
// clicar num desses ramos (ver setStatusFilter) ou pesquisar dentro dela.
var barInicial = document.querySelector('.status-filter-bar');
if (barInicial) barInicial.outerHTML = renderStatusFilterBar(getStatusCounts(allTickets));
renderTorre();
</script>
