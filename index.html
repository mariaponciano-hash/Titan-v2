<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== TORRE DE CONTROLE LOGISTICA (17/08/2026) ===== */
/* #main-content e flex item de .app-main (flex column, align stretch). Com a
   tabela da timeline dentro, a largura dele era resolvida pelo min-content
   dos filhos (790px) em vez da largura do pai - e a PAGINA INTEIRA ganhava
   rolagem horizontal. min-width:0 sozinho NAO resolve. max-width:100% tambem
   NAO e confiavel: em telas largas ele prendeu o item a uma largura MENOR que
   a do pai (medido: pai com 1192px, item ficou com 767px), estreitando a
   barra de busca sem necessidade (feedback da Ivna, 17/08/2026, ao ver o
   campo de busca mais estreito do que devia). width:100% e exato - trava o
   item EXATAMENTE na largura do pai, nem mais nem menos, o que resolve o
   overflow (pai nao cresce por causa da timeline) sem encolher artificialmente
   em telas largas. Escopo so na Torre (classe posta por renderTorre e
   retirada por setTab), pra nao mexer na lista ja consolidada da Central. Com
   isso quem rola na horizontal e so a tabela, via .tl-scroll. */
#main-content.torre-ativo{width:100%;min-width:0}
.torre-search-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.torre-search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Continua tudo numa linha so (like a Ivna pediu), mas o campo tem min-width
   maior e o dropdown de marca (#torre-marca, abaixo) tem largura travada -
   antes o campo so herdava o espaco que sobrava do select+botao, e como o
   select nao tinha limite ficava largo demais, cortando o texto do campo de
   busca (feedback da Ivna, 17/08/2026). */
.torre-search-field{flex:2 1 320px;min-width:280px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border-2);border-radius:24px;padding:11px 18px;transition:all .15s}
#torre-marca{flex:0 0 auto;width:230px}
.torre-search-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);background:var(--white)}
.torre-search-field input{border:none;background:none;outline:none;font-size:14px;font-family:'Poppins',sans-serif;color:var(--ink);width:100%}
.torre-clear-btn{flex:0 0 auto;border:none;background:none;color:var(--muted,#8a8f98);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:50%}
.torre-clear-btn:hover{color:var(--ink);background:var(--border-2)}
.torre-btn{padding:11px 22px;border-radius:24px;border:none;background:var(--blue);color:var(--white);font-size:13px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.torre-btn:hover{background:#1d4680}
.torre-btn:disabled{opacity:.55;cursor:not-allowed}
.torre-btn-ghost{background:var(--white);color:var(--ink-2);border:1px solid var(--border-2)}
.torre-btn-ghost:hover{background:var(--surface);color:var(--ink);border-color:var(--blue)}
.torre-hint{font-size:11px;color:var(--ink-3);margin-top:9px}
/* --- Cards de saude logistica (KPIs) --- */
/* minmax(0,...) em vez de 1fr: com "1fr" puro a coluna nunca encolhe abaixo do
   min-content do card, e um nome longo de transportadora/status empurrava a
   pagina inteira pra fora, criando rolagem horizontal. */
.torre-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:1.25rem}
.torre-kpis.torre-kpis-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;min-width:0}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border-2)}
.kpi-card.kpi-hero{padding:1.15rem 1.25rem}
.kpi-card.is-late::before{background:var(--red)}
.kpi-card.is-ontime::before{background:var(--green)}
.kpi-card.is-neutral::before{background:var(--ink-4)}
.kpi-card.is-late{background:var(--red-bg);border-color:#F5C4BA}
.kpi-card.is-ontime{background:var(--green-bg);border-color:#BFE3CE}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.kpi-value{font-size:28px;font-weight:700;line-height:1.15;color:var(--ink)}
.kpi-card.kpi-hero .kpi-value{font-size:38px}
.kpi-card.is-late .kpi-value{color:var(--red)}
.kpi-card.is-ontime .kpi-value{color:var(--green)}
.kpi-card.is-ontime .kpi-value-sm{color:var(--green)}
.kpi-sub{font-size:11px;color:var(--ink-3);line-height:1.45}
.kpi-value-sm{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;overflow-wrap:anywhere;min-width:0}
/* --- Checklist de status (Titan ate Embarcado + Intelipost ate Entregue) --- */
.torre-status-checklist{display:flex;align-items:flex-start;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.4rem;margin-bottom:1.25rem;overflow-x:auto}
.tsc-step{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:104px;flex-shrink:0}
.tsc-dot{width:24px;height:24px;border-radius:50%;background:var(--white);border:2px solid var(--ink-4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tsc-step.tsc-done .tsc-dot{background:var(--green);border-color:var(--green)}
.tsc-step.tsc-loading .tsc-dot{border-color:var(--blue);animation:tsc-pulse 1.1s ease-in-out infinite}
.tsc-label{font-size:11px;font-weight:700;color:var(--ink);margin-top:7px;line-height:1.25}
.tsc-step.tsc-pending .tsc-label,.tsc-step.tsc-loading .tsc-label{color:var(--ink-3);font-weight:600}
.tsc-sub{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.tsc-corrigido{color:var(--blue);cursor:help}
.tsc-line{flex:1;height:2px;background:var(--border-2);margin-top:11px;min-width:16px}
.tsc-line.tsc-line-done{background:var(--green)}
@keyframes tsc-pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* --- Blocos padrao Intelipost --- */
.torre-blocos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:1.25rem}
@media(max-width:1150px){.torre-blocos{grid-template-columns:minmax(0,1fr)}}
.bloco{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;min-width:0}
.bloco-head{display:flex;align-items:center;gap:8px;padding:.8rem 1.1rem;border-bottom:1px solid var(--border);background:var(--surface)}
.bloco-head svg{color:var(--blue);flex-shrink:0}
.bloco-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.bloco-body{padding:.9rem 1.1rem}
.bloco-row{display:flex;gap:12px;padding:5px 0;font-size:12.5px;align-items:flex-start}
.bloco-row+.bloco-row{border-top:1px solid #F2F2EF}
.bloco-k{color:var(--ink-3);min-width:132px;flex-shrink:0}
.bloco-v{color:var(--ink);font-weight:500;overflow-wrap:anywhere;flex:1;min-width:0}
.bloco-v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
/* --- Timeline --- */
.torre-timeline{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.25rem;min-width:0}
/* overflow nos DOIS eixos e explicito: a tabela da timeline tem colunas com
   nowrap (data, status, fonte) e min-content grande. Sem isso ela empurrava
   #main-content (que e flex item com min-width:auto) pra 790px e a PAGINA
   INTEIRA ganhava rolagem horizontal. Agora quem rola e so a tabela. */
.tl-scroll{max-height:420px;overflow:auto;min-width:0}
.tl-table{width:100%;border-collapse:collapse;font-size:12.5px}
.tl-table th{position:sticky;top:0;background:var(--surface);text-align:left;padding:.6rem 1rem;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--border);z-index:1}
.tl-table td{padding:.6rem 1rem;border-bottom:1px solid #F2F2EF;vertical-align:top}
.tl-table tr:last-child td{border-bottom:none}
.tl-table tr.tl-latest{background:var(--blue-bg)}
.tl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-4);margin-right:7px;flex-shrink:0}
.tl-table tr.tl-latest .tl-dot{background:var(--blue)}
.tl-when{white-space:nowrap;color:var(--ink-2)}
.tl-status{font-weight:600;white-space:nowrap}
.tl-msg{color:var(--ink-2)}
.tl-fonte{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
/* --- Bloco de tickets / abertura --- */
.torre-ticket-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.15rem 1.3rem;margin-bottom:1.25rem}
.torre-ticket-box.has-ticket{border-color:#F0D9A6;background:var(--yellow-bg)}
.torre-ticket-box.no-ticket{border-color:#BFE3CE;background:var(--green-bg)}
.ttb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:.5rem}
.ttb-title{font-size:14px;font-weight:700;color:var(--ink)}
.ttb-sub{font-size:12px;color:var(--ink-2);line-height:1.5}
.ttb-btn-destaque{padding:12px 26px;border-radius:24px;border:none;background:var(--green);color:var(--white);font-size:13.5px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(26,122,74,.25);transition:all .15s}
.ttb-btn-destaque:hover{background:#146039;box-shadow:0 3px 12px rgba(26,122,74,.35)}
.ttb-list{margin-top:.7rem;display:flex;flex-direction:column;gap:7px}
.ttb-item{background:var(--white);border:1px solid var(--border-2);border-radius:var(--radius);padding:.65rem .85rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;min-width:0}
.ttb-item-main{flex:1 1 180px;min-width:0}
.ttb-item-title{font-weight:600;color:var(--ink)}
.ttb-item-meta{font-size:11px;color:var(--ink-3);margin-top:2px}
/* --- Formulario de abertura --- */
.torre-form{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.3rem 1.4rem;margin-bottom:1.25rem}
.tf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:1050px){.tf-grid{grid-template-columns:minmax(0,1fr)}}
.titan-loading-bar{width:100%;max-width:220px;height:4px;background:var(--border-2);border-radius:2px;overflow:hidden;margin-top:3px;display:none}
.titan-loading-fill{height:100%;width:2%;background:var(--blue);border-radius:2px;transition:width .5s linear}
.tf-field{display:flex;flex-direction:column;gap:5px}
.tf-field.full{grid-column:1/-1}
.tf-label{font-size:11px;font-weight:600;color:var(--ink-2)}
.tf-label .req{color:var(--red)}
.tf-input,.tf-select,.tf-textarea{padding:9px 12px;border-radius:var(--radius);border:1px solid var(--border-2);font-size:12.5px;font-family:'Poppins',sans-serif;color:var(--ink);background:var(--white);width:100%}
.tf-input:focus,.tf-select:focus,.tf-textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.tf-input[readonly]{background:var(--surface);color:var(--ink-2)}
.tf-textarea{min-height:74px;resize:vertical}
.tf-prefilled{font-size:10px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tf-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--border);flex-wrap:wrap}
.torre-alert{padding:.75rem 1rem;border-radius:var(--radius);font-size:12.5px;margin-bottom:1rem;line-height:1.5}
.torre-alert.ok{background:var(--green-bg);border:1px solid #BFE3CE;color:var(--green)}
.torre-alert.warn{background:var(--yellow-bg);border:1px solid #F0D9A6;color:var(--yellow)}
.torre-alert.err{background:var(--red-bg);border:1px solid #F5C4BA;color:var(--red)}
.torre-fontes{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.fonte-pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:12px;background:var(--gray-bg);color:var(--ink-3)}
.fonte-pill.on{background:var(--blue-bg);color:var(--blue)}
/* --- Painel de acompanhamento da tratativa (ticket expandido na Torre) --- */
.ttb-item{flex-direction:column;align-items:stretch}
.ttb-item-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%}
.ttb-toggle{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:16px;border:1px solid var(--border-2);background:var(--white);font-size:11.5px;font-weight:600;font-family:'Poppins',sans-serif;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:all .15s}
.ttb-toggle:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.ttb-toggle svg{transition:transform .18s}
.ttb-toggle.open svg{transform:rotate(180deg)}
.ttb-detalhe{display:none;width:100%;margin-top:.8rem;padding-top:.85rem;border-top:1px solid var(--border)}
.ttb-detalhe.open{display:block}
.ttb-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:.9rem}
.ttb-meta-item{background:var(--surface);min-width:0;border:1px solid var(--border);border-radius:var(--radius);padding:.55rem .7rem}
.ttb-meta-k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.ttb-meta-v{font-size:13px;font-weight:600;color:var(--ink);margin-top:3px;word-break:break-word}
.ttb-meta-v.destaque-alerta{color:var(--red)}
.ttb-meta-v.destaque-ok{color:var(--green)}
.ttb-contato{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.65rem .8rem;margin-bottom:.9rem}
.ttb-contato-k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
.ttb-contato-v{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.ttb-hist-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:.5rem;display:flex;align-items:center;gap:7px}
.ttb-hist{max-height:340px;overflow-y:auto;padding-right:2px}
.ttb-acoes{margin-top:.9rem;padding-top:.85rem;border-top:1px solid var(--border)}
.ttb-acoes-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:.55rem}
.ttb-acoes-linha{display:flex;gap:8px;flex-wrap:wrap}
.ttb-acao{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius);font-size:12.5px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;transition:all .15s;border:1px solid var(--border-2);background:var(--white);color:var(--ink-2)}
.ttb-acao:disabled{opacity:.55;cursor:not-allowed}
.ttb-acao-primaria{background:var(--blue);border-color:var(--blue);color:var(--white)}
.ttb-acao-primaria:hover{background:#1d4680;border-color:#1d4680}
.ttb-acao-cliente{background:var(--white);border-color:var(--green);color:var(--green)}
.ttb-acao-cliente:hover{background:var(--green-bg)}
.ttb-acao-encerrar:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.ttb-acoes-aviso{font-size:12px;color:var(--ink-3);font-style:italic}
.torre-outros{display:flex;flex-wrap:wrap;gap:6px;margin-top:.6rem}
.outro-pedido{font-size:11px;padding:4px 11px;border-radius:14px;border:1px solid var(--border-2);background:var(--white);cursor:pointer;font-family:'Poppins',sans-serif;color:var(--ink-2)}
.outro-pedido:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
:root{
  --ink:#0D0D0D;--ink-2:#444;--ink-3:#888;--ink-4:#bbb;
  --surface:#F7F7F5;--white:#FFFFFF;--border:#E4E4E0;--border-2:#D0D0CA;
  --blue:#2659A5;--blue-bg:#EAF0F9;--orange:#E05C1A;--orange-bg:#FDF0E8;
  --green:#1A7A4A;--green-bg:#E8F5EE;--yellow:#96780A;--yellow-bg:#FDF8E3;
  --gray:#555;--gray-bg:#F0F0EE;--purple:#6B21A8;--purple-bg:#F3E8FF;
  --cyan:#1B8FAE;--cyan-bg:#E7F6FA;--lime:#D7D900;--red:#E5381A;--red-bg:#FCE9E5;
  --radius:6px;--radius-lg:10px;
}
body{font-family:'Poppins',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;font-size:13px;line-height:1.5}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--blue);color:var(--white);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{padding:1.5rem 1.25rem 1rem}
.sidebar-brand-row{display:flex;align-items:center;gap:9px}
.sidebar-mark{width:32px;height:32px;border-radius:6px;background:var(--white);padding:3px;object-fit:contain;flex-shrink:0}
.sidebar-logo{font-size:17px;font-weight:700;color:var(--white)}
.sidebar-sub{font-size:11px;font-weight:600;color:var(--lime);margin-top:2px;margin-left:37px;text-transform:uppercase;letter-spacing:.04em}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:.75rem;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:none;background:none;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;font-family:'Poppins',sans-serif;cursor:pointer;text-align:left;transition:all .15s;width:100%;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);color:var(--white)}
.nav-item.active{background:var(--lime);color:var(--ink);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-item span{flex:1}
.nav-badge{font-size:10px;font-weight:700;background:var(--red);color:white;padding:2px 7px;border-radius:10px;flex:none}
.sidebar-footer{display:flex;align-items:center;gap:10px;padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,.12)}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-footer-label{font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em}
.sidebar-footer-name{font-size:13px;font-weight:600;color:var(--white)}
.app-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topheader{background:var(--white);border-bottom:1px solid var(--border);padding:1rem 1.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topheader-caption{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.topheader-title{font-size:20px;font-weight:700;color:var(--ink);margin-top:2px}
.topheader-right{display:flex;align-items:center;gap:14px}
.topheader-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-2);border-radius:20px;padding:8px 14px;color:var(--ink-3);width:280px}
.topheader-search input{border:none;background:none;outline:none;font-size:12px;font-family:'Poppins',sans-serif;color:var(--ink);width:100%}
.topheader-bell{position:relative;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0}
.bell-badge{position:absolute;top:-4px;right:-4px;font-size:9px;font-weight:700;background:var(--red);color:white;padding:1px 5px;border-radius:8px;line-height:1.4}
.main{padding:1.5rem;max-width:1600px;margin:0 auto}
.status-filter-bar{display:flex;flex-direction:column;gap:1px;padding:2px 0 8px 26px;margin-bottom:0}
.status-filter-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:none;background:none;font-size:12px;font-weight:500;font-family:'Poppins',sans-serif;cursor:pointer;text-align:left;color:rgba(255,255,255,.65);transition:all .15s;width:100%}
.status-filter-btn:hover{background:rgba(255,255,255,.08);color:var(--white)}
.status-filter-btn::before{content:'';width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);flex-shrink:0}
.status-filter-btn .sfb-count{margin-left:auto;font-size:10px;opacity:.7}
.status-filter-btn.active{background:var(--lime);color:var(--ink);font-weight:600}
.status-filter-btn.active::before{background:var(--ink)}
.status-count{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:rgba(0,0,0,.07)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.filter-input{padding:7px 12px;border-radius:20px;border:1px solid var(--border-2);font-size:12px;color:var(--ink);background:var(--white);font-family:'Poppins',sans-serif}
.filter-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.filter-select{padding:7px 12px;border-radius:20px;border:1px solid var(--border-2);font-size:12px;color:var(--ink);background:var(--white);cursor:pointer;font-family:'Poppins',sans-serif}
.filter-select:focus{outline:none;border-color:var(--blue)}
.filter-divider{width:1px;height:20px;background:var(--border);margin:0 4px}
.btn-refresh{padding:7px 14px;border-radius:20px;border:1px solid var(--border-2);background:var(--white);font-size:12px;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Poppins',sans-serif;transition:all .15s}
.btn-refresh:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.count-label{font-size:12px;color:var(--ink-3);margin-left:auto}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:1rem;padding:.75rem 1rem;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg)}
.pagination-info{font-size:12px;color:var(--ink-3)}
.pagination-controls{display:flex;align-items:center;gap:10px}
.pagination-page{font-size:12px;color:var(--ink-2);font-weight:500;min-width:110px;text-align:center}
.pagination .btn-refresh:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-aguardando{background:var(--gray-bg);color:var(--gray)}.badge-aguardando::before{background:var(--gray)}
.badge-pendente{background:var(--orange-bg);color:var(--orange)}.badge-pendente::before{background:var(--orange)}
.badge-respondido{background:var(--green-bg);color:var(--green)}.badge-respondido::before{background:var(--green)}
.badge-avaliacao{background:var(--cyan-bg);color:var(--cyan)}.badge-avaliacao::before{background:var(--cyan)}
.badge-extravio{background:var(--red-bg);color:var(--red)}.badge-extravio::before{background:var(--red)}
.badge-concluido{background:var(--purple-bg);color:var(--purple)}.badge-concluido::before{background:var(--purple)}
.status-tag{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;background:var(--yellow-bg);color:var(--yellow)}
.ticket-table{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.t-scroll{overflow-x:auto}
.t-head{display:grid;grid-template-columns:80px 100px 100px 200px 100px 90px 130px minmax(140px,1fr) 110px 32px;gap:.6rem;padding:8px .75rem;background:var(--surface);border-bottom:1px solid var(--border)}
.ticket-table.selecionavel .t-head,.ticket-table.selecionavel .t-row{grid-template-columns:32px 80px 100px 100px 200px 100px 90px 130px minmax(140px,1fr) 110px 32px}
.t-head span{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.t-head-sort{cursor:pointer;display:inline-flex;align-items:center;gap:3px;user-select:none}
.t-head-sort:hover{color:var(--ink)}
.sort-arrow{font-size:10px;opacity:.4}
.sort-arrow.active{opacity:1;color:var(--blue)}
.t-row-wrap{border-bottom:1px solid var(--border)}
.t-row-wrap:last-child{border-bottom:none}
.t-row{display:grid;grid-template-columns:80px 100px 100px 200px 100px 90px 130px minmax(140px,1fr) 110px 32px;gap:.6rem;padding:9px .75rem;align-items:center;cursor:pointer;transition:background .1s}
.t-row>div,.t-row>span{min-width:0;overflow:hidden}
.t-row:hover{background:var(--surface)}
.t-row.expanded{background:var(--blue-bg)}
.t-nf{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.t-nf-wrap{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.t-pedido{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-subject{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}

  /* ==== Tratativa Insucessos (embutido, sem iframe) ==== */

  /* Componente "Tratativa Insucessos" embutido direto na página (sem iframe) —
     usa as MESMAS custom properties de cor que o :root do próprio app já
     define (--ink, --blue, --lime, --green etc.), então não redeclara paleta
     nenhuma aqui. Só declara, escopadas em .ti-wrap, as poucas variáveis
     extras que este componente precisa e que o app não tem. Todo seletor
     usa o prefixo ti- pra nunca colidir com classes existentes (ex.: o app
     já tem suas próprias .wrap, .search, .chevron). */
  .ti-wrap {
    --ti-shadow: 0 1px 2px rgba(13, 13, 13, 0.04), 0 8px 20px -12px rgba(13, 13, 13, 0.14);
    --ti-ativo-bg: var(--green-bg);
    --ti-ativo-border: var(--green);
    --ti-ativo-text: var(--green);
    --ti-inativo-bg: var(--white);
    --ti-inativo-border: var(--border-2);
    --ti-inativo-text: var(--ink-3);
    max-width: 1320px;
    font-family: "Poppins", Arial, sans-serif;
  }

  .ti-toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }

  .ti-search { position: relative; width: 280px; max-width: 100%; }

  .ti-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }

  .ti-search input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    border-radius: 999px;
    border: 1px solid var(--border-2);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
  }

  .ti-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(38, 89, 165, 0.15); }

  .ti-table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--ti-shadow);
    background: var(--surface);
  }

  table.ti-main {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 900px;
    font-size: 13.5px;
  }

  table.ti-main thead th {
    font-family: "Poppins", Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--blue);
    text-align: left;
    padding: 12px 14px;
    white-space: nowrap;
  }

  table.ti-main thead th:first-child { border-top-left-radius: 13px; }
  table.ti-main thead th:last-child { border-top-right-radius: 13px; }

  table.ti-main td {
    padding: 12px 14px;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }

  tr.ti-macro-row { cursor: pointer; }
  tr.ti-macro-row:hover td { background: var(--gray-bg); }
  tr.ti-macro-row.open td { background: var(--gray-bg); }

  td.ti-col-macro { border-left: 5px solid var(--ti-kind-color); min-width: 200px; }

  .ti-macro-inner { display: flex; align-items: center; gap: 9px; }

  .ti-chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-3);
    transition: transform 0.16s ease;
  }

  tr.ti-macro-row.open .ti-chevron.ti-mode-all { transform: rotate(90deg); color: var(--ti-kind-color); }

  .ti-macro-label { font-weight: 700; font-size: 14px; }

  .ti-kind-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ti-kind-color); flex-shrink: 0; }

  td.ti-col-disparo, td.ti-col-tratativa { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; max-width: 240px; }

  td.ti-col-carriers { min-width: 320px; }

  .ti-carrier-pills { display: flex; flex-wrap: wrap; gap: 6px; }

  .ti-carrier-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px 4px 7px;
    border-radius: 999px;
    border: 1px solid var(--ti-inativo-border);
    background: var(--ti-inativo-bg);
    color: var(--ti-inativo-text);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    font-family: inherit;
  }

  .ti-carrier-pill:hover { box-shadow: 0 0 0 2px rgba(38, 89, 165, 0.12); }
  .ti-carrier-pill.ti-active-pill { box-shadow: 0 0 0 2px var(--blue); }

  .ti-carrier-pill.ativa { border-color: var(--ti-ativo-border); background: var(--ti-ativo-bg); color: var(--ti-ativo-text); }

  .ti-carrier-pill .ti-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  tr.ti-detail-row td { background: var(--gray-bg); padding: 0; border-bottom: 1px solid var(--border); border-left: 5px solid var(--ti-kind-color); }
  tr.ti-detail-row.ti-last td { border-bottom: none; }
  tr.ti-macro-row.ti-last-row td { border-bottom: none; }

  .ti-detail-inner { padding: 6px 16px 16px; }

  .ti-detail-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-2);
  }

  .ti-detail-heading .ti-count {
    font-size: 10.5px;
    font-weight: 700;
    background: var(--ti-kind-color);
    color: var(--white);
    padding: 1px 8px;
    border-radius: 999px;
  }

  .ti-micro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding-bottom: 6px; }

  .ti-micro-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    position: relative;
  }

  .ti-micro-tratativa-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 5px;
  }

  .ti-micro-tratativa-tag.ativa { background: var(--lime); color: var(--ink); }
  .ti-micro-tratativa-tag.inativa { background: var(--gray-bg); color: var(--ink-3); border: 1px solid var(--border); }
  .ti-micro-tratativa-tag .ti-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .ti-code-chip {
    font-family: "Poppins", Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-2);
    background: var(--gray-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ti-micro-body { flex: 1; min-width: 0; }
  .ti-micro-name { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .ti-micro-desc { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }

  .ti-detail-empty { padding: 10px 0 16px; color: var(--ink-3); font-size: 12.5px; }

  .ti-wrap mark { background: var(--lime); color: var(--ink); border-radius: 3px; padding: 0 2px; }

  .ti-no-results { display: none; padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

  </style>
</head>

<script>
const WEBHOOK_ENVIAR    = 'https://n8n-prod.gogroupgl.com/webhook/enviar-resposta-ticket';
// GOCASE (21/08/2026): mesma logica do WEBHOOK_HISTORICO/escolhaWebhookHistorico()
// abaixo - a Gocase tem fluxo n8n proprio (conta Gmail diferente), reaproveitar o
// path da Gobeaute quebraria o que ja funciona pra ela. Ver escolhaWebhookEnviar().
const WEBHOOK_ENVIAR_GOCASE = 'https://n8n-prod.gogroupgl.com/webhook/gocase-enviar-resposta';
function escolhaWebhookEnviar() { return CURRENT_MARCA === 'gocase' ? WEBHOOK_ENVIAR_GOCASE : WEBHOOK_ENVIAR; }
const WEBHOOK_IA        = 'https://n8n-prod.gogroupgl.com/webhook/gerar-resposta-ia';
const WEBHOOK_HISTORICO = 'https://n8n-prod.gogroupgl.com/webhook/buscar-historico-thread';
// GOCASE (21/08/2026): a Gobeaute usa o webhook acima ha tempos. A Gocase tem
// suas proprias contas Gmail (cx.tickets@gocase.com e cx.agentes@gocase.com,
// contas separadas - ver CONTAS em server.ts), entao o fluxo n8n pra ela e
// outro workflow, publicado em path proprio - reaproveitar o mesmo path do
// WEBHOOK_HISTORICO derrubaria o que ja atende Gobeaute. Ver escolhaWebhookHistorico().
const WEBHOOK_HISTORICO_GOCASE = 'https://n8n-prod.gogroupgl.com/webhook/gocase-thread-messages';
function escolhaWebhookHistorico() { return CURRENT_MARCA === 'gocase' ? WEBHOOK_HISTORICO_GOCASE : WEBHOOK_HISTORICO; }
const WEBHOOK_CONTATAR_CLIENTE = 'https://n8n-prod.gogroupgl.com/webhook/central-tickets-contatar-cliente';

// FIX SEGURANCA (11/08/2026): a chave anon do Supabase NAO fica mais embutida
// aqui. O app e publico - qualquer visitante podia extrair a chave direto do
// HTML e bater no REST API do Supabase sem passar por nenhum dos limites que
// este arquivo aplica (periodo, paginacao, exclusao de colunas pesadas). Toda
// leitura e escrita de tickets agora passa por endpoints do worker
// (/api/tickets-list, /api/tickets-update-status, /api/tickets-tem-resposta,
// /api/tickets-ultima-mensagem - ver server.ts), que guarda a chave real e
// nunca a expoe. SB_URL/SB_KEY ficam como campos legados de configuracao
// (nao usados mais pra tickets); mantidos so pra nao quebrar quem ja tinha
// algo salvo no localStorage.
const DEFAULT_SB_URL = '';
const DEFAULT_SB_KEY = '';

// A tabela de tratativas (reenvio/reembolso) nao e consultada direto do
// navegador - o worker mantem uma copia local sincronizada e expoe endpoints
// rapidos (/api/tratativas-pills e /api/tratativas-detalhe). Ver server.ts.

let SB_URL  = localStorage.getItem('sb_url') || DEFAULT_SB_URL;
let SB_KEY  = localStorage.getItem('sb_key') || DEFAULT_SB_KEY;
let AGENT   = localStorage.getItem('agent_name') || 'Agente';
// Marca ativa na tela (qual tabela do Supabase ler/gravar). Persiste por
// navegador, nao por usuario - cada agente escolhe ao abrir o app.
let CURRENT_MARCA = localStorage.getItem('central_marca') || '';
function tabelaAtual() { return CURRENT_MARCA === 'gocase' ? 'tickets_gocase' : 'tickets_gobeaute'; }

function atualizarBotoesMarca() {
  var btnGobeaute = document.getElementById('marca-btn-gobeaute');
  var btnGocase = document.getElementById('marca-btn-gocase');
  [btnGobeaute, btnGocase].forEach(function(btn) {
    if (!btn) return;
    btn.style.background = 'none';
    btn.style.color = 'rgba(255,255,255,.75)';
    btn.style.borderColor = 'rgba(255,255,255,.25)';

// SUPABASE
// Paginacao por chave (id) em vez de OFFSET/Range: em tabelas grandes, ORDER BY + OFFSET
// fica cada vez mais lento a cada pagina e pode estourar o timeout do banco sem
// devolver um erro HTTP limpo (fetch fica pendurado). O ordenamento por data_email
// e feito no cliente logo depois, entao a ordem de chegada aqui nao importa.
//
// A base tem dezenas de milhares de linhas (~57 mil). Buscar 1000 por vez de forma
// SEQUENCIAL significa esperar uma pagina terminar pra pedir a proxima - com ~57
// paginas isso soma bastante tempo parado. Aqui a primeira pagina pede o total
// (Prefer: count=exact) e as paginas restantes sao disparadas em lotes concorrentes
// (nao todas de uma vez, pra nao estourar limite de conexao do Supabase/navegador).
// Fetch com timeout via AbortController. Sem isso, se o Supabase (ou qualquer
// endpoint) travar numa query lenta, a Promise do fetch nunca resolve nem
// rejeita - o await correspondente fica pendurado PARA SEMPRE, e qualquer
// tela que dependa desse await (ex: renderListAndPagination) fica em branco
// silenciosamente, sem erro nenhum no console. Isso e o que fazia a lista de
// tickets sumir: a busca de tratativas (ensureTratativasParaPagina) chamava
// fetch() sem timeout num projeto Supabase com uma tabela grande, e se aquela
// query demorasse demais, a pagina inteira travava esperando pra sempre.
function fetchComTimeout(url, options, timeoutMs) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, timeoutMs || 8000);
  var opts = Object.assign({}, options || {}, { signal: controller.signal });
  return fetch(url, opts).finally(function() { clearTimeout(timer); });
}

async function fetchInBatches(items, limit, worker) {
  var results = new Array(items.length);
  var idx = 0;
  async function runner() {
    while (idx < items.length) {
      var current = idx++;
      results[current] = await worker(items[current]);
    }
  }
  var runners = [];
  for (var i = 0; i < Math.min(limit, items.length); i++) runners.push(runner());
  await Promise.all(runners);
  return results;
}

// REDUCAO DE EGRESS (08/08/2026, incidente de cota estourada no Supabase -
// 369GB/250GB no ciclo): duas mudancas na forma de buscar tickets, sem tocar
// em nenhuma logica de filtro/status/ordenacao (que continuam rodando sobre
// o mesmo allTickets completo em memoria, so montado de forma mais barata):
//
// 1) select=* trocado por uma lista explicita de colunas, excluindo
//    "Ultima mensagem" (corpo do email, ate 3000 caracteres por ticket -
//    ver MAX_ULTIMA_MENSAGEM_CHARS no server.ts). Esse campo so e usado como
//    fallback no modal de detalhe (loadHistorico) quando o webhook de
//    historico falha - nesses raros casos, buscamos so aquele campo, so
//    daquele ticket, sob demanda (ver fetchUltimaMensagemFallback).
// 2) autoRefreshTickets() (a cada 60s, pra CADA agente com a aba aberta) nao
//    baixa mais a tabela inteira de novo - busca so linhas com
//    updated_at > ultima sincronizacao conhecida, e atualiza allTickets por
//    cima (merge), preservando os demais. A carga completa continua
//    acontecendo uma vez por sessao/troca de marca (nao tem como evitar na
//    primeira vez), mas deixa de se repetir a cada minuto.
var CAMPOS_LISTA_TICKETS = [
  'id','thread_id','message_id','numero_nf','chave_danfe','tipo_ocorrencia','marca',
  'data_email','remetente','subject','tem_resposta','total_mensagens_thread','updated_at',
  'transportadora','previsao_entrega','Status_resposta_tickets','Precisa responder?',
  'Motivo','Urgência','Número do pedido','Último Status','Rastreio'
];
// FIX (10/08/2026): colunas com caracteres especiais (espaco, "?", acento -
// ex: "Precisa responder?", "Urgência", "Número do pedido") precisam vir entre
// ASPAS DUPLAS dentro do parametro select do PostgREST, nao so URL-encoded.
// Sem as aspas, o parser do PostgREST rejeita a query inteira com erro
// PGRST100 ("failed to parse select param... unexpected '?'"). Envolver TODAS
// as colunas em aspas duplas e seguro (identificador simples entre aspas
// continua valido) e elimina esse problema pra qualquer nome de coluna atual
// ou futuro com caractere especial.
var SELECT_TICKETS = CAMPOS_LISTA_TICKETS.map(function(c) { return encodeURIComponent('"' + c.replace(/"/g, '""') + '"'); }).join(',');
// REDUCAO DE EGRESS (10/08/2026, a pedido da Maria): com varios agentes
// usando a tela ao mesmo tempo, a carga inicial completa da tabela ao abrir
// a pagina/dar F5 virou o maior gerador de trafego - a tickets_gocase
// sozinha tem 85 mil linhas. A tela agora NAO busca nada sozinha ao abrir -
// REDUCAO DE EGRESS (10/08/2026, a pedido da Maria): a tela NAO busca nada
// sozinha ao abrir. So busca quando o agente realmente interage: clica numa
// aba de status (carga completa da tabela, uma unica vez por sessao/marca -
// ver setStatusFilter) ou digita uma busca (consulta direcionada, so os
// tickets que baterem com o termo, sem carregar o resto - ver
// onHeaderSearch/buscarTermoDireto). dadosCarregados marca se a carga
// completa ja aconteceu nesta sessao/marca; resetada ao trocar de marca.
var dadosCarregados = false;
// FIX (11/08/2026): rastreia qual foi o MODO da ultima carga de allTickets -
// ver bug corrigido em setStatusFilter (allTicketsModo).
var allTicketsModo = null;
// CARGA POR PERIODO (10/08/2026, a pedido da Maria): cada aba de status
// carrega so os tickets dentro deste periodo (De/Ate), nao a tabela inteira.
// Persistido em variavel de modulo (nao recalculado a cada render) pra nao
// resetar a escolha do agente toda vez que a tela de tickets e reconstruida
// (ex: navegando de outra aba de volta pra um status). Comeca com a
// sugestao padrao de 30 dias; muda quando o agente aplica um novo filtro de
// data (ver aplicarFiltroPeriodo).
var periodoDataIni = sugestaoDataIni();
var periodoDataFim = sugestaoDataFim();
// Guarda, por tabela (gobeaute/gocase), o maior updated_at ja visto - usado
// pra saber a partir de onde buscar na proxima atualizacao incremental.
var ultimaSincronizacaoPorTabela = Object.create(null);
function atualizarUltimaSincronizacao(tabela, tickets) {
  var maxTs = ultimaSincronizacaoPorTabela[tabela] || null;
  tickets.forEach(function(t) {
    if (!t.updated_at) return;
    if (!maxTs || t.updated_at > maxTs) maxTs = t.updated_at;
  });
  if (maxTs) ultimaSincronizacaoPorTabela[tabela] = maxTs;
}

// FIX SEGURANCA/EGRESS (11/08/2026): toda essa funcao construia URLs do REST
// API do Supabase com a anon key embutida e paginava direto no navegador
// (rodadas paralelas de 1000 em 1000). Isso exigia expor a chave real no
// HTML publico do app - qualquer visitante podia extrair a chave e reproduzir
// essas mesmas chamadas fora dos limites que o app aplica. Agora e uma unica
// chamada ao worker (/api/tickets-list em server.ts), que guarda a chave e
// faz a paginacao do lado dele; a carga completa (sem periodo, usada pelas
// abas de Extravio) ainda passa pelo mesmo caminho pesado no Supabase, mas
// agora com um cache curto (30s) no worker, compartilhado entre TODOS os
// agentes com a aba aberta - varios agentes clicando na mesma aba dentro
// dessa janela reaproveitam uma unica consulta em vez de multiplicar egress.
async function fetchTickets(desde, termoBusca, periodo, modoExtravio) {
  try {
    var tabela = tabelaAtual();
    var qs = 'tabela=' + encodeURIComponent(tabela);
    if (termoBusca) {
      // BUSCA DIRECIONADA: consulta so os tickets que batem com o termo (NF,
      // pedido ou assunto) - o worker aplica o mesmo filtro ILIKE com limite
      // de 500 que ja existia aqui, so que agora do lado do servidor.
      qs += '&termo=' + encodeURIComponent(termoBusca);
    } else if (modoExtravio === 'status_extravio') {
      // Aba "Extravio aberto": filtro exato no Postgres, sem heuristica -
      // ver comentario em buscarTicketsProxy (server.ts) sobre por que isso
      // e seguro (equivalente ao que a aba mostrava antes).
      qs += '&status=extravio';
    } else if (modoExtravio === 'heuristica_extravio') {
      // Aba "Abrir Extravio": pre-filtro seguro (superconjunto) no Postgres -
      // ver comentario em buscarTicketsProxy (server.ts). O calculo fino de
      // dias uteis continua aqui, em getTicketsExtravio().
      qs += '&heuristicaExtravio=1';
    } else if (periodo && periodo.ini && periodo.fim) {
      // CARGA POR PERIODO (a pedido da Maria): cada aba de status carrega so
      // o periodo determinado (De/Ate), nao a tabela inteira.
      qs += '&ini=' + encodeURIComponent(periodo.ini) + '&fim=' + encodeURIComponent(periodo.fim);
    } else {
      // FIX (11/08/2026): ha pelo menos um chamador (renderRegras(), busca em
      // segundo plano de allTickets pra popular a lista de transportadoras
      // ativas, quando o agente visita "Regras de Negocio" antes de qualquer
      // aba de tickets) que chama fetchTickets() SEM nenhum termo/modo/
      // periodo. Sem este else, isso cairia num fetch SEM FILTRO NENHUM -
      // exatamente a classe de bug do erro de 32MiB corrigido mais acima
      // nesta mesma sessao, so que por uma porta diferente. Qualquer chamada
      // que nao especifique nada agora usa o periodo padrao (30 dias), nunca
      // a tabela inteira sem limite.
      qs += '&ini=' + encodeURIComponent(sugestaoDataIni()) + '&fim=' + encodeURIComponent(sugestaoDataFim());
    }
    // "desde" (sincronizacao incremental do auto-refresh) nao e mais usado -
    // o auto-refresh automatico foi removido em 10/08/2026; mantido como
    // parametro so por retrocompatibilidade com autoRefreshTickets(), que
    // hoje nao e chamada por nada na interface.
    var r = await fetchComTimeout('/api/tickets-list?' + qs, {}, 30000);
    if (!r.ok) {
      var eb = ''; try { eb = await r.text(); } catch (e3) {}
      throw new Error('HTTP ' + r.status + ' ' + eb);
    }
    var data = await r.json();
    if (data && data.__error) return { __error: data.__error };
    return data;
  } catch(e) {
    console.error('[fetchTickets] erro ao buscar tickets:', e);
    return { __error: String(e && e.message || e) };
  }
}

// Reexecuta uma requisicao GET automaticamente em erros transitorios do
// Postgres (57014 statement timeout, 503, etc) antes de desistir - evita que
// um engasgo passageiro do banco derrube a tela toda com uma mensagem de
// erro, quando bastava tentar de novo. Espera crescente entre tentativas.
async function fetchComRetry(url, headers, tentativas) {
  var ultimaResposta = null;
  for (var i = 0; i < tentativas; i++) {
    try {
      var r = await fetch(url, { headers: headers });
      if (r.ok) return r;
      // 500/503/504 sao candidatos a transitorio (timeout, sobrecarga); outros
      // status (400/401/404) nao adianta repetir, devolve na hora.
      if (r.status !== 500 && r.status !== 503 && r.status !== 504) return r;
      ultimaResposta = r;
    } catch (e) {
      // erro de rede - tambem vale tentar de novo
    }
    if (i < tentativas - 1) await new Promise(function(res) { setTimeout(res, 600 * Math.pow(2, i)); });
  }
  return ultimaResposta || await fetch(url, { headers: headers });
}

// Busca os pills de Reembolso/Reenvio SO dos pedidos da pagina atual, no
// proprio worker (que mantem uma copia local sincronizada da tabela de
// tratativas - ver /api/tratativas-pills em server.ts). Antes isso ia direto
// no Supabase de origem (tabela de ~136 mil linhas sem indice em
// numero_pedido), e uma consulta filtrada la custava quase o mesmo que ler a
// tabela inteira - daí os 8-15s de travamento IguaL toda vez. Consultando o
// worker em vez disso, a resposta e local e instantanea.
// Busca (com cache) se os tickets da pagina atual ja tem "Ressarcimento solicitado"
// marcado - a marcacao fica no SQLite do proprio worker (ver /api/ressarcimentos
// em server.ts), nao no Supabase, entao precisa dessa consulta separada.
async function buscarRessarcimentoParaPagina(pageItems) {
  var faltantes = [];
  pageItems.forEach(function(t) {
    if (!t.thread_id) return;
    if (ressarcimentoMap[t.thread_id] === undefined) faltantes.push(t.thread_id);
  });
  if (!faltantes.length) return;
  try {
    var lista = faltantes.map(function(id) { return encodeURIComponent(id); }).join(',');
    var r = await fetchComTimeout('/api/ressarcimentos?thread_ids=' + lista, {}, 10000);
    if (!r.ok) return; // fica undefined, tenta de novo na proxima renderizacao
    var data = await r.json();
    var marcados = data.marcados || {};
    faltantes.forEach(function(id) { ressarcimentoMap[id] = !!marcados[id]; });
  } catch (e) {
    console.error('[ressarcimento] erro ao buscar pagina:', e);
  }
}

async function buscarPillsParaPagina(pageItems) {
  var faltantes = [];
  var vistos = {};
  pageItems.forEach(function(t) {
    var key = String(getPedido(t) || '').trim();
    if (!key || key === '—' || vistos[key]) return;
    vistos[key] = true;
    if (tratativaMap[key] === undefined) faltantes.push(key);
  });
  if (!faltantes.length) return;
  try {
    var lista = faltantes.map(function(k) { return encodeURIComponent(k); }).join(',');
    var r = await fetchComTimeout('/api/tratativas-pills?pedidos=' + lista, {}, 10000);
    if (!r.ok) return; // deixa undefined pra tentar de novo na proxima renderizacao desta pagina
    var data = await r.json();
    var pills = data.pills || {};
    if (data.avisoAoVivo) {
      // A busca ao vivo falhou (Supabase de origem lento/fora do ar) pra pelo
      // menos parte dos pedidos desta pagina. So grava no cache quem REALMENTE
      // veio na resposta - os que nao vieram ficam undefined (nao null), pra
      // serem tentados de novo na proxima renderizacao desta pagina, em vez de
      // ficar marcados como "sem reenvio/reembolso" pra sempre por causa de uma
      // falha passageira (era isso que fazia pedidos com tratativa de verdade
      // pararem de mostrar o selo).
      faltantes.forEach(function(key) {
        if (pills[key]) tratativaMap[key] = pills[key];
      });
    } else {
      faltantes.forEach(function(key) {
        tratativaMap[key] = pills[key] || null;
      });
    }
  } catch (e) {
    console.error('[tratativas] erro ao buscar pills da pagina:', e);
    // nao marca como null - fica undefined pra tentar de novo depois
  }
}

// Mesma ideia de buscarPillsParaPagina, mas para uma lista arbitraria de tickets
// (usada na exportacao CSV, que cobre TODOS os tickets filtrados, nao so os 20
// da pagina atual - pode ser milhares). O endpoint /api/tratativas-pills aceita
// no maximo 200 pedidos por chamada (limite do proprio backend), entao aqui a
// lista de pedidos faltantes e dividida em blocos de 200 e as chamadas rodam em
// paralelo (poucas de cada vez, pra nao estourar limite de conexao).
async function garantirTratativasParaLista(tickets) {
  var faltantes = [];
  var vistos = {};
  tickets.forEach(function(t) {
    var key = String(getPedido(t) || '').trim();
    if (!key || key === '—' || vistos[key]) return;
    vistos[key] = true;
    if (tratativaMap[key] === undefined) faltantes.push(key);
  });
  if (!faltantes.length) return;

  async function buscarLote(chave) {
    try {
      var lista = chave.map(function(k) { return encodeURIComponent(k); }).join(',');
      var r = await fetchComTimeout('/api/tratativas-pills?pedidos=' + lista, {}, 20000);
      if (!r.ok) return;
      var data = await r.json();
      var pills = data.pills || {};
      if (data.avisoAoVivo) {
        chave.forEach(function(key) { if (pills[key]) tratativaMap[key] = pills[key]; });
      } else {
        chave.forEach(function(key) { tratativaMap[key] = pills[key] || null; });
      }
    } catch (e) {
      console.error('[tratativas] erro ao buscar pills para exportacao/filtro:', e);
      // nao marca nada - fica undefined, tenta de novo na rodada de retry abaixo
    }
  }

  var blocos = [];
  for (var i = 0; i < faltantes.length; i += 200) blocos.push(faltantes.slice(i, i + 200));
  await fetchInBatches(blocos, 4, buscarLote);

  // RETRY: com volumes grandes (milhares de pedidos), alguns lotes podem falhar
  // por timeout ou sobrecarga momentanea do Supabase de origem. Sem isso, esses
  // pedidos ficavam permanentemente "undefined" e o filtro de Vazio os tratava
  // incorretamente como se nao tivessem tratativa (bug: pedidos com reenvio ou
  // reembolso apareciam no filtro "Vazio"). Tenta mais uma vez, em lotes menores
  // e com menos concorrencia, so pra quem ainda ficou sem resposta.
  var aindaFaltando = faltantes.filter(function(k) { return tratativaMap[k] === undefined; });
  if (aindaFaltando.length) {
    var blocosRetry = [];
    for (var j = 0; j < aindaFaltando.length; j += 50) blocosRetry.push(aindaFaltando.slice(j, j + 50));
    await fetchInBatches(blocosRetry, 2, buscarLote);
  }
}

// Versao em texto puro dos pills de Reembolso/Reenvio (pra exportacao CSV)
function getTratativaTexto(numeroPedido) {
  var resumo = getTratativaResumo(numeroPedido);
  if (!resumo) return '—';
  var partes = [];
  if (resumo.reembolso) partes.push('Reembolso');
  if (resumo.reenvio) partes.push('Reenvio');
  return partes.length ? partes.join(' + ') : '—';
}

// Busca os detalhes completos de tratativas de UM PEDIDO especifico (sob demanda, ao expandir o ticket)
async function loadTratativaDetalhe(numeroPedido, cid) {
  var panel = document.getElementById('subtab-tratativa-' + cid);
  if (!panel) return;
  var key = String(numeroPedido || '').trim();
  if (!key) { panel.innerHTML = renderTratativaPanel([]); return; }
  if (tratativaDetailCache[key]) { panel.innerHTML = renderTratativaPanel(tratativaDetailCache[key]); return; }
  panel.innerHTML = '<div class="thread-loading">Carregando tratativas...</div>';
  try {
    var r = await fetchComTimeout(
      '/api/tratativas-detalhe?pedido=' + encodeURIComponent(key),
      {},
      10000
    );
    if (!r.ok) {
      var errBody = '';
      try { errBody = await r.text(); } catch(e2) {}
      throw new Error('HTTP ' + r.status + ' ' + errBody);
    }
    var data = await r.json();
    var regs = data.registros || [];
    // ordena por data da solicitacao, mais recente primeiro (feito no cliente para nao pesar a query no banco)
    regs.sort(function(a, b) {
      var da = a.data_solicitacao ? new Date(a.data_solicitacao).getTime() : 0;
      var db = b.data_solicitacao ? new Date(b.data_solicitacao).getTime() : 0;
      return db - da;
    });
    tratativaDetailCache[key] = regs;
    panel.innerHTML = renderTratativaPanel(regs);

function parseRem(raw) {
  if (!raw) return { email: '', display: '—' };
  let obj = raw;
  if (typeof raw === 'string') { try { obj = JSON.parse(raw); } catch(e) { obj = null; } }
  if (obj && typeof obj === 'object') {
    const entry = Array.isArray(obj.value) ? obj.value[0] : (obj.address ? obj : null);
    if (entry) { const e = entry.address||'', n = entry.name||''; return { email: e, display: n ? n+' <'+e+'>' : e }; }
  }
  const s = typeof raw === 'string' ? raw : '';
  const m = s.match(/<(.+?)>/);
  if (m) return { email: m[1], display: s };
  const m2 = s.match(/\S+@\S+\.\S+/);
  return m2 ? { email: m2[0], display: m2[0] } : { email: s, display: s };

// Numero de dia inteiro (baseado nos componentes locais de ano/mes/dia, nao
// no timestamp) - serve de eixo pra calcular dias uteis sem iterar dia a dia.
function toDayNumber(d) {
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
// Conta quantos dias uteis (seg-sex) existem no intervalo FECHADO [aDay, bDay]
// (aDay <= bDay), em O(1): semanas cheias * 5 + resto calculado dia a dia
// (no maximo 6 iteracoes, nunca cresce com o tamanho do intervalo).
function contarUteisNoIntervalo(aDay, bDay) {
  var totalDias = bDay - aDay + 1;
  var semanas = Math.floor(totalDias / 7);
  var resto = totalDias % 7;
  var count = semanas * 5;
  for (var i = 0; i < resto; i++) {
    var dow = ((aDay + i + 4) % 7 + 7) % 7; // dia 0 (epoch, 1970-01-01) cai numa quinta (4)
    if (dow !== 0 && dow !== 6) count++;
  }
  return count;
}

// Antes isso era um while incrementando/decrementando dia a dia ate bater a

// centenas de iteracoes POR TICKET, toda vez que os contadores de status e a
// lista de "Abrir Extravio" eram recalculados (a cada clique de filtro).
function contarDiasUteis(inicio, fim) {
  var a = toDayNumber(inicio);
  var b = toDayNumber(fim);
  if (a === b) return 0;
  if (b > a) return contarUteisNoIntervalo(a + 1, b);
  return -contarUteisNoIntervalo(b, a - 1);
}

// Catalogo unico de status: qualquer novo status entra aqui e se propaga
// automaticamente para o filtro, o badge e os rotulos - sem duplicar em 5 lugares.
const STATUS_DEFS = {
  aguardando:           { label: 'Aguardando transportadora', filterCls: 'sfb-aguardando', badgeCls: 'badge-aguardando' },
  pendente:             { label: 'Tratativa CX',              filterCls: 'sfb-pendente',   badgeCls: 'badge-pendente' },
  respondido:           { label: 'Respondido',                filterCls: 'sfb-respondido', badgeCls: 'badge-respondido' },

  concluido:            { label: 'Concluído',                 filterCls: 'sfb-concluido',  badgeCls: 'badge-concluido' },
};

// O status manual (definido pelo agente no dropdown) vence, EXCETO quando o
// Ultimo Status Intelipost = DELIVERED (regra de negocio de 26/08/2026: todo
// ticket entregue pela transportadora vai pra Concluido, nao importa a acao -
// Respondido, Tratativa CX ou Aguardando transportadora - com excecao apenas
// de classificacao = Acareacao). Fora esse caso, so cai no calculo automatico
// se o ticket nunca recebeu um status manual valido - isso preserva o
// comportamento de tickets antigos que nunca foram tocados.
function calcStatus(t) {
  // Extravio aberto e Concluido sao estados "definitivos" nesta operacao: uma
  // vez que o ticket entrou em processo de extravio/ressarcimento (aba Extravio
  // aberto) ou foi encerrado (Concluido), ele deve permanecer la mesmo que a
  // transportadora responda de novo depois - a aba Extravio aberto concentra
  // TODAS as situacoes aguardando solicitacao de ressarcimento, entao uma nova
  // resposta da transportadora nao pode "puxar" o ticket de volta pra Tratativa
  // CX. Por isso esses dois status sao checados ANTES do isPrecisa().
  if (t.Status_resposta_tickets === 'extravio' || t.Status_resposta_tickets === 'concluido') {
    return t.Status_resposta_tickets;
  }
  // Ultimo Status Intelipost = DELIVERED fecha o ticket como Concluido SEMPRE,
  // independente da acao realizada ate aqui (Respondido, Tratativa CX ou
  // Aguardando transportadora) e mesmo que exista um status manual definido no
  // dropdown - por isso esta checagem vem ANTES do isPrecisa() e do status
  // manual abaixo (regra de negocio de 26/08/2026). Unica excecao: classificacao
  // (tipo_ocorrencia) = Acareacao, que nao fecha automaticamente so por a
  // transportadora reportar entregue, pois a acareacao pode acabar confirmando
  // extravio mesmo com o pedido marcado como entregue.
  if (getStatus(t) === 'DELIVERED' && (t.tipo_ocorrencia || '').trim() !== 'Acareação') return 'concluido';
  // Precisa responder = true SEMPRE cai em Tratativa CX, mesmo que o ticket ja
  // tenha um status manual definido antes (ex: agente marcou "Respondido" ou
  // "Aguardando transportadora" e depois chegou/foi classificada uma nova
  // mensagem que precisa de acao). Sem isso, o status manual antigo travava
  // o ticket fora da aba Tratativa CX pra sempre, mesmo com Precisa responder=true.
  if (isPrecisa(t)) return 'pendente';
  if (STATUS_KEYS.indexOf(t.Status_resposta_tickets) !== -1) return t.Status_resposta_tickets;
  const cached = t.thread_id ? threadCache[t.thread_id] : null;
  if (cached && cached.mensagens && cached.mensagens.length) {
    const temRecebida = cached.mensagens.some(function(m) { return m.isSent === false; });
    if (!temRecebida) return 'aguardando';
    if (t.tem_resposta && !isPrecisa(t)) return 'respondido';
    return 'aguardando';
  }
  if (t.tem_resposta && !isPrecisa(t)) return 'respondido';
  return 'aguardando';
}

function getTicketsExtravio() {

    if (status === 'extravio' || status === 'concluido') return false;

    if (status !== 'aguardando') return false;

function getStatusCounts(tickets) {

}

// Extrai o email da PRIMEIRA mensagem da thread (nao da ultima) - usado quando

function getParaPrimeiraMensagem(threadId) {
  var cached = threadId ? threadCache[threadId] : null;
  if (!cached || !cached.mensagens || !cached.mensagens.length) return null;
  var primeira = cached.mensagens[0];
  var isSent;
  if (typeof primeira.isSent === 'boolean') {

    var toRaw = primeira.to || primeira.To || '';

    if (parsedTo.email) return parsedTo.email;
    return null;
  }
  var fromRaw = primeira.from || primeira.From || '';
  var parsed = parseRem(fromRaw);

// Extrai email da ultima mensagem RECEBIDA do cache da thread
function getParaFromThread(threadId, fallbackEmail) {
  const cached = threadId ? threadCache[threadId] : null;
  if (cached && cached.mensagens && cached.mensagens.length) {
    // Pega mensagens recebidas (nao enviadas por nos)
    const recebidas = cached.mensagens.filter(function(m) {
      if (typeof m.isSent === 'boolean') return !m.isSent;
      if (m.labelIds && Array.isArray(m.labelIds)) return m.labelIds.indexOf('SENT') === -1;
      var fromEmail = (m.from || '').toLowerCase();
      return fromEmail.indexOf('gobeaute') === -1 && fromEmail.indexOf('tickets') === -1;
    });
    if (recebidas.length) {
      var ultima = recebidas[recebidas.length - 1];
      var fromRaw = ultima.from || ultima.From || '';
      var parsed = parseRem(fromRaw);
      if (parsed.email) return parsed.email;
    }
  }
  return fallbackEmail;
}

  if (cached && cached.mensagens && cached.mensagens.length > 1) return true;
  return false;
}
// Extrai so a CATEGORIA do Motivo classificado pela IA (ex: "EXTRAVIO_CONFIRMADO"
// de "EXTRAVIO_CONFIRMADO — Transportadora confirmou que o objeto foi extraviado"),
// descartando a descricao livre depois do travessao. Usado pelo filtro de
// "Motivo de contato da transportadora", que precisa agrupar por categoria, nao
// pelo texto completo (que varia ticket a ticket mesmo dentro da mesma categoria).
function getMotivoCategoria(t) {
  var motivo = t['Motivo'] || '';
  if (!motivo) return '';
  var idx = motivo.indexOf('—');
  return (idx !== -1 ? motivo.slice(0, idx) : motivo).trim();
}
function getMotivoCell(t) {
  var motivo = t['Motivo'] || '';
  if (motivo && motivo !== '—') return motivo;
  if (temRespostaReal(t)) return '—';
  var dias = getDiasSemResposta(t);

  return '<span style="background:var(--yellow-bg);color:var(--yellow);font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px">' + dias + ' du sem resposta</span>';
}

// nada foi carregado ainda, sempre sem limite de periodo.

async function loadAndRender(tab, limparTratativas) {
  if (limparTratativas) { tratativaMap = {}; tratativaDetailCache = {}; }
  // TRANSICAO SUAVE (10/08/2026, a pedido da Maria): monta o esqueleto da
  // tela (filtros, barra de acao em lote) IMEDIATAMENTE, e mostra o estado
  // de carregamento so dentro da lista - antes, a tela inteira era apagada
  // por um texto solto, fazendo os filtros sumirem e reaparecerem a cada
  // troca de aba, o que parecia uma transicao ruim/piscante.
  if (currentStatusFilter !== 'todos') {
    document.getElementById('main-content').innerHTML =
      '<div id="bulk-action-bar-wrap">' + renderBulkActionBar() + '</div>' +
      filtersBar() +
      '<div id="list-container"><div class="state-box"><p>Carregando tickets...</p></div></div>' +
      '<div id="pagination-bar"></div>';
  } else {
    document.getElementById('main-content').innerHTML =
      '<div id="list-container"><div class="state-box"><p>Carregando...</p></div></div><div id="pagination-bar"></div>';
  }

  // FIX 32MiB / EGRESS (11/08/2026): antes, as duas abas de Extravio
  // buscavam a tabela inteira (sem filtro de data) e filtravam tudo no
  // navegador. Isso chegou a dar um erro real em producao quando
  // tickets_gocase (85 mil linhas) excedeu o limite de 32MiB do RPC do
  // worker. Agora cada aba pede ao worker so o subconjunto relevante:
  // "Extravio aberto" pede Status_resposta_tickets=extravio direto (filtro
  // exato, sem heuristica); "Abrir Extravio" pede um SUPERCONJUNTO seguro da
  // heuristica de atraso (ver heuristicaExtravio em server.ts) - o calculo
  // fino de dias uteis continua sendo feito aqui (getTicketsExtravio), so
  // que sobre um conjunto ja bem menor.
  var data;
  if (currentStatusFilter === 'extravio') {
    data = await fetchTickets(undefined, undefined, null, 'status_extravio');
  } else if (currentStatusFilter === 'abrir_extravio') {
    data = await fetchTickets(undefined, undefined, null, 'heuristica_extravio');
  } else {
    // CARGA POR PERIODO (10/08/2026): busca so o periodo atual (De/Ate), nao
    // a tabela inteira - ver periodoDataIni/periodoDataFim e fetchTickets.
    data = await fetchTickets(undefined, undefined, { ini: periodoDataIni, fim: periodoDataFim });
  }

  if (!data || data.__error) {
    var msg = (data && data.__error) ? data.__error : 'Erro desconhecido ao conectar ao Supabase.';
    var erroHtml = '<div class="state-box"><p>Erro ao carregar tickets: ' + msg + '</p>' +
      '<button class="btn-refresh" style="margin-top:12px" onclick="loadAndRender(\'' + (tab || currentTab) + '\')">' +
      '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6a5 5 0 1 0 1-2.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M1 2v2.5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Tentar novamente</button></div>';
    var lc = document.getElementById('list-container');
    if (lc) lc.innerHTML = erroHtml; else document.getElementById('main-content').innerHTML = erroHtml;
    return; // dadosCarregados continua false - proxima interacao tenta de novo
  }
  dadosCarregados = true;
  // FIX (11/08/2026, bug real reportado pela Maria): "Abrir Extravio" e
  // "Extravio aberto" agora buscam um SUBCONJUNTO restrito (ver comentario
  // acima) em vez da tabela inteira - por design, pra corrigir o erro de
  // 32MiB. Isso quebrou a otimizacao mais abaixo em setStatusFilter, que
  // (desde 10/08/2026) so redesenhava a barra de status reaproveitando
  // allTickets em memoria, sem buscar de novo, ao trocar de aba - essa
  // otimizacao so e segura quando allTickets contem o periodo/tabela
  // completa, nunca quando contem um recorte estreito de extravio. Marca
  // aqui qual foi o modo desta carga, pra setStatusFilter saber quando
  // PRECISA buscar de novo em vez de reaproveitar.
  allTicketsModo = (currentStatusFilter === 'extravio') ? 'extravio_status'
    : (currentStatusFilter === 'abrir_extravio') ? 'heuristica_extravio'
    : 'periodo';
  allTickets = data.sort(function(a, b) { var da = a.data_email ? new Date(a.data_email).getTime() : 0; var db = b.data_email ? new Date(b.data_email).getTime() : 0; return db - da; });
  invalidarPedidoCountCache();
  ultimaSincronizacaoPorTabela[tabelaAtual()] = null; // carga completa: zera antes de recalcular
  atualizarUltimaSincronizacao(tabelaAtual(), allTickets);
  updateBadge();
  renderTab(tab || currentTab);


  var lastUpdateEl = document.getElementById('last-update');
  if (lastUpdateEl) lastUpdateEl.textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function tEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function tVal(v) {
  if (v === null || v === undefined || v === '') return '—';
  return tEsc(v);
}
function tData(iso) {
  if (!iso) return '—';
  var s = String(iso);
  var d = s.slice(0, 10).split('-');
  if (d.length !== 3) return tEsc(s);
  var hora = s.length >= 16 ? ' ' + s.slice(11, 16) : '';
  return d[2] + '/' + d[1] + '/' + d[0] + hora;
}
function tDataCurta(iso) {
  if (!iso) return '—';
  var d = String(iso).slice(0, 10).split('-');
  return d.length === 3 ? d[2] + '/' + d[1] + '/' + d[0] : tEsc(iso);
}
function tMoeda(v) {
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (isNaN(n)) return tEsc(v);
  return 'R$ ' + n.toFixed(2).replace('.', ',');
}

// --- Cards de saude logistica -------------------------------------------
// O card de atraso e o heroi da tela: e a informacao que decide a acao do
// agente. Vermelho = fora do prazo, verde = dentro. Quando o pedido ja foi
// entregue, o numero CONGELA no atraso que houve na entrega (nao fica
// crescendo pra sempre) - quem calcula isso e o backend, em calcularAtraso().
function renderCardAtraso(kpi, pedido) {
  var dias = kpi.dias_atraso;
  if (dias === null || dias === undefined) {
    return '<div class="kpi-card kpi-hero is-neutral">'
      + '<div class="kpi-label">Dias de atraso</div>'
      + '<div class="kpi-value">—</div>'
      + '<div class="kpi-sub">Sem previsão de entrega informada pela transportadora.</div></div>';
  }
  var entregue = !!kpi.entregue;
  // A data prevista tem que aparecer SEMPRE, em todos os cenarios: sem ela o
  // card dizia so "Adiantado" e o agente nao tinha como saber adiantado em
  // relacao a que data (feedback da Ivna, 17/08/2026). O resto da
  // reconciliacao (entregue em/faltam/depois do prazo) foi tirado do subtexto
  // por ser redundante com o valor grande do card, que ja mostra os dias
  // (feedback da Ivna, 17/08/2026).
  var prev = tDataCurta(pedido.previsao_entrega);
  var sub = 'Previsão: <b>' + prev + '</b>';
  var classe, valor;
  var nDias = function(n) { return n + (n === 1 ? ' dia' : ' dias'); };

  if (dias > 0) {
    classe = 'is-late';
    valor = nDias(dias);
  } else if (dias === 0) {
    classe = entregue ? 'is-ontime' : 'is-late';
    valor = entregue ? 'No prazo' : 'Vence hoje';
  } else {
    classe = 'is-ontime';
    var faltam = Math.abs(dias);
    valor = entregue ? nDias(faltam) + ' antes' : nDias(faltam);
  }
  var rotulo = dias > 0 ? 'Dias de atraso' : (entregue ? 'Entrega x prazo' : 'Prazo de entrega');
  return '<div class="kpi-card kpi-hero ' + classe + '">'
    + '<div class="kpi-label">' + rotulo + '</div>'
    + '<div class="kpi-value">' + valor + '</div>'
    + '<div class="kpi-sub">' + sub + '</div></div>';
}

// Card novo (04/09/2026, a pedido da Ivna): o card "Dias de atraso" acima
// compara com a previsao original da Intelipost, que NAO e recalculada se o
// pedido demorou pra sair do CD - entao um pedido pode aparecer com dezenas
// de dias "atrasados" ali mesmo estando dentro do prazo real, que so comeca a
// contar depois que a transportadora de fato coleta o pedido (kpi.atraso_transportadora,
// calculado no backend a partir de pedido.data_envio + transportadora.prazo_dias -
// ver diasUteisAposDespacho em server.ts). Sem calendario de feriados (nao
// temos essa base) - conta so dias uteis seg-sex, entao pode subestimar
// levemente o atraso real em semanas com feriado.
function renderCardAtrasoTransportadora(kpi) {
  var at = kpi.atraso_transportadora;
  if (!at) return '';
  var restantes = at.dias_restantes;
  var nDias = function(n) { return Math.abs(n) + ' DU'; };
  var classe, valor, rotulo;
  if (restantes < 0) {
    classe = 'is-late';
    rotulo = 'Atraso (transportadora)';
    valor = nDias(restantes);
  } else if (restantes === 0) {
    classe = 'is-late';
    rotulo = 'Prazo da transportadora';
    valor = 'Vence hoje';
  } else {
    classe = 'is-ontime';
    rotulo = 'Prazo da transportadora';
    valor = nDias(restantes) + ' restantes';
  }
  return '<div class="kpi-card kpi-hero ' + classe + '">'
    + '<div class="kpi-label">' + rotulo + '</div>'
    + '<div class="kpi-value">' + valor + '</div>'
    + '<div class="kpi-sub">' + at.dias_uteis_decorridos + ' de ' + at.prazo_dias + ' dias úteis desde o despacho</div></div>';
}

function renderTorreKpis(d) {
  var kpi = d.kpi || {}, pedido = d.pedido || {}, transp = d.transportadora || {};
  var ultimo = kpi.ultimo_evento;
  var entregue = !!kpi.entregue;
  var statusSub = ultimo ? tEsc(ultimo.micro_status || ultimo.status) + ' · ' + tEsc(ultimo.data) : 'Sem eventos de rastreio';
  // Entregue (24/08/2026, a pedido da Ivna): o card "Entrega x Prazo" so faz
  // sentido enquanto o pedido ainda pode atrasar - depois de entregue, vira
  // so contexto historico, entao some o card inteiro e a previsao passa a
  // aparecer junto da propria data de entrega, no card de Status.
  if (entregue && pedido.previsao_entrega) {

    +   '<div class="kpi-label">Status atual</div>'
    +   '<div class="kpi-value-sm" style="margin-top:4px">' + tVal(pedido.status || kpi.status) + '</div>'

    + '</div>'

    +   '<div class="kpi-label">Transportadora</div>'

    +   '<div class="kpi-sub">' + (transp.prazo_dias ? 'Prazo contratado: ' + tEsc(transp.prazo_dias) + ' dias' : 'Prazo não informado') + '</div>'

    + '</div>'

}

// --- Checklist de status (01/09/2026, a pedido da Ivna) -------------------
// Um passo a passo visual logo no comeco da Torre: pra Gobeaute, os
// primeiros checks vem do Titan BI (infos_titan.eventos, via torreState.titan
// - so existe pra Gobeaute, ver torreSolicitarTitan) ate a situacao
// "Embarcado"; dali em diante (e do zero pra Gocase, que nunca passa pelo
// Titan/Unilog) os checks vem da timeline da Intelipost, ate "Entregue".
var TORRE_STATUS_POS_EMBARQUE = ['Em trânsito', 'Saiu para entrega', 'Entregue'];
var TORRE_STATUS_GOCASE = ['Despachado', 'Em trânsito', 'Saiu para entrega', 'Entregue'];

// A timeline da Intelipost (d.timeline) vem mais recente primeiro (ver
// normalizarIntelipost no server.ts) - pra achar QUANDO um status aconteceu
// pela primeira vez, pega o ULTIMO evento que bate esse rotulo na lista.
function acharEventoTimeline(tl, statusLabel) {
  var achados = (tl || []).filter(function(e) { return e.status === statusLabel; });
  return achados.length ? achados[achados.length - 1] : null;
}

// "Horário da Situação" do Titan vem como ISO de verdade (titan_bi_scraper.py
// converte datetime->isoformat antes de gravar no Supabase), mas a ordem das
// linhas no export do Power BI nao e garantida - ordena aqui pra garantir
// que o corte em "Embarcado" pega o primeiro evento com esse nome, nao um
// aleatorio.
function ordenarEventosTitan(eventos) {
  return (Array.isArray(eventos) ? eventos : []).slice().sort(function(a, b) {
    var da = String(a['Horário da Situação'] || a.horario || '');
    var db = String(b['Horário da Situação'] || b.horario || '');
    return da.localeCompare(db);
  });
}

function montarPassosStatusTorre(d, titan, ehGocase) {
  var tl = d.timeline || [];
  var passos = [];

  function passoIntelipost(label) {
    var ev = acharEventoTimeline(tl, label);
    passos.push({ label: label, iso: ev ? ev.iso : '', completo: !!ev, fonte: 'Intelipost' });
  }

  if (ehGocase) {
    TORRE_STATUS_GOCASE.forEach(passoIntelipost);
    return passos;
  }

  var eventosTitan = ordenarEventosTitan(titan && titan.eventos);
  var idxEmbarcado = -1;
  eventosTitan.forEach(function(e, i) {
    if (idxEmbarcado === -1 && /embarcad/i.test(String(e['Situação'] || e.situacao || ''))) idxEmbarcado = i;
  });
  var cortados = idxEmbarcado >= 0 ? eventosTitan.slice(0, idxEmbarcado + 1) : eventosTitan;
  cortados.forEach(function(e) {
    passos.push({
      label: String(e['Situação'] || e.situacao || '—'),
      iso: e['Horário da Situação'] || e.horario || '',
      completo: true,
      fonte: 'Titan',
    });
  });

  if (idxEmbarcado === -1) {
    // Correcao (a pedido da Ivna): "Despachado" na Intelipost e o mesmo
    // evento fisico que "Embarcado" no Titan - se a planilha do Supabase
    // ainda nao registrou o Embarcado (Cron do titan-watcher-worker so roda
    // a cada 5 min) mas a Intelipost ja confirma o despacho, o check fecha
    // mesmo assim, usando a data da Intelipost.
    var despachado = acharEventoTimeline(tl, 'Despachado');
    if (despachado) {
      passos.push({ label: 'Embarcado', iso: despachado.iso, completo: true, fonte: 'Intelipost', corrigido: true });
    } else {
      var carregando = !titan || titan.status === 'pendente' || titan.status === '';
      passos.push({ label: 'Embarcado', iso: '', completo: false, fonte: 'Titan', carregando: carregando });
    }
  }

  TORRE_STATUS_POS_EMBARQUE.forEach(passoIntelipost);
  return passos;
}

function renderTorreStatusChecklist(d, ehGocase) {
  var passos = montarPassosStatusTorre(d, torreState.titan, ehGocase);
  if (!passos.length) return '';
  var itensHtml = passos.map(function(p, i) {
    var estado = p.completo ? 'done' : (p.carregando ? 'loading' : 'pending');
    var icone = p.completo
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '';
    var sub = p.completo ? tData(p.iso) : (p.carregando ? 'Consultando Titan BI...' : 'Aguardando');
    var linha = i < passos.length - 1 ? '<div class="tsc-line' + (p.completo ? ' tsc-line-done' : '') + '"></div>' : '';
    return '<div class="tsc-step tsc-' + estado + '">'
      +   '<div class="tsc-dot">' + icone + '</div>'
      +   '<div class="tsc-label">' + tEsc(p.label) + (p.corrigido ? ' <span class="tsc-corrigido" title="Confirmado pela Intelipost - o Titan BI ainda não atualizou este pedido">✓*</span>' : '') + '</div>'
      +   '<div class="tsc-sub">' + sub + '</div>'
      + '</div>' + linha;
  }).join('');
  return '<div class="torre-status-checklist" id="torre-status-checklist">' + itensHtml + '</div>';
}

function renderTorreTicketsLista(d, tickets) {
  if (torreState.formAberto) return renderTorreForm(d);
